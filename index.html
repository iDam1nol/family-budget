body{margin:0;padding-bottom:calc(100px + env(safe-area-inset-bottom));min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(120% 55% at 90% -8%,#43208a 0%,transparent 60%),radial-gradient(90% 50% at -10% 108%,#4b1672 0%,transparent 58%),linear-gradient(180deg,#150c2b,#0d0620)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(1.6px 1.6px at 12% 14%,#fff,transparent),radial-gradient(1.2px 1.2px at 78% 9%,#e9d5ff,transparent),radial-gradient(1.4px 1.4px at 38% 31%,#fff,transparent),radial-gradient(1.2px 1.2px at 91% 44%,#fff,transparent),radial-gradient(1.6px 1.6px at 6% 58%,#f5d0fe,transparent),radial-gradient(1.2px 1.2px at 64% 66%,#fff,transparent),radial-gradient(1.4px 1.4px at 27% 82%,#e9d5ff,transparent),radial-gradient(1.2px 1.2px at 85% 90%,#fff,transparent);animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.85}}
.wrap{position:relative;max-width:560px;margin:0 auto;padding:14px 16px}
h1{font:600 22px/1.2 "Unbounded","Golos Text",sans-serif;letter-spacing:-.01em;margin:10px 0 6px}
.card{background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(8,2,24,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.mute{color:var(--mute);font-size:14px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.05);margin:6px 0;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.25)}
input::placeholder{color:#7f72a6}
button{border:0;border-radius:14px;padding:13px 18px;background:var(--grad);color:var(--brand-ink);font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(139,92,246,.35);transition:transform .15s,box-shadow .2s}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid #e9d5ff;outline-offset:2px}
button.ghost{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.link{background:none;color:var(--brand);padding:6px;font-weight:500;box-shadow:none}
button:disabled{opacity:.55}
button.full{width:100%;margin-top:10px}
.seg{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);padding:9px 15px;white-space:nowrap;font-weight:500;border-radius:99px;box-shadow:none}
.seg button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(139,92,246,.45)}
.seg.fit{gap:6px}
.seg.fit button{flex:1;padding:9px 6px;font-size:14px}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0}
.monthbar b::first-letter{text-transform:uppercase}
.monthbar b{font-family:"Unbounded","Golos Text",sans-serif;font-weight:500;font-size:15px}
.monthbar button{padding:8px 16px;background:rgba(255,255,255,.06);box-shadow:none;border:1px solid var(--line)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font:600 16px/1.3 "Unbounded","Golos Text",sans-serif}
.sum .mute b{display:inline;font:600 14px/1.3 "Golos Text",sans-serif;color:var(--ink)}
.day{font-size:13px;color:var(--brand);margin:16px 4px 4px;font-weight:500}
.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border:0}
.tx.off{opacity:.55}
.tx.off .amt{text-decoration:line-through}
.tx .amt{font-weight:600;white-space:nowrap}
.amt.inc{color:var(--good)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:rgba(167,139,250,.1);color:var(--mute);margin-left:4px}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#8b5cf6,#e879f9);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-100%);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.bar i.warn{background:linear-gradient(90deg,#f59e0b,#fcd34d)}.bar i.bad{background:linear-gradient(90deg,#e11d48,#fb7185)}
.cat{padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.cat:last-child{border:0}
.row{display:flex;justify-content:space-between;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--solid);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px;font-weight:500;box-shadow:none}
nav button.on{color:var(--brand)}
.fab{position:fixed;z-index:5;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;font-size:30px;line-height:1;padding:0;box-shadow:0 8px 24px rgba(139,92,246,.55);animation:pulse 3.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 8px 24px rgba(139,92,246,.55),0 0 0 0 rgba(192,132,252,.5)}70%,100%{box-shadow:0 8px 24px rgba(139,92,246,.55),0 0 0 18px rgba(192,132,252,0)}}
.sheet-bg{position:fixed;inset:0;background:rgba(10,4,26,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s}
.sheet{position:relative;background:linear-gradient(180deg,#26194a,#1a1033);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";position:absolute;top:8px;left:50%;width:42px;height:4px;margin-left:-21px;border-radius:9px;background:rgba(255,255,255,.22)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.big{font:700 28px/1.2 "Unbounded","Golos Text",sans-serif;letter-spacing:-.02em}
.err{color:var(--bad);font-size:14px;min-height:20px}
/* чек к операции */
.rcpt{display:flex;gap:10px;align-items:stretch;margin:4px 0 10px}
button.rcimg{flex:none;position:relative;width:96px;height:120px;padding:0;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--line);box-shadow:none}
button.rcimg img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
button.rcimg img.in{opacity:1}
button.rcimg span{position:absolute;left:0;right:0;bottom:0;padding:4px 0;font-size:12px;background:rgba(10,4,26,.7);color:#fff}
.rcbtns{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center}
.rcbtns button{margin:0}
/* итоги месяца */
.sumtop{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sumtop>div{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:12px}
.sumtop b{display:block;font-size:20px;margin:2px 0 6px;white-space:nowrap}
.sumrow .row{gap:10px}.sumrow .row>span:last-child{flex:none;white-space:nowrap}
.chip{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.08)}
.chip.up,.sumrow .up{color:var(--bad)}.chip.down,.sumrow .down{color:var(--good)}
.chip.up{background:rgba(251,113,133,.12)}.chip.down{background:rgba(110,231,183,.12)}
.sumrow .up,.sumrow .down{font-size:13px}
.sumwarn{padding:10px 12px;border-radius:14px;background:rgba(251,113,133,.12);color:#ffd5dc;font-size:14px}
.sumok{padding:10px 12px;border-radius:14px;background:rgba(110,231,183,.1);font-size:14px}
.sumh{font-weight:700;margin:16px 0 6px}
.sumrow{padding:7px 0}.sumrow .bar{margin-top:5px}
.sumtx{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}.sumtx span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.sumcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--ink);font-weight:400}
button.sumcard b{display:block}.sumcard .sumic{font-size:28px}.sumcard>span:nth-child(2){flex:1}
/* поиск по операциям */
.search{display:flex;gap:8px;align-items:center;margin:10px 0 0}
.search input{flex:1;min-width:0;margin:0}
.search button{flex:none;width:46px;height:46px;padding:0}
/* голосовой помощник */
.fab.mic{right:auto;left:18px;background:rgba(38,20,78,.92);border:1px solid var(--line);box-shadow:0 8px 24px rgba(8,2,24,.5);animation:none;display:grid;place-items:center}
.fab.mic svg,.micbig svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button.micbig{display:grid;place-items:center;width:96px;height:96px;margin:10px auto 4px;padding:0;border-radius:50%;box-shadow:0 10px 30px rgba(139,92,246,.5)}
button.micbig svg{width:40px;height:40px;stroke:#fff}
button.micbig.on{background:var(--bad);animation:micpulse 1.2s ease-out infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(248,113,113,.6)}100%{box-shadow:0 0 0 26px rgba(248,113,113,0)}}
.center{text-align:center}
.vcard{margin-top:10px;display:grid;gap:6px}
/* чат помощника: окно почти на весь экран, шапка, переписка, строка ввода снизу */
.sheet.chat{display:flex;flex-direction:column;height:94vh;height:94dvh;max-height:none;padding:0;overflow:hidden}
.sheet.chat::before{top:7px}
.chead{display:flex;align-items:center;gap:12px;padding:20px 14px 12px 16px;border-bottom:1px solid var(--line)}
.cava{flex:none;width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 4px 14px rgba(139,92,246,.45)}
.cava svg{width:22px;height:22px;fill:#fff}
.cava.sm{width:28px;height:28px;box-shadow:none}.cava.sm svg{width:15px;height:15px}
.chead .ttl{flex:1;min-width:0}.chead .ttl b{display:block;font-size:17px}.chead .ttl span{font-size:12px;color:var(--mute)}
.chead button{flex:none;width:40px;height:40px;padding:0;border-radius:50%;background:rgba(255,255,255,.07);box-shadow:none;display:grid;place-items:center;color:var(--ink)}
.chead button svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vchat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding:16px 14px}
.mrow{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.mrow.me{justify-content:flex-end}
.msg{max-width:82%;padding:10px 14px;border-radius:20px;line-height:1.5;font-size:15.5px;overflow-wrap:anywhere}
.msg.me{background:var(--grad);color:#fff;border-bottom-right-radius:6px;box-shadow:0 4px 14px rgba(139,92,246,.3)}
.msg.ai{background:rgba(255,255,255,.06);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.ai.bad{border-color:rgba(251,113,133,.45);color:#ffd5dc}
.vacts{display:grid;gap:6px;margin-top:8px}
.vact{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.35;padding:8px 10px;border-radius:12px;background:rgba(110,231,183,.09);color:var(--ink)}
.vact i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--good);color:#0d2b22;font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}
.vact.bad{background:rgba(251,113,133,.1)}.vact.bad i{background:var(--bad);color:#3a0a14}
.vact.off{opacity:.55;text-decoration:line-through}
.mtools{display:flex;gap:6px;margin-top:8px}
.mtools button{padding:5px 11px;font-size:13px;font-weight:500;border-radius:99px;background:rgba(255,255,255,.07);color:var(--mute);box-shadow:none}
.msg .vsrc{font-size:12px;color:var(--mute);margin-top:6px}
.msg .vsrc a{color:var(--brand)}
.vempty{margin:auto 0;text-align:center;padding:8px 4px}
.vempty .cava{width:64px;height:64px;margin:0 auto 12px}.vempty .cava svg{width:34px;height:34px}
.vempty b{display:block;font-size:20px;margin-bottom:4px}
.vempty p{color:var(--mute);margin:0 0 16px;font-size:14px}
.vsug{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.vsug button{padding:11px 12px;border-radius:16px;font-size:13.5px;font-weight:500;line-height:1.3;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);box-shadow:none;display:flex;gap:8px;align-items:flex-start;text-align:left}
.vsug button span{font-size:17px;line-height:1}
#vst{font-size:13px;color:var(--mute);text-align:center;padding:0 16px;min-height:0}
#vst:empty{display:none}
.cbar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(14,7,32,.55)}
.cin{flex:1;min-width:0;display:flex;align-items:flex-end;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:24px;padding:0 6px 0 14px;transition:border-color .2s}
.cin:focus-within{border-color:rgba(183,156,255,.6)}
.cin textarea{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;line-height:1.4;padding:12px 0;margin:0;resize:none;outline:0;max-height:132px}
.cin textarea::placeholder{color:var(--mute)}
.crec{flex:1;display:none;align-items:center;gap:10px;padding:13px 4px;font-size:15px}
.crec i{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blinkrec 1s infinite}
@keyframes blinkrec{50%{opacity:.25}}
.cbar.rec .cin textarea{display:none}.cbar.rec .crec{display:flex}
.cbar>button{flex:none;width:48px;height:48px;padding:0;border-radius:50%;display:grid;place-items:center}
.cbar>button svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cbar>button[hidden]{display:none}
button.micsm.on{background:var(--bad);animation:micpulse 1.2s ease-out infinite}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.vok{color:var(--good)}
.vreply{font-size:16px;line-height:1.45}
.empty{text-align:center;color:var(--mute);padding:26px 8px}
.empty::before{content:"\2726";display:block;font-size:30px;color:var(--brand);margin-bottom:8px;animation:twinkle 2.4s ease-in-out infinite alternate;text-shadow:0 0 18px rgba(192,132,252,.8)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.tile{position:relative;overflow:hidden;border:0;border-radius:28px;aspect-ratio:1/1;padding:16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:#fff;box-shadow:0 12px 26px rgba(10,2,30,.5),inset 0 1px 0 rgba(255,255,255,.28)}
.tile::after{content:"";position:absolute;width:150px;height:150px;right:-50px;top:-60px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 68%);pointer-events:none}
.tile:active{transform:scale(.96)}
.tile svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));animation:bob 5s ease-in-out infinite}
.t2 svg{animation-delay:-1.2s}.t3 svg{animation-delay:-2.4s}.t4 svg{animation-delay:-3.6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tile b{display:block;font:600 17px/1.2 "Unbounded","Golos Text",sans-serif}
.tile span{display:block;font-size:13px;font-weight:500;opacity:.92;margin-top:3px}
.t1{background:linear-gradient(145deg,#8b5cf6,#4c1d95)}
.t2{background:linear-gradient(145deg,#d946ef,#701a75)}
.t3{background:linear-gradient(145deg,#6366f1,#312e81)}
.t4{background:linear-gradient(145deg,#ec4899,#6b21a8)}
.t5{background:linear-gradient(135deg,#7c3aed,#c026d3 70%,#ec4899)}
.trip{background:linear-gradient(135deg,rgba(14,165,233,.28),rgba(139,92,246,.32) 55%,rgba(236,72,153,.3));border-color:rgba(125,211,252,.35);overflow:hidden}
.triphead{display:flex;align-items:center;gap:12px}
.triphead b{display:block;font:600 17px/1.2 "Unbounded","Golos Text",sans-serif}
.triphead .mute{font-size:13px}
.tripic{font-size:30px;line-height:1;animation:bob 3s ease-in-out infinite}
.tripkj{margin-left:auto;font-size:30px;opacity:.35;line-height:1}
.tripcd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tripcd>div{background:rgba(18,11,36,.45);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;min-width:0}
.tripcd b{display:block;font:700 24px/1.1 "Unbounded","Golos Text",sans-serif;font-variant-numeric:tabular-nums}
.tripcd span{display:block;font-size:11.5px;color:var(--mute);margin-top:3px}
.t7{background:linear-gradient(135deg,#312e81,#6d28d9 60%,#c026d3)}
.chatwrap{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
.chatwrap>.chathead,.chatwrap>.fbar,.chatwrap>.offline{flex:none}
.fchat{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:6px;padding:4px 2px 10px;margin:0 -2px}
.fchat>:first-child{margin-top:auto}
.fday{align-self:center;font-size:12px;color:var(--mute);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:3px 10px;margin:8px 0 2px}
.mrow.flash .msg{animation:flash 1.4s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px rgba(251,207,232,.85)}100%{box-shadow:none}}
.msg.fm{position:relative;padding-bottom:19px;min-width:84px;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.msg.fm .ftx{white-space:pre-wrap}
.msg.fm .fwho{display:block;font-size:12.5px;font-weight:700;margin-bottom:2px;white-space:normal}
.msg.fm .ft{position:absolute;right:12px;bottom:4px;font-size:10.5px;opacity:.65;white-space:nowrap}
.msg.fm a{color:inherit;text-decoration:underline}
.msg.fm.pend{opacity:.6}
.msg.ai.fm{background:rgba(40,26,76,.85)}
.msg.fm.hasimg{padding:5px 5px 19px;max-width:75%}
.msg.fm.hasimg .ftx,.msg.fm.hasimg .fwho,.msg.fm.hasimg .ffwd,.msg.fm.hasimg .fq{margin-left:8px;margin-right:8px}
.msg.fm.hasimg .ftx{margin-top:6px}
.fimg{display:block;width:100%;min-width:180px;max-height:320px;min-height:120px;object-fit:cover;border-radius:15px;background:rgba(255,255,255,.06)}
.ffwd{font-size:12px;opacity:.8;font-style:italic;margin-bottom:3px}
.fq{display:flex;flex-direction:column;border-left:3px solid currentColor;background:rgba(255,255,255,.1);border-radius:6px 10px 10px 6px;padding:4px 8px;margin:0 0 6px;max-width:100%;overflow:hidden}
.msg.me .fq{background:rgba(255,255,255,.18)}
.fq b{font-size:12.5px}.fq span{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar{padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.frow{display:flex;gap:8px;align-items:flex-end}
.fbar .cin{background:rgba(32,19,66,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 6px 20px rgba(8,2,24,.35)}
.frow>button{flex:none;width:48px;height:48px;padding:0;border-radius:50%;display:grid;place-items:center}
.frow>button svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.frow>.fatt{background:rgba(32,19,66,.92);border:1px solid var(--line);box-shadow:none}

function monthRange() {

// все, кто в семье (и родственники) -> S.circle; полноправные члены семьи -> S.members (фильтры, дела, «партнёр»)
function setPeople(list) {

// ---------- загрузка ----------
async function load() {
  const { data: ms, error } = await sb.from('members').select('*');
  if (error && isNetErr(error)) {
    const snap = lsGet('fb_snap');

      if (!S.booted) { S.booted = true; subscribe(); }
      return render();

    return fail({ message: 'Нет связи с сервером. Откройте приложение, когда появится интернет: после первого входа оно будет работать и без сети.' });
  }
  if (error) return fail(error);

  if (isRel()) { await refresh(); if (!S.booted) { S.booted = true; subscribe(); openFromLaunch(); } return; }

}

// ---------- офлайн: снимок данных и очередь новых операций ----------
const isNetErr = e => !!e && /failed to fetch|networkerror|network request|load failed|fetch|timed? ?out|abort|^proxy:|offline/i.test(String(e.message || e));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const SNAP_KEYS = ['cats', 'tx', 'members', 'household', 'products', 'pantry', 'staples', 'stores', 'prices', 'goals', 'deposits',
  'photos', 'rules', 'inbox', 'token', 'carry', 'carryReady', 'foodReady', 'goalsReady', 'photosReady', 'rulesReady', 'autoReady', 'recur', 'recurReady', 'tasks', 'tasksReady', 'recipes', 'recipeItems', 'meals', 'menuReady', 'shop', 'shopReady', 'circle', 'msgs', 'msgsReady'];
function saveSnap() {
  const o = { uid: S.user.id, at: Date.now(), month: S.month.getTime() };
  SNAP_KEYS.forEach(k => { o[k] = S[k]; });
  o.tx = (S.tx || []).filter(t => !t._pending);
  lsSet('fb_snap', o);
}
function applySnap(o) {
  SNAP_KEYS.forEach(k => { if (o[k] !== undefined) S[k] = o[k]; });
  S.txMonth = o.month;
  if (o.month !== S.month.getTime()) S.tx = [];
  if (o.circle && o.circle.length) setPeople(o.circle); else S.me = (S.members || []).find(m => m.user_id === S.user.id) || null;
}
const queue = () => lsGet('fb_q') || [];
function mergePending(list) {
  const [from, to] = monthRange();
  const have = new Set(list.map(t => t.id));
  const extra = queue().filter(q => !have.has(q.id) && q.date >= from && q.date < to)
    .map(q => ({ ...q, user_id: S.user.id, created_at: new Date().toISOString(), _pending: true }));
  return extra.length ? [...extra, ...list].sort((x, y) => y.date.localeCompare(x.date)) : list;
}
// операции, которые сервер не принял: не теряем, а показываем в «Не отправлено»
const failedQ = () => lsGet('fb_qfail') || [];
// отправить накопленные операции; true, если очередь пуста
async function flushQueue() {
  let q = queue();
  while (q.length) {
    const { _msg, ...row } = q[0];
    let { error } = await sb.from('transactions').insert(row);
    if (error && error.code === '23503' && row.category_id) {     // категорию успели удалить: отправляем без неё
      ({ error } = await sb.from('transactions').insert({ ...row, category_id: null }));
    }
    if (error && isNetErr(error)) return false;
    if (error && /jwt|PGRST30/i.test((error.code || '') + ' ' + error.message)) return false;   // вход устарел: отправим после его обновления
    if (error && error.code !== '23505') {
      lsSet('fb_qfail', [...failedQ(), { ...row, _msg: error.message }]);
      toast('Операция на ' + fmt(+row.amount) + ' не принята сервером. Она сохранена в «Не отправлено».', 6000);
    }
    q = q.slice(1); lsSet('fb_q', q);
  }
  return true;
}
function offlineBar() {

}

  });
}

async function refresh(opts = {}) {
  if (isRel()) return refreshRel(opts);
  if (queue().length) await flushQueue();
  const [from, to] = monthRange();
  const since = new Date(Date.now() - 62 * 864e5).toISOString();   // для сверки с банком: уведомления за два месяца
  const [c, t, m, pr, pa, sp, sr, pc, tk, ib, hh, cr, gl, gd, ph, ru, rp, bk, tq, rc, ri, mp, si, fm] = await Promise.all([
    sb.from('categories').select('*').order('name'),
    sb.from('transactions').select('*').gte('date', from).lt('date', to)
      .order('date', { ascending: false }).order('created_at', { ascending: false }),
    sb.from('members').select('*'),
    sb.from('products').select('*').order('name'),
    sb.from('pantry_items').select('*'),
    sb.from('staples').select('*'),

    sb.from('households').select('*').limit(1).single(),

    sb.from('meal_plan').select('*').gte('date', addDays(today(), -21)).order('date'),
    sb.from('shopping_items').select('*').order('created_at'),
    sb.from('family_messages').select('*').order('created_at', { ascending: false }).limit(300)
  ]);
  if ([c, t, m].some(x => x.error && isNetErr(x.error))) {
    // сети нет: остаёмся на том, что уже загружено, или берём сохранённый снимок
    const wasOffline = S.offline;
    S.offline = true;
    if (!S.cats.length && !S.tx.length) { const snap = lsGet('fb_snap'); if (snap && snap.uid === S.user.id) applySnap(snap); }
    if (S.txMonth !== S.month.getTime()) S.tx = [];      // операций этого месяца на телефоне нет: не показываем чужой месяц
    S.tx = mergePending(S.tx.filter(x => !x._pending));

    startPolling();
    return;

  if (hh.data) S.household = hh.data;

  S.carry = S.carryReady ? (+cr.data || 0) : 0;
  if (c.error || t.error || m.error) return fail(c.error || t.error || m.error);

  if (opts.poll && sig === S._sig) return;       // при периодическом опросе ничего не перерисовываем, если данные те же
  S._sig = sig;

  S.recipeItems = (S.menuReady && ri.data) || [];
  S.meals = (S.menuReady && mp.data) || [];

  S.staples = S.foodReady ? sp.data : [];
  S.stores = S.foodReady ? sr.data : [];
  S.prices = S.foodReady ? pc.data : [];
  S.goalsReady = !(gl.error || gd.error);
  S.goals = (S.goalsReady && gl.data) || [];
  S.deposits = (S.goalsReady && gd.data) || [];
  S.rulesReady = !ru.error;
  S.rules = (S.rulesReady && ru.data) || [];
  S.recurReady = !rp.error;
  S.recur = (S.recurReady && rp.data) || [];
  S.photosReady = !ph.error;
  S.photos = (S.photosReady && ph.data) || [];
  S.autoReady = !(tk.error || ib.error);
  S.token = S.autoReady ? tk.data : null;
  S.inbox = S.autoReady ? ib.data : [];

  render();
}

let pollTimer = null;
// периодическое обновление: нужно на своём хостинге (там нет realtime), при потере связи и при ожидающих операциях
function startPolling() {
  if (pollTimer || typeof setInterval !== 'function') return;
  pollTimer = setInterval(() => {
    if (!S.me || document.hidden) return;
    if (PROXY_MODE || S.offline || queue().length) refresh({ poll: true });
  }, 25000);
}

function subscribe() {
  startPolling();
  if (typeof window.addEventListener === 'function') window.addEventListener('online', () => { if (S.me) refresh(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) refresh(); });
  if (PROXY_MODE) return;                    // через proxy.php нет realtime: данные подтягиваются опросом
  let timer = null;
  const soon = () => { clearTimeout(timer); timer = setTimeout(refresh, 300); };
  let ch = sb.channel('household-live');
  ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: 'family_messages' }, () => loadMsgs());
  (isRel() ? ['photos'] : ['transactions', 'categories', 'products', 'pantry_items', 'staples', 'stores', 'prices', 'bank_inbox', 'households', 'goals', 'goal_deposits', 'photos', 'category_rules', 'recurring_payments', 'tasks', 'recipes', 'recipe_items', 'meal_plan', 'shopping_items']).forEach(tb => {
    ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: tb }, soon);
  });
  ch.subscribe();
}

function renderOnboarding() {
  $('#app').innerHTML = `<div class="wrap"><h1>Настройка семьи</h1>
  <div class="card"><b>Я первый — создаю семью</b>
    <input id="n1" placeholder="Ваше имя (например, Вадим)">
    <input id="hn" placeholder="Название семьи" value="Наша семья">
    <button class="full" id="mk">Создать</button></div>
  <div class="card"><b>Меня пригласили</b>
    <input id="n2" placeholder="Ваше имя">
    <input id="cd" placeholder="Код приглашения">
    <button class="full" id="jn">Присоединиться</button></div>
  <div class="err" id="err"></div>
  <button class="link" id="lo">Выйти</button></div>`;
  $('#lo').onclick = () => sb.auth.signOut();
  $('#mk').onclick = async () => {
    const uname = $('#n1').value.trim(); if (!uname) return $('#err').textContent = 'Введите имя';
    const { error } = await sb.rpc('create_household', { hname: $('#hn').value.trim() || 'Семья', uname });
    if (error) return $('#err').textContent = error.message;
    S.tab = 'more'; load();
  };
  $('#jn').onclick = async () => {
    const uname = $('#n2').value.trim(), code = $('#cd').value.trim();
    if (!uname || !code) return $('#err').textContent = 'Введите имя и код';
    const { error } = await sb.rpc('join_household', { code, uname });
    if (error) return $('#err').textContent = error.message === 'bad code' ? 'Неверный код' : error.message;
    load();
  };
}

// ---------- главный экран ----------
function visibleTx(src = S.tx) {
  const me = S.user.id, p = partner();
  return src.filter(t =>
    S.filter === 'all' ? true :
    S.filter === 'shared' ? t.shared :
    S.filter === 'mine' ? (!t.shared && t.user_id === me) :
    (!t.shared && p && t.user_id === p.user_id));
}

function go(tab) {
  if (tab === 'home') {
    if (history.state && history.state.t) history.back();
    else { S.tab = 'home'; S._enter = 'back'; render(); }
    return;
  }
  S.tab = tab;
  S._enter = 'fwd';
  history.pushState({ t: tab }, '');
  render();
}
// Окно снизу и просмотр фото добавляют шаг в историю: системная кнопка «Назад» (Android) закрывает их, а не экран.
let overlayHist = false, ignorePop = false;
function overlayOpened() {
  if (overlayHist) return;
  try { history.pushState(Object.assign({}, history.state, { overlay: 1 }), ''); overlayHist = true; } catch (e) {}
}
function overlayClosed() {            // закрыли кнопкой: убираем лишний шаг из истории
  if (!overlayHist) return;
  overlayHist = false; ignorePop = true;
  history.back();
}
window.addEventListener('popstate', e => {
  if (ignorePop) { ignorePop = false; return; }
  if (overlayHist) {
    overlayHist = false;
    if (viewerOpen) { closeViewer(); return; }
    if (dropSheet()) return;
    // закрывать нечего (окно уже убрано): обычный шаг назад по экранам
  }
  S.tab = (e.state && e.state.t) || 'home';
  S._enter = 'back';
  if (S.me) render();
});

const monthBar = () => `<div class="monthbar"><button class="ghost" id="pm">‹</button><b>${esc(monthLabel())}</b><button class="ghost" id="nm">›</button></div>`;

function render() {
  if (isRel() && !REL_TABS.includes(S.tab)) S.tab = 'home';
  const titles = { chat: 'Чат семьи', tx: 'Операции', lim: 'Лимиты', food: 'Продукты', photos: 'Фото', more: 'Семья', todo: 'Дела', settings: 'Настройки' };
  let body = '';
  if (S.tab === 'home') body = isRel() ? renderRelHome() : renderHome();
  else {
    body = `<div class="top"><button class="ghost" id="bk">‹ Главная</button><b>${titles[S.tab]}</b>${KANJI[S.tab] ? `<span class="kj jpf" lang="ja" aria-hidden="true">${KANJI[S.tab]}</span>` : ''}</div>`;
    if (S.tab === 'tx') body += monthBar() + renderTx();
    else if (S.tab === 'lim') body += monthBar() + limSeg() + (S.limSub === 'goals' ? renderGoals() : S.limSub === 'recur' ? renderRecur() : S.limSub === 'charts' ? renderCharts() + `<button class="ghost full" id="sumopen">📊 Подробные итоги ${MONTH_GEN[S.month.getMonth()]}</button>` : renderLimits());
    else if (S.tab === 'food') body += renderFood();
    else if (S.tab === 'photos') body += renderPhotos();
    else if (S.tab === 'settings') body += isRel() ? renderRelSettings() : renderSettings();
    else if (S.tab === 'chat') body = `<div class="chathead">${body}${S.msgsReady ? famPeople() : ''}</div>` + renderFam();
    else if (S.tab === 'todo') body += (S.todoSub === 'cal' ? monthBar() : '') + todoSeg() + (S.todoSub === 'cal' ? renderCal() : renderTodo());
    else body += renderMore();
  }
  // анимация только при смене экрана: обновления данных перерисовывают страницу незаметно
  const enter = S._enter ? ' enter-' + S._enter : '';
  S._enter = null;
  $('#app').innerHTML = `<div class="wrap${S.tab === 'chat' && S.msgsReady ? ' chatwrap' : ''}${enter}">${offlineBar()}${body}</div>${S.tab === 'more' || S.tab === 'settings' || S.tab === 'chat' || (isRel() && S.tab === 'home') ? '' : '<button class="fab" id="add">+</button>'}${S.tab === 'settings' || S.tab === 'chat' ? '' : `<button class="fab mic" id="mic" aria-label="Голосовой помощник">${MIC_SVG}</button>`}`;
  if ($('#mic')) $('#mic').onclick = openVoice;
  if ($('#pm')) { $('#pm').onclick = () => shiftMonth(-1); $('#nm').onclick = () => shiftMonth(1); }
  if ($('#add')) $('#add').onclick = () => S.tab === 'todo' ? (S.tasksReady ? openTask(null, { due: S.todoSub === 'cal' ? S.calDay : null }) : null) : S.tab === 'photos' ? pickPhotos() : S.tab === 'food' ? (!S.foodReady ? null : S.sub === 'buy' ? ($('#bin') && $('#bin').focus ? $('#bin').focus() : null) : S.sub === 'stock' ? openAddStock() : S.sub === 'menu' ? (S.menuReady ? openMealAdd(today()) : null) : openAddStaple()) : (S.tab === 'lim' && S.limSub === 'goals') ? openGoalForm(null) : (S.tab === 'lim' && S.limSub === 'recur' && S.recurReady) ? openRecurForm(null) : openAdd();
  if ($('#bk')) $('#bk').onclick = () => go('home');
  if ($('#retry')) $('#retry').onclick = () => refresh();
  if ($('#qfail')) $('#qfail').onclick = openFailed;
  if (S.tab === 'home' && !isRel()) countUp();
  if (S.tab === 'home') tickTrip();
  if (S.tab === 'chat') bindFam();
  if (S.tab === 'photos') hydratePhotos();
  if (S.tab === 'lim' && S.limSub === 'charts') hydrateCharts();
  if (S.tab === 'settings') hydratePush();
  if ($('#gear')) $('#gear').onclick = () => go('settings');
  if ($('#sumcard')) $('#sumcard').onclick = () => openSummary(ymAdd(ymNow(), -1));
  if ($('#sumopen')) $('#sumopen').onclick = () => openSummary(S.month.getFullYear() + '-' + pad(S.month.getMonth() + 1));
  $('#app').querySelectorAll('.tile').forEach(b => b.onclick = () => go(b.dataset.t));
  if ($('#aitile')) $('#aitile').onclick = openVoice;
  bindTab();
}

function greeting() {
  const h = new Date().getHours();
  return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
}
const calm = () => typeof requestAnimationFrame === 'function' && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// конфетти из фиолетово-розовых частиц (выше всего при пополнении цели)
function burst(n = 34) {
  sound('success');
  if (!calm()) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#8b5cf6', '#c084fc', '#e879f9', '#f0abfc', '#818cf8', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    const a = Math.random() * Math.PI - Math.PI, v = 140 + Math.random() * 260;
    p.style.cssText = `left:50%;top:62%;background:${colors[i % colors.length]};--dx:${Math.cos(a) * v}px;--dy:${Math.sin(a) * v + 220}px;--rot:${Math.random() * 720 - 360}deg;animation-delay:${Math.random() * .12}s`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 1900);
}

// плавный набор числа в главной карточке (один раз за запуск)
function countUp() {
  if (S._counted || !calm()) return;
  const el = document.querySelector('[data-n]');
  if (!el || !el.dataset.n) return;
  S._counted = true;
  const to = +el.dataset.n, t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(to * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// время вылета московское; после вылета карточка не показывается (сама пропадает с экрана в момент вылета)
const TRIP = { title: 'Вылет в Тайланд', at: '2026-11-26T12:25:00+03:00' };
const tripLeft = () => Date.parse(TRIP.at) - Date.now();
const plural = (k, a, b, c) => { const m = k % 100, d = k % 10; return m > 10 && m < 20 ? c : d === 1 ? a : d >= 2 && d <= 4 ? b : c; };
function tripParts(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return [[Math.floor(s / 86400), 'день', 'дня', 'дней'], [Math.floor(s / 3600) % 24, 'час', 'часа', 'часов'],
    [Math.floor(s / 60) % 60, 'минута', 'минуты', 'минут'], [s % 60, 'секунда', 'секунды', 'секунд']];
}
const tripCells = ms => tripParts(ms).map(([v, a, b, c], i) => `<div><b>${i ? pad(v) : v}</b><span>${plural(v, a, b, c)}</span></div>`).join('');
function renderTrip() {
  const left = tripLeft();
  if (!(left > 0)) return '';
  const when = new Date(TRIP.at).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' }).replace(',', ' в');
  return `<div class="card trip" id="trip"><div class="triphead"><span class="tripic" aria-hidden="true">✈️</span><div><b>${esc(TRIP.title)}</b><span class="mute">${esc(when)}</span></div><span class="jpf tripkj" lang="ja" aria-hidden="true">旅</span></div>
    <div class="tripcd" id="tripcd">${tripCells(left)}</div></div>`;
}
let tripTimer = null;
function tickTrip() {
  if (tripTimer) { clearInterval(tripTimer); tripTimer = null; }
  if (!$('#tripcd') || typeof setInterval !== 'function') return;
  tripTimer = setInterval(() => {
    const el = document.getElementById('tripcd');
    if (!el) { clearInterval(tripTimer); tripTimer = null; return; }
    const left = tripLeft();
    if (left <= 0) { clearInterval(tripTimer); tripTimer = null; burst(40); render(); return; }   // вылетели: карточка уходит
    el.innerHTML = tripCells(left);
  }, 1000);
}

function txRows(list, withYear) {
  let rows = '', last = '';
  const year = new Date().getFullYear();
  for (const t of list) {
    if (t.date !== last) {
      last = t.date;
      const d = new Date(t.date + 'T00:00');
      rows += `<div class="day">${d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short', ...(withYear && d.getFullYear() !== year ? { year: 'numeric' } : {}) })}</div>`;
    }
    const cat = S.cats.find(c => c.id === t.category_id);
    rows += `<div class="tx${t.excluded ? ' off' : ''}" data-id="${t.id}"><div>
      <div>${esc(cat ? cat.name : 'Без категории')}${t.shared ? '' : '<span class="badge">личное</span>'}${t._pending ? '<span class="badge">ждёт отправки</span>' : ''}${t.excluded ? '<span class="badge">не учитывается</span>' : ''}${t.receipt_path ? '<span class="badge">🧾 чек</span>' : ''}</div>

      <div class="amt ${t.kind === 'income' ? 'inc' : ''}">${t.kind === 'income' ? '+' : '−'}${fmt(+t.amount)}</div></div>`;
  }

}

// что искать в базе: заметка (ё = е), категории и люди по названию, сумма, если введено число
function txSearchFilter(q) {
  const qn = vnorm(q).replace(/["%_,()*\\]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!qn) return null;
  const ors = [`note.ilike."%${qn.replace(/е/g, '_')}%"`];
  const num = qn.replace(/\s/g, '').replace(',', '.');
  if (/^\d+(\.\d+)?$/.test(num)) ors.push(`amount.eq.${num}`);
  const cats = S.cats.filter(c => vnorm(c.name).includes(qn)).map(c => c.id);
  if (cats.length) ors.push(`category_id.in.(${cats.join(',')})`);
  const people = S.members.filter(m => vnorm(m.name).includes(qn)).map(m => m.user_id);
  if (people.length) ors.push(`user_id.in.(${people.join(',')})`);
  return ors.join(',');
}
// то же без сервера: по операциям, которые есть на телефоне
function txSearchLocal(list, q) {
  const qn = vnorm(q), num = qn.replace(/\s/g, '').replace(',', '.');
  const cname = id => vnorm((S.cats.find(c => c.id === id) || {}).name);
  return list.filter(t => vnorm(t.note).includes(qn) || cname(t.category_id).includes(qn) || vnorm(nameOf(t.user_id)).includes(qn) || (/^\d+(\.\d+)?$/.test(num) && +t.amount === +num));
}
async function txSearch(q) {
  const key = q + '|' + S.dataVer;
  if (S.searchKey === key) return;          // этот же поиск уже идёт
  S.searchKey = key;
  const f = txSearchFilter(q);
  let found = [], local = false;
  if (f) {
    const { data, error } = await sb.from('transactions').select('*').or(f).order('date', { ascending: false }).order('created_at', { ascending: false }).limit(200);
    if (error) { local = true; found = txSearchLocal(S.tx, q); } else found = data || [];
  }
  if (S.searchKey !== key) return;          // пока искали, текст поменяли
  S.found = found; S.foundKey = key; S.foundLocal = local;
  if (S.tab === 'tx' && S.q.trim() === q) { $('#txbody').innerHTML = txBody(); bindTxRows(); }
}
function bindTxRows() { $('#app').querySelectorAll('.tx').forEach(el => el.onclick = () => openTx(el.dataset.id)); }
// поле поиска: страницу не перерисовываем (иначе пропадёт клавиатура), меняем только список под ним
function bindTxSearch() {
  const inp = $('#txq');
  if (!inp) return;
  let timer = null;
  const apply = () => {
    if (S.q.trim().length < 2) { S.found = null; S.foundKey = ''; S.searchKey = ''; }
    if ($('#txqx')) $('#txqx').hidden = !S.q;
    $('#txbody').innerHTML = txBody(); bindTxRows();
  };
  inp.oninput = () => { S.q = inp.value; clearTimeout(timer); timer = setTimeout(apply, 300); };
  inp.onkeydown = e => { if (e.key === 'Enter') { clearTimeout(timer); apply(); if (inp.blur) inp.blur(); } };
  if ($('#txqx')) $('#txqx').onclick = () => { S.q = ''; inp.value = ''; clearTimeout(timer); apply(); };
}

// ---------- добавление операции ----------
function sheet(html) {
  document.querySelectorAll('.sheet-bg.out').forEach(x => x.remove());   // id закрывающегося окна не должны мешать новому
  const old = $('#sh');
  if (old) old.remove(); else { sound('open'); overlayOpened(); }
  const d = document.createElement('div');
  d.className = 'sheet-bg'; d.id = 'sh';
  d.innerHTML = `<div class="sheet">${html}</div>`;
  d.onclick = e => { if (e.target === d) closeSheet(); };
  document.body.appendChild(d);
}
// убрать окно с экрана (без истории)
function dropSheet() {
  const s = $('#sh');
  if (!s) return false;
  if (rec) stopRec(true);                 // закрыли окно помощника во время записи: микрофон выключаем
  sound('close');
  if (!calm()) { s.remove(); return true; }
  s.id = ''; s.classList.add('out');
  setTimeout(() => s.remove(), 180);
  return true;
}
const closeSheet = () => { if (dropSheet()) overlayClosed(); };

// pre: заполнить заранее (kind, amount, date, note) и onSaved — что сделать после сохранения
function openAdd(pre = {}) {
  let kind = pre.kind || 'expense', shared = true;
  const catOpts = k => S.cats.filter(c => c.kind === k).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')
    + '<option value="">Без категории</option><option value="__new">+ Новая категория…</option>';
  sheet(`${pre.title ? `<b>${esc(pre.title)}</b>` : ''}<div class="seg" id="kd"><button data-k="expense" class="${kind === 'expense' ? 'on' : ''}">Расход</button><button data-k="income" class="${kind === 'income' ? 'on' : ''}">Доход</button></div>
    <input id="am" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма, ₽" style="font-size:24px" value="${pre.amount || ''}">
    <select id="ct">${catOpts(kind)}</select>
    <input id="nt" placeholder="Заметка (необязательно)" value="${esc(pre.note || '')}">
    <input id="dt" type="date" value="${esc(pre.date || today())}">
    <div class="seg" id="sc"><button data-s="1" class="on">Общий</button><button data-s="0">Личный</button></div>
    <button class="ghost full" id="rcpick">🧾 Сфотографировать чек — заполню сам</button>
    <div class="mute" id="rcinfo"></div>
    <div class="err" id="err"></div>
    <button class="full" id="sv">Сохранить</button>`);
  let rfile = null;          // снимок чека: загрузим сразу после сохранения операции
  $('#rcpick').onclick = () => pickImage(async f => {
    rfile = f;
    $('#rcpick').textContent = '🧾 Чек выбран ✓ · заменить';
    $('#rcinfo').textContent = 'Читаю чек…';
    const r = await readReceipt(f);
    if (!$('#rcinfo')) return;                       // окно уже закрыли
    if (!r || !r.ok) { $('#rcinfo').textContent = r && r.why ? r.why + ' Заполните вручную — чек всё равно прикрепится.' : 'Не получилось прочитать чек. Заполните вручную — чек всё равно прикрепится.'; return; }
    // подставляем только то, что человек ещё не заполнил сам
    if (!$('#am').value) $('#am').value = r.amount;
    if (!$('#nt').value && r.store) $('#nt').value = r.store;
    if (r.date && r.date <= today() && r.date >= ymAdd(ymNow(), -12) + '-01') $('#dt').value = r.date;
    const c = kind === 'expense' && vfind(S.cats.filter(x => x.kind === 'expense'), r.category);
    if (c && !$('#ct').dataset.touched) $('#ct').value = c.id;
    $('#rcinfo').textContent = 'Заполнено по чеку: ' + fmt(r.amount) + (r.store ? ' · ' + r.store : '') + (r.date ? ' · ' + dayLabel(r.date) : '') + (c ? ' · ' + c.name : '') + '. Проверьте и сохраните.';
  });
  $('#am').focus();
  $('#ct').onchange = async () => {
    $('#ct').dataset.touched = '1';                  // выбрали сами: чек категорию не перебьёт
    if ($('#ct').value !== '__new') return;
    const name = prompt(kind === 'expense' ? 'Название новой категории расходов' : 'Название новой категории доходов');
    if (!name || !name.trim()) { $('#ct').innerHTML = catOpts(kind); return; }
    const { data, error } = await sb.from('categories')
      .insert({ household_id: S.household.id, name: name.trim(), kind }).select().single();
    if (error) { alert(error.message); $('#ct').innerHTML = catOpts(kind); return; }
    S.cats.push(data);
    $('#ct').innerHTML = catOpts(kind);
    $('#ct').value = data.id;
  };
  document.querySelectorAll('#kd button').forEach(b => b.onclick = () => {
    kind = b.dataset.k;
    document.querySelectorAll('#kd button').forEach(x => x.classList.toggle('on', x === b));
    $('#ct').innerHTML = catOpts(kind);
  });
  document.querySelectorAll('#sc button').forEach(b => b.onclick = () => {
    shared = b.dataset.s === '1';
    document.querySelectorAll('#sc button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#sv').onclick = async () => {
    const amount = parseFloat($('#am').value.replace(',', '.'));
    if (!(amount > 0)) return $('#err').textContent = 'Введите сумму';
    $('#sv').disabled = true;
    const row = {
      id: crypto.randomUUID(), household_id: S.household.id, kind, amount, category_id: $('#ct').value || null,
      shared, note: $('#nt').value.trim() || null, date: $('#dt').value || today()
    };
    const { error } = await sb.from('transactions').insert(row);
    if (error && isNetErr(error)) {                 // нет связи: сохраняем на телефоне, отправим позже
      lsSet('fb_q', [...queue(), row]);
      S.tx = mergePending(S.tx.filter(x => !x._pending));
      closeSheet(); render();
      return toast('Нет связи. Операция сохранена на телефоне и отправится сама.' + (rfile ? ' Чек без связи не сохранить: прикрепите его позже.' : ''), 5500);
    }
    if (error) { $('#sv').disabled = false; return $('#err').textContent = error.message; }
    if (pre.onSaved) await pre.onSaved();
    closeSheet();
    hanko();
    if (rfile) {
      const msg = toast('Загружаем чек…', 0);
      try { await uploadReceipt({ id: row.id, receipt_path: null }, rfile); msg.remove(); }
      catch (e) { msg.remove(); toast('Операция сохранена, а чек нет: ' + e.message, 5500); }
    }
    refresh();
  };
}

      <div class="mute">Для переводов между своими счетами, возвратов и пар «пришло и ушло». Операция останется в списке, но не войдёт ни в одну сумму.</div>
      <div class="err" id="eerr"></div>

    ${own ? '<button class="full" id="dl" style="background:var(--bad);color:#fff">Удалить</button>' : '<div class="mute">Менять и удалять может автор записи или создатель семьи.</div>'}
    <button class="ghost full" id="cl">Закрыть</button>`);

    const { data, error } = await sb.from('transactions').update(patch).eq('id', id).select();

    const { data, error } = await sb.from('transactions').update({ category_id: $('#ec').value || null }).eq('id', id).select();
    if (error) return alert(error.message);
    if (!data || !data.length) return alert('Не удалось сохранить: нет прав. Проверьте, что обновление базы выполнено.');

    const cid = $('#ec').value;

    if (t.receipt_path) bucket().remove([t.receipt_path]).catch(() => {});
    closeSheet(); refresh();
  };
  bindReceipt(t, own);
}

// ---------- чек к операции ----------
// Снимок лежит в закрытом хранилище семьи: family-photos/<семья>/receipts/<операция>-<метка>.jpg (update-18.sql)
function receiptBox(t, own) {
  if (t.receipt_path) return `<div class="rcpt"><button class="rcimg" id="rcopen" aria-label="Открыть чек"><img data-p="${esc(t.receipt_path)}" alt="Чек"><span>🧾 Чек</span></button>
    ${own ? '<div class="rcbtns"><button class="ghost" id="rcch">Заменить</button><button class="ghost" id="rcdel" style="color:var(--bad)">Убрать</button></div>' : ''}</div>`;
  return own ? '<button class="ghost full" id="rcadd">🧾 Прикрепить чек</button>' : '';
}
function pickImage(cb) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
  inp.onchange = () => { const f = inp.files && inp.files[0]; inp.remove(); if (f) cb(f); };
  document.body.appendChild(inp);
  inp.click();
}
// сжать, загрузить и записать в операцию; старый снимок удаляется. Возвращает путь или бросает ошибку с понятным текстом
async function uploadReceipt(t, file) {
  const img = await toJpeg(file, 1800, .85);                 // текст чека должен читаться
  const path = `${S.household.id}/receipts/${t.id}-${Date.now().toString(36)}.jpg`;
  const up = await bucket().upload(path, img.blob, { contentType: 'image/jpeg' });
  if (up.error) throw new Error(/bucket|not found/i.test(up.error.message) ? 'Хранилище фото не настроено: выполните update-7.sql' : up.error.message);
  const { data, error } = await sb.from('transactions').update({ receipt_path: path }).eq('id', t.id).select();
  if (error || !data || !data.length) {
    await bucket().remove([path]).catch(() => {});
    throw new Error(error && /receipt_path|column|schema cache/i.test(error.message) ? 'Выполните update-18.sql в Supabase' : error ? error.message : 'нет прав на эту операцию');
  }
  if (t.receipt_path && t.receipt_path !== path) bucket().remove([t.receipt_path]).catch(() => {});
  t.receipt_path = path;
  return path;
}
function bindReceipt(t, own) {
  if (t.receipt_path && $('#rcopen')) {
    $('#rcopen').onclick = () => openReceipt(t.receipt_path);
    signUrls([t.receipt_path]).then(applyUrls).catch(() => {});
  }
  const attach = () => pickImage(async f => {
    const msg = toast('Загружаем чек…', 0);
    try { await uploadReceipt(t, f); msg.remove(); toast('Чек прикреплён'); if ($('#sh')) openTx(t.id); refresh(); }
    catch (e) { msg.remove(); toast('Чек не загрузился: ' + e.message, 5000); }
  });
  if (own && $('#rcadd')) $('#rcadd').onclick = attach;
  if (own && $('#rcch')) $('#rcch').onclick = attach;
  if (own && $('#rcdel')) $('#rcdel').onclick = async () => {
    if (!confirm('Убрать снимок чека из операции?')) return;
    const old = t.receipt_path;
    const { data, error } = await sb.from('transactions').update({ receipt_path: null }).eq('id', t.id).select();
    if (error || !data || !data.length) return toast('Не удалось: ' + (error ? error.message : 'нет прав'), 4000);
    bucket().remove([old]).catch(() => {});
    t.receipt_path = null;
    openTx(t.id); refresh();
  };
}
// прочитать чек через помощника (Gemini): { ok, amount, store, date, category, items } или { ok: false, why }
async function readReceipt(file) {
  try {
    const img = await toJpeg(file, 1600, .85);
    const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(img.blob); });
    const { data, error } = await sb.functions.invoke(VOICE_FN, { body: { mode: 'receipt', image: b64, mime: 'image/jpeg',
      ctx: { today: today(), 'Категории расходов': S.cats.filter(c => c.kind === 'expense').map(c => c.name) } } });
    if (error) return { ok: false, why: (await voiceErr(error)).replace('Помощник не ответил. Попробуйте ещё раз.', 'Помощник не ответил.') };
    return data && data.receipt ? data.receipt : { ok: false };
  } catch (e) { return { ok: false }; }
}

// просмотр чека на весь экран (как фото); «Назад» на Android закрывает
async function openReceipt(path) {
  closeViewer();
  viewerId = null;
  const v = document.createElement('div');
  v.className = 'viewer'; v.id = 'viewer';
  v.innerHTML = `<div class="vt"><button class="ghost" id="vx">Закрыть</button><span>Чек</span></div>
    <div class="vi"><img id="vimg" data-p="${esc(path)}" alt="Чек"></div>
    <div class="vb"><button class="ghost full" id="vs">Сохранить на телефон</button></div>`;
  document.body.appendChild(v);
  viewerOpen = true;
  overlayOpened();
  document.addEventListener('keydown', viewerKey);
  v.querySelector('#vx').onclick = closeViewerUI;
  v.querySelector('#vs').onclick = async () => {
    const { data, error } = await bucket().createSignedUrl(path, 600);
    if (error) return toast('Не удалось получить файл', 3000);
    try {
      const blob = await (await fetch(data.signedUrl)).blob();
      const file = new File([blob], 'chek.jpg', { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    window.open(data.signedUrl, '_blank');
  };
  await signUrls([path]);
  applyUrls();
}

function editLimit(id) {
  const c = S.cats.find(x => x.id === id); if (!c) return;
  sheet(`<b>Категория</b>
    <input id="cn" value="${esc(c.name)}" placeholder="Название">
    <input id="cl" type="number" inputmode="decimal" min="0" step="1" value="${+c.monthly_limit || ''}" placeholder="Лимит на месяц, ₽ (пусто — без лимита)">

    <button class="full" id="sv">Сохранить</button>

    const name = $('#cn').value.trim();

}

// ---------- Продукты ----------
const UNITS = { 'шт': ['count', 1], 'г': ['mass', 1], 'кг': ['mass', 1000], 'мл': ['volume', 1], 'л': ['volume', 1000] };
const KIND_UNITS = { count: ['шт'], mass: ['г', 'кг'], volume: ['мл', 'л'] };
const PRICE_UNIT = { count: 'шт', mass: 'кг', volume: 'л' };
const PRICE_DIV = { count: 1, mass: 1000, volume: 1000 };
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const norm = s => String(s || '').trim().toLowerCase().replace(/ё/g, 'е');
const parseNum = v => parseFloat(String(v).replace(',', '.'));
const prod = id => S.products.find(p => p.id === id);

function fmtQty(n, kind) {
  n = +n;
  if (kind === 'count') return nf.format(n) + ' шт';
  const big = n >= 1000;
  return nf.format(big ? n / 1000 : n) + ' ' + (kind === 'mass' ? (big ? 'кг' : 'г') : (big ? 'л' : 'мл'));
}

// «300», «1.5 кг», «500 мл» -> число в базовых единицах (или null)
function parseQty(str, kind) {
  const m = String(str).trim().toLowerCase().match(/^([\d.,]+)\s*(шт|г|кг|мл|л|g|kg|ml|l)?$/);
  if (!m) return null;
  const alias = { g: 'г', kg: 'кг', ml: 'мл', l: 'л' };
  const n = parseNum(m[1]);
  if (!(n >= 0)) return null;
  const u = alias[m[2]] || m[2] || KIND_UNITS[kind][0];
  if (UNITS[u][0] !== kind) return null;
  return n * UNITS[u][1];
}

const isFresh = b => !b.expires_on || b.expires_on >= today();
const haveQty = pid => S.pantry.filter(b => b.product_id === pid && isFresh(b)).reduce((s, b) => s + +b.qty, 0);

function shortages() {
  return S.staples.map(st => {
    const p = prod(st.product_id);
    if (!p) return null;
    const have = haveQty(p.id);
    return { st, p, have, need: Math.max(0, +st.min_qty - have) };
  }).filter(Boolean);
}
// что докупить: минимум «Всегда дома» плюс продукты для блюд из меню на ближайшие 7 дней
function missing() {
  const req = {};
  S.staples.forEach(st => { req[st.product_id] = (req[st.product_id] || 0) + +st.min_qty; });
  const menu = menuNeeds();
  Object.keys(menu).forEach(pid => { req[pid] = (req[pid] || 0) + menu[pid]; });
  return Object.keys(req).map(pid => {
    const p = prod(pid);
    if (!p) return null;
    const have = haveQty(pid);
    return { st: S.staples.find(x => x.product_id === pid) || null, p, have, need: Math.max(0, req[pid] - have), menu: menu[pid] || 0 };
  }).filter(x => x && x.need > 0);
}

function expInfo(d) {
  if (!d) return { text: '', cls: '' };
  const days = Math.round((new Date(d + 'T00:00') - new Date(today() + 'T00:00')) / 86400000);
  const dt = new Date(d + 'T00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  if (days < 0) return { text: 'просрочено (' + dt + ')', cls: 'bad' };
  if (days <= 3) return { text: 'до ' + dt + (days === 0 ? ' (сегодня)' : ' (осталось дн.: ' + days + ')'), cls: 'warn' };
  return { text: 'до ' + dt, cls: '' };
}

// ----- меню на неделю -----
const recipeItemsOf = rid => S.recipeItems.filter(x => x.recipe_id === rid);
const recipeOf = id => S.recipes.find(r => r.id === id);
// сколько нужно продуктов на неприготовленные блюда с сегодня на 7 дней вперёд
function menuNeeds() {
  const from = today(), to = addDays(from, 7), need = {};
  S.meals.filter(m => !m.cooked && m.date >= from && m.date < to).forEach(m =>
    recipeItemsOf(m.recipe_id).forEach(it => { need[it.product_id] = (need[it.product_id] || 0) + +it.qty; }));
  return need;
}
// чего не хватает дома для одного блюда
function recipeLack(rid) {
  return recipeItemsOf(rid).map(it => ({ p: prod(it.product_id), lack: +it.qty - haveQty(it.product_id) }))
    .filter(x => x.p && x.lack > 0);
}
const lackText = lack => lack.map(x => x.p.name + ' ' + fmtQty(x.lack, x.p.kind)).join(', ');
const weekStart = () => { const d = new Date(today() + 'T12:00:00'); return addDays(today(), -((d.getDay() + 6) % 7) + 7 * S.menuWeek); };
const menuNeedSql = '<div class="card"><b>Меню</b><p class="mute">Выполните файл update-13.sql в Supabase (SQL Editor → New query → Run), затем обновите приложение.</p></div>';

function openRecipe(id) {
  const r = id ? recipeOf(id) : null;
  if (id && !r) return;
  const items = r ? recipeItemsOf(r.id) : [];
  const rows = items.length + 3;
  const qtyStr = it => { const p = prod(it.product_id); if (!p) return ''; const big = p.kind !== 'count' && +it.qty >= 1000;
    const u = p.kind === 'count' ? 'шт' : p.kind === 'mass' ? (big ? 'кг' : 'г') : (big ? 'л' : 'мл'); return +(+it.qty / UNITS[u][1]).toFixed(3) + ' ' + u; };
  sheet(`<b>${r ? 'Рецепт' : 'Новый рецепт'}</b>
    <input id="rnm" value="${esc(r ? r.name : '')}" placeholder="Название, например: Омлет">
    <div class="mute">Продукты на одно приготовление</div>
    <datalist id="rpl">${S.products.map(p => `<option value="${esc(p.name)}">`).join('')}</datalist>
    ${Array.from({ length: rows }, (_, i) => { const it = items[i], p = it && prod(it.product_id);
      return `<div class="row" style="gap:8px"><input id="ri${i}" list="rpl" value="${esc(p ? p.name : '')}" placeholder="Продукт" style="flex:1" autocomplete="off"><input id="rq${i}" value="${esc(it ? qtyStr(it) : '')}" placeholder="300 г" style="width:96px"></div>`; }).join('')}
    <div class="err" id="err"></div>
    <button class="full" id="rsv">Сохранить</button>
    ${r ? '<button class="ghost full" id="rdl" style="color:var(--bad)">Удалить рецепт</button>' : ''}
    <button class="link full" id="cl">Назад</button>`);
  $('#cl').onclick = openRecipes;
  $('#rsv').onclick = async () => {
    const err = t => { $('#err').textContent = t; };
    const name = $('#rnm').value.trim();
    if (!name) return err('Введите название');
    const list = [];
    for (let i = 0; i < rows; i++) {
      const pn = $('#ri' + i).value.trim(), qs = $('#rq' + i).value.trim();
      if (!pn && !qs) continue;
      if (!pn) return err('Укажите продукт для количества «' + qs + '»');
      const p = S.products.find(x => norm(x.name) === norm(pn));
      let kind = p && p.kind, q;
      if (p) q = parseQty(qs || '1', p.kind);
      else {                                          // новый продукт: единица из количества
        const m = qs.toLowerCase().match(/(шт|кг|г|мл|л)\s*$/);
        kind = m ? UNITS[m[1]][0] : 'count';
        q = parseQty(qs || '1', kind);
      }
      if (!(q > 0)) return err('Не понял количество у «' + pn + '». Пример: ' + KIND_UNITS[kind].map(u => '2 ' + u).join(' или '));
      list.push({ pn, p, kind, q });
    }
    $('#rsv').disabled = true;
    const fail = e => { $('#rsv').disabled = false; err(/recipe|relation|schema cache/i.test(e.message) ? 'Сначала выполните update-13.sql в Supabase' : e.message); };
    for (const x of list) {
      if (x.p) continue;
      const { data, error } = await sb.from('products').insert({ household_id: S.household.id, name: x.pn, kind: x.kind }).select().single();
      if (error) return fail(error);
      x.p = data; S.products.push(data);
    }
    let rid = id;
    if (r) {
      const { error } = await sb.from('recipes').update({ name }).eq('id', id);
      if (error) return fail(error);
      const { error: e2 } = await sb.from('recipe_items').delete().eq('recipe_id', id);
      if (e2) return fail(e2);
    } else {
      const { data, error } = await sb.from('recipes').insert({ household_id: S.household.id, name }).select().single();
      if (error) return fail(error);
      rid = data.id;
    }
    if (list.length) {
      const { error } = await sb.from('recipe_items').insert(list.map(x => ({ recipe_id: rid, household_id: S.household.id, product_id: x.p.id, qty: x.q })));
      if (error) return fail(error);
    }
    await refresh();
    openRecipes();
  };
  if ($('#rdl')) $('#rdl').onclick = async () => {
    if (!confirm('Удалить рецепт «' + r.name + '»? Он пропадёт и из меню.')) return;
    const { error } = await sb.from('recipes').delete().eq('id', id);
    if (error) return $('#err').textContent = error.message;
    await refresh();
    openRecipes();
  };
}

// приготовили: списываем продукты из запасов, сначала партии с ближайшим сроком годности
async function cookMeal(mid) {
  const m = S.meals.find(x => x.id === mid);
  if (!m) return;
  $('#mck').disabled = true;
  const notEnough = [];
  for (const it of recipeItemsOf(m.recipe_id)) {
    let rest = +it.qty;
    const batches = S.pantry.filter(b => b.product_id === it.product_id && isFresh(b))
      .sort((a, b) => (a.expires_on || '9999').localeCompare(b.expires_on || '9999'));
    for (const b of batches) {
      if (rest <= 0) break;
      const take = Math.min(rest, +b.qty);
      const { error } = take >= +b.qty ? await sb.from('pantry_items').delete().eq('id', b.id)
        : await sb.from('pantry_items').update({ qty: Math.round((+b.qty - take) * 1000) / 1000 }).eq('id', b.id);
      if (error) { $('#mck').disabled = false; return $('#err').textContent = error.message; }
      rest -= take;
    }
    const p = prod(it.product_id);
    if (rest > 0 && p) notEnough.push(p.name + ' ' + fmtQty(rest, p.kind));
  }
  const { error } = await sb.from('meal_plan').update({ cooked: true }).eq('id', mid);
  if (error) { $('#mck').disabled = false; return $('#err').textContent = error.message; }
  sound('success');
  closeSheet(); refresh();
  toast(notEnough.length ? 'Списано. Дома не хватило: ' + notEnough.join(', ') : 'Приготовлено, продукты списаны', notEnough.length ? 6000 : 2600);
}

// ----- сканер штрихкода -----
let scanReader = null;
function stopScan() {
  try { if (scanReader) scanReader.reset(); } catch (e) {}
  scanReader = null;
  const o = $('#scan');
  if (o) o.remove();
}
function loadZXing() {
  return new Promise((res, rej) => {
    if (window.ZXing) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function scanBarcode(done) {
  stopScan();
  const o = document.createElement('div');
  o.id = 'scan'; o.className = 'sheet-bg'; o.style.zIndex = 20;
  o.innerHTML = `<div class="sheet"><b>Наведите камеру на штрихкод</b>
    <video id="vid" playsinline muted style="width:100%;border-radius:12px;background:#000;margin-top:8px;max-height:50vh"></video>
    <div class="mute" id="smsg">Запускаю камеру…</div>
    <button class="ghost full" id="scx">Отмена</button></div>`;
  document.body.appendChild(o);
  $('#scx').onclick = stopScan;
  const say = t => { const m = $('#smsg'); if (m) m.textContent = t; };
  try { await loadZXing(); } catch (e) { return say('Сканер не загрузился. Проверьте интернет и попробуйте ещё раз.'); }
  try {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128]);
    scanReader = new ZXing.BrowserMultiFormatReader(hints, 300);
    let got = false;
    await scanReader.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } } }, 'vid', res => {
      if (res && !got) { got = true; const code = res.getText(); stopScan(); done(code); }
    });
    say('Ищу штрихкод…');
  } catch (e) {
    say('Нет доступа к камере. Разрешите камеру для этого сайта в настройках браузера или введите название вручную.');
  }
}

// Название по штрихкоду: открытая база Open Food Facts (может не знать часть товаров)
async function lookupBarcode(code) {
  try {
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) +
      '.json?fields=product_name,product_name_ru,brands,quantity', { signal: ctl.signal });
    clearTimeout(tm);
    const j = await r.json();
    if (j.status !== 1 || !j.product) return null;
    const p = j.product;
    const base = (p.product_name_ru || p.product_name || '').trim();
    const brand = (p.brands || '').split(',')[0].trim();
    if (!base) return null;
    let pack = null;
    const m = String(p.quantity || '').toLowerCase().match(/^\s*([\d.,]+)\s*(kg|g|ml|l)\b/);
    if (m) pack = { n: parseNum(m[1]), unit: { kg: 'кг', g: 'г', ml: 'мл', l: 'л' }[m[2]] };
    return { name: brand && !norm(base).includes(norm(brand)) ? base + ' ' + brand : base, pack };
  } catch (e) { return null; }
}

// ----- форма: название + штрихкод + количество (+ срок годности) -----
function foodForm(o) {
  let barcode = null;
  sheet(`<b>${o.title}</b>
    <div class="row" style="gap:8px"><input id="pn" list="pl" placeholder="Название продукта" autocomplete="off" style="flex:1"><button class="ghost" id="sc" style="margin:6px 0">Скан</button></div>
    <datalist id="pl">${S.products.map(p => `<option value="${esc(p.name)}">`).join('')}</datalist>
    <div class="mute" id="pinfo"></div>
    <div class="row" style="gap:8px"><input id="pq" type="number" inputmode="decimal" min="0" step="any" placeholder="${o.qtyLabel}" style="flex:1">
      <select id="pu" style="width:90px">${Object.keys(UNITS).map(u => `<option>${u}</option>`).join('')}</select></div>
    ${o.expiry ? '<div class="mute">Срок годности (необязательно)</div><input id="pd" type="date">' : ''}
    <div class="err" id="err"></div>
    <button class="full" id="sv">Сохранить</button>`);
  const err = t => { $('#err').textContent = t; };
  const syncUnit = () => {
    const p = S.products.find(x => norm(x.name) === norm($('#pn').value));
    const cur = $('#pu').value;
    const opts = p ? KIND_UNITS[p.kind] : Object.keys(UNITS);
    $('#pu').innerHTML = opts.map(u => `<option>${u}</option>`).join('');
    if (opts.includes(cur)) $('#pu').value = cur;
  };
  $('#pn').oninput = syncUnit;
  if (o.prefill) { $('#pn').value = o.prefill; syncUnit(); }
  $('#sc').onclick = () => scanBarcode(async code => {
    barcode = code;
    const known = S.products.find(x => x.barcode === code);
    if (known) { $('#pn').value = known.name; syncUnit(); $('#pinfo').textContent = 'Узнал по вашему списку'; return; }
    $('#pinfo').textContent = 'Ищу название…';
    const r = await lookupBarcode(code);
    if (r) {
      $('#pn').value = r.name; syncUnit();
      $('#pinfo').textContent = 'Нашёл по штрихкоду, проверьте название';
      if (r.pack && !$('#pq').value) { $('#pq').value = r.pack.n; $('#pu').value = r.pack.unit; }
    } else {
      $('#pinfo').textContent = 'Штрихкода ' + code + ' нет в базе. Введите название, в следующий раз узнаю сам.';
    }
  });
  $('#sv').onclick = async () => {
    const name = $('#pn').value.trim();
    const q = parseNum($('#pq').value);
    const unit = $('#pu').value;
    if (!name) return err('Введите название');
    if (!(q > 0)) return err('Введите количество');
    const [kind, mult] = UNITS[unit];
    let p = (barcode && S.products.find(x => x.barcode === barcode)) || S.products.find(x => norm(x.name) === norm(name));
    if (p && p.kind !== kind) return err('Для «' + p.name + '» единицы: ' + KIND_UNITS[p.kind].join(' / '));
    $('#sv').disabled = true;
    if (!p) {
      const { data, error } = await sb.from('products')
        .insert({ household_id: S.household.id, name, kind, barcode }).select().single();
      if (error) { $('#sv').disabled = false; return err(error.message); }
      p = data; S.products.push(p);
    } else if (barcode && !p.barcode) {
      await sb.from('products').update({ barcode }).eq('id', p.id);
    }
    const e = await o.onSave(p, q * mult);
    if (e) { $('#sv').disabled = false; return err(e); }
    closeSheet(); refresh();
  };
}

// ----- «Что докупить»: нехватка, цены, итог по магазинам -----
const priceOf = (pid, sid) => { const r = S.prices.find(x => x.product_id === pid && x.store_id === sid); return r ? +r.price : null; };
const lineCost = (it, price) => price == null ? null : it.need / PRICE_DIV[it.p.kind] * price;
function storeTotals(items, store, override) {
  let total = 0, unknown = 0;
  items.forEach(it => {
    const price = override ? override[it.p.id] : priceOf(it.p.id, store.id);
    const c = lineCost(it, price);
    if (c == null) unknown++; else total += c;
  });
  return { total, unknown };
}
const shopText = items => 'Список покупок:\n' + items.map(it => '• ' + it.p.name + ' — ' + fmtQty(it.need, it.p.kind)).join('\n');
function copyText(t) {
  try { if (navigator.clipboard) return navigator.clipboard.writeText(t); } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  } catch (e) {}
}

function openShop() {

      <div class="mute">${x.unknown ? 'нет цены у позиций: ' + x.unknown : 'цены есть на всё'}${best !== null && x.unknown === 0 && x.total === best ? ' · дешевле всего' : ''}</div></div>`).join('')

function openStore(sid) {
  const st = S.stores.find(x => x.id === sid);
  if (!st) return;
  const items = missing();
  const local = {};
  items.forEach(it => { local[it.p.id] = priceOf(it.p.id, sid); });
  sheet(`<div class="top" style="margin:0 0 6px"><button class="ghost" id="bk2">‹ Назад</button><b>${esc(st.name)}</b></div>
    <div class="big" id="tot"></div><div class="mute" id="unk"></div>
    <div class="card">${items.map(it => `<div class="pi"><div><div>${esc(it.p.name)}</div>
      <div class="mute">${fmtQty(it.need, it.p.kind)} · цена за ${PRICE_UNIT[it.p.kind]}</div></div>
      <div style="text-align:right"><input data-pid="${it.p.id}" type="number" inputmode="decimal" step="any" min="0" value="${local[it.p.id] ?? ''}" placeholder="₽" style="width:92px;margin:0;text-align:right">
      <div class="mute" data-cost="${it.p.id}"></div></div></div>`).join('')}</div>
    <button class="full" id="go">Перейти в магазин</button>

    <button class="ghost full" id="cp">Скопировать список</button>
    <button class="ghost full" id="bought">Купил, добавить в запасы</button>
    <button class="link full" id="es">Изменить магазин</button>`);
  $('#bought').onclick = () => openBought(sid);
  const calc = () => {
    const t = storeTotals(items, st, local);
    $('#tot').textContent = fmt(t.total);
    $('#unk').textContent = t.unknown ? 'Нет цены у позиций: ' + t.unknown + ' (итог без них)' : 'Цены указаны на все позиции';
    items.forEach(it => {
      const c = lineCost(it, local[it.p.id]);
      const el = document.querySelector('#sh [data-cost="' + it.p.id + '"]');
      if (el) el.textContent = c == null ? '' : '≈ ' + fmt(c);
    });
  };
  calc();
  $('#bk2').onclick = openShop;
  $('#es').onclick = () => editStore(sid);
  $('#cp').onclick = () => { copyText(shopText(items)); $('#msg').textContent = 'Список скопирован'; };
  $('#go').onclick = () => {
    copyText(shopText(items));
    if (st.url) window.open(/^https?:\/\//i.test(st.url) ? st.url : 'https://' + st.url, '_blank', 'noopener');
    else $('#msg').textContent = 'Список скопирован. Укажите адрес сайта в «Изменить магазин», чтобы переходить прямо отсюда.';
  };
  document.querySelectorAll('#sh input[data-pid]').forEach(inp => {
    const pid = inp.dataset.pid;
    inp.oninput = () => { const v = parseNum(inp.value); local[pid] = v >= 0 ? v : null; calc(); };
    inp.onchange = async () => {
      const v = parseNum(inp.value);
      if (inp.value.trim() === '') {
        const { error } = await sb.from('prices').delete().eq('product_id', pid).eq('store_id', sid);
        if (!error) S.prices = S.prices.filter(r => !(r.product_id === pid && r.store_id === sid));
      } else if (v >= 0) {
        const { data, error } = await sb.from('prices').upsert(
          { household_id: S.household.id, product_id: pid, store_id: sid, price: v, updated_at: new Date().toISOString() },
          { onConflict: 'product_id,store_id' }).select();
        if (error || !data || !data[0]) return alert(error ? error.message : 'Цена не сохранилась');
        S.prices = S.prices.filter(r => !(r.product_id === pid && r.store_id === sid)).concat(data[0]);
      }
    };
  });
}

// ----- «Купил»: купленное попадает в запасы дома -----
// Расход сам не создаётся: покупку по карте пришлёт банк, и она бы задвоилась. Отметка «внести расход» только для наличных.
function openBought(sid) {
  const st = sid ? S.stores.find(x => x.id === sid) : null;
  const items = missing();
  if (!items.length) return openShop();
  const unitFor = it => it.p.kind === 'count' ? 'шт' : it.need >= 1000 ? (it.p.kind === 'mass' ? 'кг' : 'л') : (it.p.kind === 'mass' ? 'г' : 'мл');
  const qtyText = it => { const u = unitFor(it); return +(it.need / UNITS[u][1]).toFixed(3) + ' ' + u; };
  const expCats = S.cats.filter(c => c.kind === 'expense');
  const guessCat = (expCats.find(c => /продукт|еда/i.test(c.name)) || {}).id || '';
  sheet(`<b>Что купили${st ? ' в «' + esc(st.name) + '»' : ''}</b>
    <p class="mute">Отмеченное попадёт в запасы дома. Количество можно поправить, например «1.5 кг» или «2 шт».</p>
    ${items.map((it, i) => `<div class="pi" style="cursor:default"><label class="chk" style="margin:0;flex:1;min-width:0;color:var(--ink)"><input type="checkbox" id="bi${i}" checked><span>${esc(it.p.name)}</span></label>
      <input id="bq${i}" value="${esc(qtyText(it))}" style="width:104px;margin:0;text-align:right"></div>`).join('')}
    <label class="chk"><input type="checkbox" id="bcash"><span>Платили не картой: внести расход</span></label>
    <div id="bcashbox" style="display:none">
      <input id="bam" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма, ₽">
      <select id="bct"><option value="">Без категории</option>${expCats.map(c => `<option value="${c.id}"${c.id === guessCat ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="mute">Покупку по карте приложение получит от банка само, расход вносить не нужно.</div>
    <div class="err" id="err"></div>
    <button class="full" id="bsv">Добавить в запасы</button>
    <button class="link full" id="cl">Назад</button>`);
  $('#cl').onclick = () => st ? openStore(sid) : openShop();
  $('#bcash').onchange = () => {
    $('#bcashbox').style.display = $('#bcash').checked ? '' : 'none';
    if ($('#bcash').checked && !$('#bam').value && st) {     // подсказка суммы по ценам этого магазина
      const sum = items.reduce((s, it, i) => s + ($('#bi' + i).checked ? lineCost(it, priceOf(it.p.id, st.id)) || 0 : 0), 0);
      if (sum > 0) $('#bam').value = Math.round(sum);
    }
  };
  $('#bsv').onclick = async () => {
    const err = t => { $('#err').textContent = t; };
    const rows = [];
    for (let i = 0; i < items.length; i++) {
      if (!$('#bi' + i).checked) continue;
      const it = items[i], q = parseQty($('#bq' + i).value, it.p.kind);
      if (!(q > 0)) return err('Не понял количество у «' + it.p.name + '». Пример: ' + KIND_UNITS[it.p.kind].map(u => '2 ' + u).join(' или '));
      rows.push({ household_id: S.household.id, product_id: it.p.id, qty: q, expires_on: null });
    }
    if (!rows.length) return err('Отметьте хотя бы один продукт');
    const cash = $('#bcash').checked, amount = parseNum($('#bam').value);
    if (cash && !(amount > 0)) return err('Введите сумму расхода');
    $('#bsv').disabled = true;
    const { error } = await sb.from('pantry_items').insert(rows);
    if (error) { $('#bsv').disabled = false; return err(error.message); }
    if (cash) {
      const { error: e2 } = await sb.from('transactions').insert({
        id: crypto.randomUUID(), household_id: S.household.id, kind: 'expense', amount, category_id: $('#bct').value || null,
        shared: true, note: 'Продукты' + (st ? ' · ' + st.name : ''), date: today()
      });
      if (e2) toast('Запасы пополнены, но расход не сохранился: ' + e2.message, 6000);
    }
    sound('success');
    closeSheet(); refresh();
    toast('Добавлено в запасы: ' + rows.length + (cash ? ', расход внесён' : ''));
  };
}
