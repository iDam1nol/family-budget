<title>Семейный бюджет</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#17201e;--mute:#6b7773;--line:#e3e8e6;--brand:#0f766e;--brand-ink:#fff;--bad:#c2410c;--good:#15803d;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0e1413;--card:#172120;--ink:#e8efed;--mute:#8fa09b;--line:#263230;--brand:#2dd4bf;--brand-ink:#04211e;--bad:#fb923c;--good:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
h1{font-size:20px;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.mute{color:var(--mute);font-size:14px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:6px 0}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.link{background:none;color:var(--brand);padding:6px;font-weight:500}
button.full{width:100%;margin-top:8px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.seg button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 12px;white-space:nowrap;font-weight:500}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.monthbar{display:flex;align-items:center;justify-content:space-between}
.monthbar b{text-transform:capitalize}
.monthbar button{padding:8px 14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:17px}
.day{font-size:13px;color:var(--mute);margin:14px 2px 4px;text-transform:uppercase;letter-spacing:.04em}
.tx{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx .amt{font-weight:600;white-space:nowrap}
.amt.inc{color:var(--good)}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-left:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.cat{padding:12px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border:0}
.row{display:flex;justify-content:space-between;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px;font-weight:500}
nav button.on{color:var(--brand)}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;line-height:1;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.big{font-size:28px;font-weight:700}
.err{color:var(--bad);font-size:14px;min-height:20px}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.tile{border:0;border-radius:26px;aspect-ratio:1/1;padding:16px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.tile:active{transform:scale(.97)}
.tile svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tile b{display:block;font-size:19px;font-weight:700}
.tile span{display:block;font-size:13px;font-weight:500;opacity:.92;margin-top:2px}
.t1{background:linear-gradient(145deg,#14b8a6,#0f766e)}
.t2{background:linear-gradient(145deg,#f59e0b,#c2410c)}
.t3{background:linear-gradient(145deg,#8b5cf6,#5b21b6)}
.t4{background:linear-gradient(145deg,#22c55e,#15803d)}
.pi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.pi:last-child{border:0}
.pi .amt{font-weight:600;text-align:right}
.txt-bad{color:var(--bad)}.txt-warn{color:var(--warn)}.txt-good{color:var(--good)}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.top button{padding:8px 12px}
.top b{font-size:19px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== НАСТРОЙКА: вставьте данные вашего проекта Supabase ======
const SUPABASE_URL = 'https://ykyxcsuuflwavetdeodi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0LkdL2668ZJFuKinRxJJUw_PMGEi1Co';
// ================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 0}).format(Math.round(n)) + ' ₽';
const pad = n => String(n).padStart(2, '0');
const today = () => new Date().toLocaleDateString('sv');

const S = { user: null, me: null, members: [], household: null, cats: [], tx: [],
            month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
            filter: 'all', tab: 'home', booted: false,
            products: [], pantry: [], staples: [], stores: [], prices: [], foodReady: false, sub: 'stock',
            token: null, inbox: [], autoReady: false, carry: 0, carryReady: false };

function monthRange() {
  const y = S.month.getFullYear(), m = S.month.getMonth();
  const a = `${y}-${pad(m + 1)}-01`;
  const ny = m === 11 ? y + 1 : y, nm = m === 11 ? 1 : m + 2;
  return [a, `${ny}-${pad(nm)}-01`];
}
const monthLabel = () => S.month.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
const nameOf = id => (S.members.find(m => m.user_id === id) || {}).name || '—';
const partner = () => S.members.find(m => m.user_id !== S.user.id);

// ---------- загрузка ----------
async function load() {
  const { data: ms, error } = await sb.from('members').select('*');
  if (error) return fail(error);
  S.members = ms || [];
  S.me = S.members.find(m => m.user_id === S.user.id);
  if (!S.me) return renderOnboarding();
  const { data: h } = await sb.from('households').select('*').limit(1).single();
  S.household = h;
  await refresh();
  if (!S.booted) { S.booted = true; subscribe(); }
}

async function refresh() {
  const [from, to] = monthRange();
  const [c, t, m, pr, pa, sp, sr, pc, tk, ib, hh, cr] = await Promise.all([
    sb.from('categories').select('*').order('name'),
    sb.from('transactions').select('*').gte('date', from).lt('date', to)
      .order('date', { ascending: false }).order('created_at', { ascending: false }),
    sb.from('members').select('*'),
    sb.from('products').select('*').order('name'),
    sb.from('pantry_items').select('*'),
    sb.from('staples').select('*'),
    sb.from('stores').select('*').order('name'),
    sb.from('prices').select('*'),
    sb.from('ingest_tokens').select('*').maybeSingle(),
    sb.from('bank_inbox').select('*').eq('status', 'review').order('received_at', { ascending: false }),
    sb.from('households').select('*').limit(1).single(),
    sb.rpc('balance_before', { p_date: from })
  ]);
  if (hh.data) S.household = hh.data;
  S.carryReady = !cr.error;
  S.carry = S.carryReady ? (+cr.data || 0) : 0;
  if (c.error || t.error || m.error) return fail(c.error || t.error || m.error);
  S.cats = c.data; S.tx = t.data; S.members = m.data;
  S.foodReady = !(pr.error || pa.error || sp.error || sr.error || pc.error);
  S.products = S.foodReady ? pr.data : [];
  S.pantry = S.foodReady ? pa.data : [];
  S.staples = S.foodReady ? sp.data : [];
  S.stores = S.foodReady ? sr.data : [];
  S.prices = S.foodReady ? pc.data : [];
  S.autoReady = !(tk.error || ib.error);
  S.token = S.autoReady ? tk.data : null;
  S.inbox = S.autoReady ? ib.data : [];
  render();
}

function subscribe() {
  let timer = null;
  const soon = () => { clearTimeout(timer); timer = setTimeout(refresh, 300); };
  let ch = sb.channel('household-live');
  ['transactions', 'categories', 'products', 'pantry_items', 'staples', 'stores', 'prices', 'bank_inbox', 'households'].forEach(tb => {
    ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: tb }, soon);
  });
  ch.subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) refresh(); });
}

function fail(e) {
  $('#app').innerHTML = `<div class="wrap"><div class="card"><b>Ошибка</b><p class="err">${esc(e.message || e)}</p>
    <button class="full" onclick="location.reload()">Обновить</button></div></div>`;
}

// ---------- вход ----------
function renderAuth(mode = 'in', msg = '') {
  $('#app').innerHTML = `<div class="wrap"><h1>Семейный бюджет</h1>
  <div class="card">
    <b>${mode === 'in' ? 'Вход' : 'Регистрация'}</b>
    <input id="em" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="Пароль (минимум 6 символов)" autocomplete="${mode === 'in' ? 'current-password' : 'new-password'}">
    <div class="err" id="err">${esc(msg)}</div>
    <button class="full" id="go">${mode === 'in' ? 'Войти' : 'Создать аккаунт'}</button>
    <button class="link full" id="sw">${mode === 'in' ? 'Нет аккаунта? Регистрация' : 'Уже есть аккаунт? Войти'}</button>
  </div></div>`;
  $('#sw').onclick = () => renderAuth(mode === 'in' ? 'up' : 'in');
  $('#go').onclick = async () => {
    const email = $('#em').value.trim(), password = $('#pw').value;
    const fn = mode === 'in' ? sb.auth.signInWithPassword.bind(sb.auth) : sb.auth.signUp.bind(sb.auth);
    const { data, error } = await fn({ email, password });
    if (error) { $('#err').textContent = error.message; return; }
    if (mode === 'up' && !data.session) { renderAuth('in', 'Аккаунт создан. Подтвердите email по письму и войдите.'); }
  };
}

function renderOnboarding() {
  $('#app').innerHTML = `<div class="wrap"><h1>Настройка семьи</h1>
  <div class="card"><b>Я первый — создаю семью</b>
    <input id="n1" placeholder="Ваше имя (например, Вадим)">
    <input id="hn" placeholder="Название семьи" value="Наша семья">
    <button class="full" id="mk">Создать</button></div>
  <div class="card"><b>Меня пригласили</b>
    <input id="n2" placeholder="Ваше имя">
    <input id="cd" placeholder="Код приглашения">
    <button class="full" id="jn">Присоединиться</button></div>
  <div class="err" id="err"></div>
  <button class="link" id="lo">Выйти</button></div>`;
  $('#lo').onclick = () => sb.auth.signOut();
  $('#mk').onclick = async () => {
    const uname = $('#n1').value.trim(); if (!uname) return $('#err').textContent = 'Введите имя';
    const { error } = await sb.rpc('create_household', { hname: $('#hn').value.trim() || 'Семья', uname });
    if (error) return $('#err').textContent = error.message;
    S.tab = 'more'; load();
  };
  $('#jn').onclick = async () => {
    const uname = $('#n2').value.trim(), code = $('#cd').value.trim();

// ---------- Продукты ----------
const UNITS = { 'шт': ['count', 1], 'г': ['mass', 1], 'кг': ['mass', 1000], 'мл': ['volume', 1], 'л': ['volume', 1000] };
const KIND_UNITS = { count: ['шт'], mass: ['г', 'кг'], volume: ['мл', 'л'] };
const PRICE_UNIT = { count: 'шт', mass: 'кг', volume: 'л' };
const PRICE_DIV = { count: 1, mass: 1000, volume: 1000 };
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const norm = s => String(s || '').trim().toLowerCase().replace(/ё/g, 'е');
const parseNum = v => parseFloat(String(v).replace(',', '.'));
const prod = id => S.products.find(p => p.id === id);

function fmtQty(n, kind) {
  n = +n;
  if (kind === 'count') return nf.format(n) + ' шт';
  const big = n >= 1000;
  return nf.format(big ? n / 1000 : n) + ' ' + (kind === 'mass' ? (big ? 'кг' : 'г') : (big ? 'л' : 'мл'));
}

// «300», «1.5 кг», «500 мл» -> число в базовых единицах (или null)
function parseQty(str, kind) {
  const m = String(str).trim().toLowerCase().match(/^([\d.,]+)\s*(шт|г|кг|мл|л|g|kg|ml|l)?$/);
  if (!m) return null;
  const alias = { g: 'г', kg: 'кг', ml: 'мл', l: 'л' };
  const n = parseNum(m[1]);
  if (!(n >= 0)) return null;
  const u = alias[m[2]] || m[2] || KIND_UNITS[kind][0];
  if (UNITS[u][0] !== kind) return null;
  return n * UNITS[u][1];
}

const isFresh = b => !b.expires_on || b.expires_on >= today();
const haveQty = pid => S.pantry.filter(b => b.product_id === pid && isFresh(b)).reduce((s, b) => s + +b.qty, 0);

function shortages() {
  return S.staples.map(st => {
    const p = prod(st.product_id);
    if (!p) return null;
    const have = haveQty(p.id);
    return { st, p, have, need: Math.max(0, +st.min_qty - have) };
  }).filter(Boolean);
}
const missing = () => shortages().filter(x => x.need > 0);

function expInfo(d) {
  if (!d) return { text: '', cls: '' };
  const days = Math.round((new Date(d + 'T00:00') - new Date(today() + 'T00:00')) / 86400000);
  const dt = new Date(d + 'T00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  if (days < 0) return { text: 'просрочено (' + dt + ')', cls: 'bad' };
  if (days <= 3) return { text: 'до ' + dt + (days === 0 ? ' (сегодня)' : ' (осталось дн.: ' + days + ')'), cls: 'warn' };
  return { text: 'до ' + dt, cls: '' };
}

  }

function renderStock() {
  const groups = {};
  S.pantry.forEach(b => (groups[b.product_id] = groups[b.product_id] || []).push(b));
  const list = Object.keys(groups).map(pid => {
    const items = groups[pid];
    const dated = items.filter(b => b.expires_on).map(b => b.expires_on).sort();
    return { p: prod(pid), items, total: items.reduce((s, b) => s + +b.qty, 0), exp: dated[0] || '' };
  }).filter(g => g.p).sort((a, b) => (a.exp || '9999').localeCompare(b.exp || '9999') || a.p.name.localeCompare(b.p.name, 'ru'));
  const rows = list.map(g => {
    const e = expInfo(g.exp);
    return `<div class="pi" data-p="${g.p.id}"><div><div>${esc(g.p.name)}</div>
      <div class="mute ${e.cls ? 'txt-' + e.cls : ''}">${esc(e.text || 'срок не указан')}</div></div>
      <div class="amt">${fmtQty(g.total, g.p.kind)}</div></div>`;
  }).join('');

// ----- сканер штрихкода -----
let scanReader = null;
function stopScan() {
  try { if (scanReader) scanReader.reset(); } catch (e) {}
  scanReader = null;
  const o = $('#scan');
  if (o) o.remove();
}
function loadZXing() {
  return new Promise((res, rej) => {
    if (window.ZXing) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function scanBarcode(done) {
  stopScan();
  const o = document.createElement('div');
  o.id = 'scan'; o.className = 'sheet-bg'; o.style.zIndex = 20;
  o.innerHTML = `<div class="sheet"><b>Наведите камеру на штрихкод</b>
    <video id="vid" playsinline muted style="width:100%;border-radius:12px;background:#000;margin-top:8px;max-height:50vh"></video>
    <div class="mute" id="smsg">Запускаю камеру…</div>
    <button class="ghost full" id="scx">Отмена</button></div>`;
  document.body.appendChild(o);
  $('#scx').onclick = stopScan;
  const say = t => { const m = $('#smsg'); if (m) m.textContent = t; };
  try { await loadZXing(); } catch (e) { return say('Сканер не загрузился. Проверьте интернет и попробуйте ещё раз.'); }
  try {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128]);
    scanReader = new ZXing.BrowserMultiFormatReader(hints, 300);
    let got = false;
    await scanReader.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } } }, 'vid', res => {
      if (res && !got) { got = true; const code = res.getText(); stopScan(); done(code); }
    });
    say('Ищу штрихкод…');
  } catch (e) {
    say('Нет доступа к камере. Разрешите камеру для этого сайта в настройках браузера или введите название вручную.');
  }
}

// Название по штрихкоду: открытая база Open Food Facts (может не знать часть товаров)
async function lookupBarcode(code) {
  try {
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) +
      '.json?fields=product_name,product_name_ru,brands,quantity', { signal: ctl.signal });
    clearTimeout(tm);
    const j = await r.json();
    if (j.status !== 1 || !j.product) return null;
    const p = j.product;
    const base = (p.product_name_ru || p.product_name || '').trim();
    const brand = (p.brands || '').split(',')[0].trim();
    if (!base) return null;
    let pack = null;
    const m = String(p.quantity || '').toLowerCase().match(/^\s*([\d.,]+)\s*(kg|g|ml|l)\b/);
    if (m) pack = { n: parseNum(m[1]), unit: { kg: 'кг', g: 'г', ml: 'мл', l: 'л' }[m[2]] };
    return { name: brand && !norm(base).includes(norm(brand)) ? base + ' ' + brand : base, pack };
  } catch (e) { return null; }
}

function foodForm(o) {
  let barcode = null;
  sheet(`<b>${o.title}</b>

      <select id="pu" style="width:90px">${Object.keys(UNITS).map(u => `<option>${u}</option>`).join('')}</select></div>
    ${o.expiry ? '<div class="mute">Срок годности (необязательно)</div><input id="pd" type="date">' : ''}
    <div class="err" id="err"></div>
    <button class="full" id="sv">Сохранить</button>`);
  const err = t => { $('#err').textContent = t; };
  const syncUnit = () => {
    const p = S.products.find(x => norm(x.name) === norm($('#pn').value));
    const cur = $('#pu').value;
    const opts = p ? KIND_UNITS[p.kind] : Object.keys(UNITS);
    $('#pu').innerHTML = opts.map(u => `<option>${u}</option>`).join('');
    if (opts.includes(cur)) $('#pu').value = cur;
  };
  $('#pn').oninput = syncUnit;
  if (o.prefill) { $('#pn').value = o.prefill; syncUnit(); }
  $('#sc').onclick = () => scanBarcode(async code => {
    barcode = code;
    const known = S.products.find(x => x.barcode === code);
    if (known) { $('#pn').value = known.name; syncUnit(); $('#pinfo').textContent = 'Узнал по вашему списку'; return; }
    $('#pinfo').textContent = 'Ищу название…';
    const r = await lookupBarcode(code);
    if (r) {
      $('#pn').value = r.name; syncUnit();
      $('#pinfo').textContent = 'Нашёл по штрихкоду, проверьте название';
      if (r.pack && !$('#pq').value) { $('#pq').value = r.pack.n; $('#pu').value = r.pack.unit; }
    } else {
      $('#pinfo').textContent = 'Штрихкода ' + code + ' нет в базе. Введите название, в следующий раз узнаю сам.';
    }
  });
  $('#sv').onclick = async () => {
    const name = $('#pn').value.trim();
    const q = parseNum($('#pq').value);
    const unit = $('#pu').value;
    if (!name) return err('Введите название');
    if (!(q > 0)) return err('Введите количество');
    const [kind, mult] = UNITS[unit];
    let p = (barcode && S.products.find(x => x.barcode === barcode)) || S.products.find(x => norm(x.name) === norm(name));
    if (p && p.kind !== kind) return err('Для «' + p.name + '» единицы: ' + KIND_UNITS[p.kind].join(' / '));
    $('#sv').disabled = true;
    if (!p) {
      const { data, error } = await sb.from('products')
        .insert({ household_id: S.household.id, name, kind, barcode }).select().single();
      if (error) { $('#sv').disabled = false; return err(error.message); }
      p = data; S.products.push(p);
    } else if (barcode && !p.barcode) {
      await sb.from('products').update({ barcode }).eq('id', p.id);
    }
    const e = await o.onSave(p, q * mult);
    if (e) { $('#sv').disabled = false; return err(e); }
    closeSheet(); refresh();
  };
}

// ----- «Что докупить»: нехватка, цены, итог по магазинам -----
const priceOf = (pid, sid) => { const r = S.prices.find(x => x.product_id === pid && x.store_id === sid); return r ? +r.price : null; };
const lineCost = (it, price) => price == null ? null : it.need / PRICE_DIV[it.p.kind] * price;
function storeTotals(items, store, override) {
  let total = 0, unknown = 0;
  items.forEach(it => {
    const price = override ? override[it.p.id] : priceOf(it.p.id, store.id);
    const c = lineCost(it, price);
    if (c == null) unknown++; else total += c;
  });
  return { total, unknown };
}
const shopText = items => 'Список покупок:\n' + items.map(it => '• ' + it.p.name + ' — ' + fmtQty(it.need, it.p.kind)).join('\n');
function copyText(t) {
  try { if (navigator.clipboard) return navigator.clipboard.writeText(t); } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  } catch (e) {}
}

function openShop() {
  const items = missing();
  if (!items.length) {
    sheet('<b>Всё есть дома</b><p class="mute">Докупать ничего не нужно: все запланированные продукты в наличии.</p><button class="ghost full" id="cl">Закрыть</button>');
    $('#cl').onclick = closeSheet;
    return;
  }
  const info = S.stores.map(st => ({ st, ...storeTotals(items, st) }));
  const full = info.filter(x => x.unknown === 0);
  const best = full.length > 1 ? Math.min(...full.map(x => x.total)) : null;
  sheet(`<b>Что докупить</b>
    <div class="card">${items.map(it => `<div class="row"><span>${esc(it.p.name)}</span><span class="mute">${fmtQty(it.need, it.p.kind)}</span></div>`).join('')}</div>
    <div class="day">Магазины</div>
    ${info.map(x => `<div class="card" data-st="${x.st.id}" style="cursor:pointer"><div class="row"><b>${esc(x.st.name)}</b><b>${x.total ? fmt(x.total) : '—'}</b></div>
      <div class="mute">${x.unknown ? 'нет цены у позиций: ' + x.unknown : 'цены есть на всё'}${best !== null && x.unknown === 0 && x.total === best ? ' · дешевле всего' : ''}</div></div>`).join('')
      || '<div class="mute" style="margin-bottom:8px">Магазинов пока нет. Добавьте первый, чтобы вводить цены и сравнивать.</div>'}
    <button class="ghost full" id="addstore">+ Магазин</button>
    <button class="ghost full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  $('#addstore').onclick = () => editStore(null);
  document.querySelectorAll('#sh [data-st]').forEach(el => el.onclick = () => openStore(el.dataset.st));

function openStore(sid) {
  const st = S.stores.find(x => x.id === sid);
  if (!st) return;
  const items = missing();
  const local = {};
  items.forEach(it => { local[it.p.id] = priceOf(it.p.id, sid); });
  sheet(`<div class="top" style="margin:0 0 6px"><button class="ghost" id="bk2">‹ Назад</button><b>${esc(st.name)}</b></div>
    <div class="big" id="tot"></div><div class="mute" id="unk"></div>
    <div class="card">${items.map(it => `<div class="pi"><div><div>${esc(it.p.name)}</div>
      <div class="mute">${fmtQty(it.need, it.p.kind)} · цена за ${PRICE_UNIT[it.p.kind]}</div></div>
      <div style="text-align:right"><input data-pid="${it.p.id}" type="number" inputmode="decimal" step="any" min="0" value="${local[it.p.id] ?? ''}" placeholder="₽" style="width:92px;margin:0;text-align:right">
      <div class="mute" data-cost="${it.p.id}"></div></div></div>`).join('')}</div>
    <button class="full" id="go">Перейти в магазин</button>
    <div class="mute" id="msg" style="margin-top:6px">Список покупок скопируется, и откроется сайт магазина.</div>
    <button class="ghost full" id="cp">Скопировать список</button>
    <button class="link full" id="es">Изменить магазин</button>`);
  const calc = () => {
    const t = storeTotals(items, st, local);
    $('#tot').textContent = fmt(t.total);
    $('#unk').textContent = t.unknown ? 'Нет цены у позиций: ' + t.unknown + ' (итог без них)' : 'Цены указаны на все позиции';
    items.forEach(it => {
      const c = lineCost(it, local[it.p.id]);
      const el = document.querySelector('#sh [data-cost="' + it.p.id + '"]');
      if (el) el.textContent = c == null ? '' : '≈ ' + fmt(c);
    });
  };
  calc();
  $('#bk2').onclick = openShop;
  $('#es').onclick = () => editStore(sid);
  $('#cp').onclick = () => { copyText(shopText(items)); $('#msg').textContent = 'Список скопирован'; };
  $('#go').onclick = () => {
    copyText(shopText(items));
    if (st.url) window.open(/^https?:\/\//i.test(st.url) ? st.url : 'https://' + st.url, '_blank', 'noopener');
    else $('#msg').textContent = 'Список скопирован. Укажите адрес сайта в «Изменить магазин», чтобы переходить прямо отсюда.';
  };
  document.querySelectorAll('#sh input[data-pid]').forEach(inp => {
    const pid = inp.dataset.pid;
    inp.oninput = () => { const v = parseNum(inp.value); local[pid] = v >= 0 ? v : null; calc(); };
    inp.onchange = async () => {
      const v = parseNum(inp.value);
      if (inp.value.trim() === '') {
        const { error } = await sb.from('prices').delete().eq('product_id', pid).eq('store_id', sid);
        if (!error) S.prices = S.prices.filter(r => !(r.product_id === pid && r.store_id === sid));
      } else if (v >= 0) {
        const { data, error } = await sb.from('prices').upsert(
          { household_id: S.household.id, product_id: pid, store_id: sid, price: v, updated_at: new Date().toISOString() },
          { onConflict: 'product_id,store_id' }).select();
        if (error || !data || !data[0]) return alert(error ? error.message : 'Цена не сохранилась');
        S.prices = S.prices.filter(r => !(r.product_id === pid && r.store_id === sid)).concat(data[0]);
      }
    };
  });
}

    : `<p class="mute">Операции из уведомлений банка будут появляться сами. Нужна разовая настройка команды на iPhone.</p>
       <button class="full" id="tkon">Включить автоимпорт</button>`;
  return `<div class="card"><b>Входящие из банка</b>${inbox}</div>
    <div class="card"><b>Автоимпорт из банка</b>${auto}</div>`;
}

const fmtWhen = d => new Date(d).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function openToken(create) {
  if (create || !S.token) {
    let shared = true;
    sheet(`<b>Автоимпорт из банка</b>
      <p class="mute">Какими считать операции, которые придут из банка?</p>
      <div class="seg" id="sc"><button data-s="1" class="on">Общие</button><button data-s="0">Личные</button></div>
      <div class="err" id="err"></div>
      <button class="full" id="sv">Создать токен</button>
      <button class="ghost full" id="cl">Отмена</button>`);
    $('#cl').onclick = closeSheet;
    document.querySelectorAll('#sh #sc button').forEach(b => b.onclick = () => {
      shared = b.dataset.s === '1';
      document.querySelectorAll('#sh #sc button').forEach(x => x.classList.toggle('on', x === b));
    });
    $('#sv').onclick = async () => {
      const { error } = await sb.rpc('create_ingest_token', { p_shared: shared });
      if (error) return $('#err').textContent = error.message;
      await refresh();
      openToken(false);
    };
    return;
  }
  const rows = [['Адрес (URL)', SUPABASE_URL + '/rest/v1/rpc/ingest_bank_notification'],
    ['Ключ apikey (заголовок)', SUPABASE_KEY], ['Секретный токен', S.token.token]];
  sheet(`<b>Автоимпорт из банка</b>
    <p class="mute">Эти значения вставляются в команду на iPhone. Токен держите в секрете: по нему можно добавлять операции в вашу семью.</p>
    ${rows.map(([l, v], i) => `<div class="mute">${l}</div>
      <div class="row" style="gap:8px"><input readonly value="${esc(v)}" style="flex:1"><button class="ghost" data-copy="${i}" style="margin:6px 0">Копировать</button></div>`).join('')}
    <div class="mute">Новые операции из банка</div>
    <div class="seg" id="sc"><button data-s="1" class="${S.token.shared ? 'on' : ''}">Общие</button><button data-s="0" class="${S.token.shared ? '' : 'on'}">Личные</button></div>
    <div class="mute" id="msg"></div>
    <button class="ghost full" id="rot">Перевыпустить токен</button>
    <button class="ghost full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  document.querySelectorAll('#sh [data-copy]').forEach(b => b.onclick = () => {
    copyText(rows[+b.dataset.copy][1]);
    $('#msg').textContent = 'Скопировано: ' + rows[+b.dataset.copy][0];
  });
  document.querySelectorAll('#sh #sc button').forEach(b => b.onclick = async () => {
    const shared = b.dataset.s === '1';
    const { error } = await sb.from('ingest_tokens').update({ shared }).eq('user_id', S.user.id);
    if (error) return alert(error.message);
    S.token.shared = shared;
    document.querySelectorAll('#sh #sc button').forEach(x => x.classList.toggle('on', x === b));
    $('#msg').textContent = 'Сохранено';
    refresh();
  });
  $('#rot').onclick = async () => {
    if (!confirm('Перевыпустить токен? Старый перестанет работать, и его нужно будет заменить в команде на iPhone.')) return;
    const { error } = await sb.rpc('create_ingest_token', { p_shared: S.token.shared });
    if (error) return alert(error.message);
    await refresh();
    openToken(false);
  };
}

function openInbox() {
  if (!S.inbox.length) {
    sheet('<b>Входящие из банка</b><p class="mute">Разбирать нечего: всё распознано.</p><button class="ghost full" id="cl">Закрыть</button>');
    $('#cl').onclick = closeSheet;
    return;
  }
  sheet(`<b>Входящие из банка</b>
    <div class="mute">Эти уведомления не удалось распознать сами. Нажмите, чтобы внести или пропустить.</div>
    ${S.inbox.map(r => `<div class="pi" data-ib="${r.id}"><div style="min-width:0"><div style="overflow-wrap:anywhere">${esc(r.raw_text)}</div>
      <div class="mute">${esc(fmtWhen(r.received_at))}</div></div><div class="mute">›</div></div>`).join('')}
    <button class="ghost full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  document.querySelectorAll('#sh [data-ib]').forEach(el => el.onclick = () => openInboxItem(el.dataset.ib));
}

function openInboxItem(id) {
  const r = S.inbox.find(x => x.id === id);
  if (!r) return;
  let kind = r.parsed_kind || 'expense';
  let shared = S.token ? S.token.shared : true;
  const catOpts = k => S.cats.filter(c => c.kind === k).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')
    + '<option value="">Без категории</option>';
  const note = r.raw_text.replace(/\s*(доступно|остаток|баланс)([^а-яёa-z].*)?$/i, '').slice(0, 200);
  sheet(`<b>Уведомление банка</b>
    <p style="overflow-wrap:anywhere">${esc(r.raw_text)}</p>
    <div class="seg" id="kd"><button data-k="expense" class="${kind === 'expense' ? 'on' : ''}">Расход</button><button data-k="income" class="${kind === 'income' ? 'on' : ''}">Доход</button></div>
    <input id="am" type="number" inputmode="decimal" min="0" step="0.01" value="${r.parsed_amount ?? ''}" placeholder="Сумма, ₽" style="font-size:22px">
    <select id="ct">${catOpts(kind)}</select>
    <input id="nt" value="${esc(note)}" placeholder="Заметка">
    <input id="dt" type="date" value="${new Date(r.received_at).toLocaleDateString('sv')}">
    <div class="seg" id="sc"><button data-s="1" class="${shared ? 'on' : ''}">Общий</button><button data-s="0" class="${shared ? '' : 'on'}">Личный</button></div>
    <div class="err" id="err"></div>
    <button class="full" id="sv">Внести операцию</button>
    <button class="ghost full" id="sk">Пропустить</button>
    <button class="link full" id="cl">Назад</button>`);
  $('#cl').onclick = openInbox;
  document.querySelectorAll('#sh #kd button').forEach(b => b.onclick = () => {
    kind = b.dataset.k;
    document.querySelectorAll('#sh #kd button').forEach(x => x.classList.toggle('on', x === b));
    $('#ct').innerHTML = catOpts(kind);
  });
  document.querySelectorAll('#sh #sc button').forEach(b => b.onclick = () => {
    shared = b.dataset.s === '1';
    document.querySelectorAll('#sh #sc button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#sk').onclick = async () => {
    const { error } = await sb.from('bank_inbox').update({ status: 'skipped' }).eq('id', id);
    if (error) return $('#err').textContent = error.message;
    S.inbox = S.inbox.filter(x => x.id !== id);
    await refresh();
    openInbox();
  };
  $('#sv').onclick = async () => {
    const amount = parseNum($('#am').value);
    if (!(amount > 0)) return $('#err').textContent = 'Введите сумму';
    $('#sv').disabled = true;
    const { data, error } = await sb.from('transactions').insert({
      household_id: S.household.id, kind, amount, category_id: $('#ct').value || null, shared,
      note: $('#nt').value.trim() || null, date: $('#dt').value || today()
    }).select().single();
    if (error) { $('#sv').disabled = false; return $('#err').textContent = error.message; }
    await sb.from('bank_inbox').update({ status: 'done', transaction_id: data.id }).eq('id', id);
    S.inbox = S.inbox.filter(x => x.id !== id);
    await refresh();
    openInbox();
  };
}

// ---------- Осталось на день и прогноз ----------
const isCurMonth = () => {
  const n = new Date();
  return S.month.getFullYear() === n.getFullYear() && S.month.getMonth() === n.getMonth();
};
const planValue = () => (S.household && +S.household.monthly_plan > 0) ? +S.household.monthly_plan : 0;

// base: плановый бюджет (если задан) или доходы текущего месяца; к нему прибавляется перенос остатка
function paceInfo(inc, exp) {
  const plan = planValue();
  const base = plan || inc;
  const carry = S.carryReady ? S.carry : 0;
  const pool = base + carry;                        // сколько всего можно потратить в этом месяце
  const n = new Date();
  const dim = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 0).getDate();
  const day = n.getDate();
  const left = dim - day + 1;                       // дней до конца месяца, включая сегодня
  const remaining = pool - exp;
  return {
    plan, base, carry, pool, dim, day, left, remaining,
    perDay: remaining > 0 ? remaining / left : 0,
    projected: day >= 3 ? exp / day * dim : null    // прогноз по среднему темпу трат
  };
}

function renderPace(inc, exp) {
  if (!isCurMonth()) return '';
  const p = paceInfo(inc, exp);
  const planBtn = `<button class="link" id="plan" style="padding:0">${p.plan ? 'Изменить плановый бюджет' : 'Задать плановый бюджет'}</button>`;
  if (p.pool <= 0) {
    return `<div class="card"><b>Осталось на день</b>
      <p class="mute">В этом месяце пока нет доходов и остатка. Когда придёт доход, здесь появится расчёт. Либо задайте плановый бюджет на месяц.</p>${planBtn}</div>`;
  }
  const today0 = today();
  const spentToday = S.tx.filter(t => t.kind === 'expense' && t.date === today0).reduce((s, t) => s + +t.amount, 0);
  const over = p.remaining < 0;
  const pc = Math.min(100, exp / p.pool * 100);
  const cls = exp > p.pool ? 'bad' : (exp > p.pool * .85 ? 'warn' : '');
  let fc = '<div class="mute">Прогноз появится через пару дней, когда накопится статистика трат.</div>';
  if (p.projected !== null) {
    fc = p.projected <= p.pool
      ? `<div class="mute">При таком темпе до конца месяца потратите около ${fmt(p.projected)}. Укладываетесь, запас около ${fmt(p.pool - p.projected)}.</div>`
      : `<div class="mute txt-bad">При таком темпе до конца месяца потратите около ${fmt(p.projected)}. Выйдет перерасход около ${fmt(p.projected - p.pool)}.</div>`;
  }
  const src = (p.plan ? 'плановый бюджет ' : 'доходы месяца ') + fmt(p.base)
    + (p.carry ? (p.carry > 0 ? ' + перенос ' : ' − долг прошлых месяцев ') + fmt(Math.abs(p.carry)) : '');
  return `<div class="card">
    <div class="mute">Осталось на день</div>
    <div class="big ${over ? 'txt-bad' : ''}">${over ? 'Перерасход ' + fmt(-p.remaining) : fmt(p.perDay)}</div>
    <div class="mute">${over ? '' : 'Осталось ' + fmt(p.remaining) + ' на ' + p.left + ' дн. · '}${src}</div>
    <div class="bar"><i class="${cls}" style="width:${pc}%"></i></div>
    <div class="mute" style="margin-top:6px">Сегодня потрачено ${fmt(spentToday)}</div>
    ${fc}
    <div style="margin-top:6px">${planBtn}</div></div>`;
}

function openPlan() {
  const cur = planValue();
  sheet(`<b>Плановый бюджет на месяц</b>
    <p class="mute">Сколько вы планируете тратить за месяц. Если не задан, «осталось на день» считается от доходов текущего месяца.</p>
    <input id="pv" type="number" inputmode="decimal" min="0" step="100" value="${cur || ''}" placeholder="Например, 60000">
    <div class="err" id="err"></div>
    <button class="full" id="sv">Сохранить</button>
    ${cur ? '<button class="ghost full" id="rs">Убрать план (считать по доходам)</button>' : ''}
    <button class="link full" id="cl">Отмена</button>`);
  $('#cl').onclick = closeSheet;
  const save = async v => {
    const { error } = await sb.rpc('set_monthly_plan', { p: v });
    if (error) return $('#err').textContent = /function|schema cache|could not find/i.test(error.message)
      ? 'Нужно выполнить update-4.sql в Supabase' : error.message;
    S.household.monthly_plan = v;
    closeSheet(); render();
  };
  $('#sv').onclick = () => {
    const v = parseNum($('#pv').value);
    if (!(v >= 0)) return $('#err').textContent = 'Введите сумму';
    save(v);
  };
  if ($('#rs')) $('#rs').onclick = () => save(0);
}

// ---------- запуск ----------
(async function init() {
  try { history.replaceState(null, ''); } catch (e) {}
  if (SUPABASE_URL.startsWith('ВСТАВЬТЕ')) {
    $('#app').innerHTML = '<div class="wrap"><div class="card"><b>Не настроено</b><p>Откройте index.html и вставьте SUPABASE_URL и SUPABASE_KEY.</p></div></div>';
    return;
  }
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'SIGNED_OUT') { S.user = null; S.me = null; renderAuth(); }
    else if (session && (!S.user || S.user.id !== session.user.id)) { S.user = session.user; load(); }
  });
  const { data } = await sb.auth.getSession();
  if (!data.session) renderAuth();
})();
</script>
