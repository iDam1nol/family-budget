// ---------- Осталось на день и прогноз ----------
const isCurMonth = () => {
  const n = new Date();
  return S.month.getFullYear() === n.getFullYear() && S.month.getMonth() === n.getMonth();
};
const planValue = () => (S.household && +S.household.monthly_plan > 0) ? +S.household.monthly_plan : 0;

// base: плановый бюджет (если задан) или доходы текущего месяца; к нему прибавляется перенос остатка
function paceInfo(inc, exp) {
  const plan = planValue();
  const base = plan || inc;
  const carry = S.carryReady ? S.carry : 0;
  const saved = plan ? 0 : savedMonth();             // отложено на цели (при плановом бюджете план и есть лимит трат)
  const pool = base + carry - saved;                // сколько всего можно потратить в этом месяце
  const n = new Date();
  const dim = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 0).getDate();
  const day = n.getDate();
  const left = dim - day + 1;                       // дней до конца месяца, включая сегодня
  const { unpaid, paid } = recurTotals();           // неоплаченные платежи резервируем заранее
  const remaining = pool - exp - unpaid;
  return {
    plan, base, carry, saved, pool, dim, day, left, remaining, unpaid,
    perDay: remaining > 0 ? remaining / left : 0,
    // прогноз: обычные траты по среднему темпу плюс платежи, которые бывают раз в месяц
    projected: day >= 3 ? (exp - paid) / day * dim + paid + unpaid : null
  };
}

function renderPace(inc, exp) {
  if (!isCurMonth()) return '';
  const p = paceInfo(inc, exp);
  const planBtn = `<button class="link" id="plan" style="padding:0">${p.plan ? 'Изменить плановый бюджет' : 'Задать плановый бюджет'}</button>`;
  if (p.pool <= 0) {
    return `<div class="card"><b>Осталось на день</b>
      <p class="mute">В этом месяце пока нет доходов и остатка. Когда придёт доход, здесь появится расчёт. Либо задайте плановый бюджет на месяц.</p>${planBtn}</div>`;
  }
  const today0 = today();
  const spentToday = counted().filter(t => t.kind === 'expense' && t.date === today0).reduce((s, t) => s + +t.amount, 0);
  const over = p.remaining < 0;
  const pc = Math.min(100, exp / p.pool * 100);
  const cls = exp > p.pool ? 'bad' : (exp > p.pool * .85 ? 'warn' : '');
  let fc = '<div class="mute">Прогноз появится через пару дней, когда накопится статистика трат.</div>';
  if (p.projected !== null) {
    fc = p.projected <= p.pool
      ? `<div class="mute">При таком темпе до конца месяца потратите около ${fmt(p.projected)}. Укладываетесь, запас около ${fmt(p.pool - p.projected)}.</div>`
      : `<div class="mute txt-bad">При таком темпе до конца месяца потратите около ${fmt(p.projected)}. Выйдет перерасход около ${fmt(p.projected - p.pool)}.</div>`;
  }
  const src = (p.plan ? 'плановый бюджет ' : 'доходы месяца ') + fmt(p.base)
    + (p.carry ? (p.carry > 0 ? ' + перенос ' : ' − долг прошлых месяцев ') + fmt(Math.abs(p.carry)) : '')
    + (p.saved ? ' − отложено на цели ' + fmt(p.saved) : '')
    + (p.unpaid ? ' − впереди платежи ' + fmt(p.unpaid) : '');
  return `<div class="card hero">
    <div class="mute">Осталось на день</div>
    <div ${over ? '' : `data-n="${Math.round(p.perDay)}" `}class="big ${over ? 'txt-bad' : ''}">${over ? (exp > p.pool ? 'Перерасход ' : 'Не хватает ') + fmt(-p.remaining) : fmt(p.perDay)}</div>
    <div class="mute">${over ? '' : 'Осталось ' + fmt(p.remaining) + ' на ' + p.left + ' дн. · '}${src}</div>
    <div class="bar"><i class="${cls}" style="width:${pc}%"></i></div>
    <div class="mute" style="margin-top:6px">Сегодня потрачено ${fmt(spentToday)}</div>
    ${fc}
    <div style="margin-top:6px">${planBtn}</div></div>`;
}

// ---------- цели накоплений ----------
const limSeg = () => `<div class="seg fit"><button data-ls="cats" class="${S.limSub === 'cats' ? 'on' : ''}">Лимиты</button><button data-ls="goals" class="${S.limSub === 'goals' ? 'on' : ''}">Цели</button><button data-ls="recur" class="${S.limSub === 'recur' ? 'on' : ''}">Платежи</button><button data-ls="charts" class="${S.limSub === 'charts' ? 'on' : ''}">Графики</button></div>`;

function goalSums() {
  const [from, to] = monthRange();
  const tot = {}, mon = {};
  S.deposits.forEach(d => {
    tot[d.goal_id] = (tot[d.goal_id] || 0) + +d.amount;
    if (d.date >= from && d.date < to) mon[d.goal_id] = (mon[d.goal_id] || 0) + +d.amount;
  });
  return { tot, mon };
}
function savedMonth() {
  if (!S.goalsReady) return 0;
  const [from, to] = monthRange();
  return S.deposits.filter(d => d.date >= from && d.date < to).reduce((s, d) => s + +d.amount, 0);
}

// подписанные ссылки на закрытые файлы: берём пачкой и держим в кэше
function applyUrls() {
  document.querySelectorAll('img[data-p]').forEach(im => {
    const u = S.urls[im.dataset.p];
    if (u && u.exp > Date.now() && im.getAttribute('src') !== u.url) {
      im.onload = () => im.classList.add('in');
      im.src = u.url;
      if (im.complete) im.classList.add('in');
    }
  });
}
async function signUrls(paths) {
  const need = [...new Set(paths)].filter(p => !(S.urls[p] && S.urls[p].exp > Date.now()));
  for (let i = 0; i < need.length; i += 100) {
    const { data, error } = await bucket().createSignedUrls(need.slice(i, i + 100), 3600);
    if (error || !data) break;
    data.forEach(d => { if (d.signedUrl) S.urls[d.path] = { url: d.signedUrl, exp: Date.now() + 3300000 }; });
  }
}
async function hydratePhotos() {
  if (!S.photosReady) return;
  applyUrls();
  const paths = [...document.querySelectorAll('img[data-p]')].map(i => i.dataset.p);
  if (!paths.length) return;
  await signUrls(paths);
  applyUrls();
}

// сжатие: большая копия до 1920 px и миниатюра до 420 px (JPEG), поворот по EXIF учитывается
async function toJpeg(file, max, q) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    src = await new Promise((res, rej) => {
      const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('не удалось открыть изображение'));
      im.src = URL.createObjectURL(file);
    });
  }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(src, 0, 0, c.width, c.height);
  if (src.close) src.close();
  return new Promise((res, rej) => c.toBlob(b => b ? res({ blob: b, w: c.width, h: c.height }) : rej(new Error('не удалось сжать')), 'image/jpeg', q));
}

async function uploadPhotos(files) {
  let ok = 0, bad = 0, lastErr = '';
  const t = toast('', 0);
  for (let i = 0; i < files.length; i++) {
    t.textContent = `Загружаем ${i + 1} из ${files.length}…`;
    const id = crypto.randomUUID();
    const hid = S.household ? S.household.id : S.me.household_id;
    const path = `${hid}/${id}.jpg`, tpath = `${hid}/${id}_t.jpg`;
    try {
      const full = await toJpeg(files[i], 1920, .82), th = await toJpeg(files[i], 420, .75);
      let r = await bucket().upload(path, full.blob, { contentType: 'image/jpeg' });
      if (r.error) throw r.error;
      r = await bucket().upload(tpath, th.blob, { contentType: 'image/jpeg' });
      if (r.error) { await bucket().remove([path]); throw r.error; }
      r = await sb.from('photos').insert({ id, household_id: hid, user_id: S.user.id, path, thumb_path: tpath, scope: isRel() ? 'family' : S.album,
        width: full.w, height: full.h, size: full.blob.size });
      if (r.error) { await bucket().remove([path, tpath]); throw r.error; }
      ok++;
    } catch (e) { bad++; lastErr = (e && e.message) || String(e); }
  }
  t.remove();
  await refresh();
  if (ok) burst(ok > 1 ? 26 : 16);
  toast(bad ? `Загружено ${ok}, не удалось ${bad}: ${lastErr}` : (ok === 1 ? 'Фото добавлено' : `Добавлено фото: ${ok}`), bad ? 5000 : 2600);
}

// ---------- автокатегории ----------
const NOT_MERCHANT = /^(покупк|оплат|перевод|пополнен|возврат|списан|снят|платеж|платёж|отправл|комисси|зачислен|поступлен|кэшбэк|кешбэк)/i;
// предположение: название магазина или получателя = первый кусок текста без суммы и без глагола операции
function guessKeyword(note) {
  const parts = String(note || '').split(/\.\s+|\.$/).map(x => x.trim()).filter(Boolean);
  const hit = parts.find(x => !/₽|руб/i.test(x) && !NOT_MERCHANT.test(x));
  return (hit || '').toLowerCase().replace(/[.\s]+$/, '').slice(0, 40);
}

// сохранить правило и сразу применить к прошлым операциям без категории
async function saveRule(keyword, catId) {
  const kw = String(keyword || '').trim().toLowerCase();
  if (kw.length < 2) throw new Error('Введите хотя бы 2 символа');
  const cat = S.cats.find(c => c.id === catId);
  if (!cat) throw new Error('Выберите категорию');
  let r = await sb.from('category_rules').upsert({ household_id: S.household.id, keyword: kw, category_id: catId },
    { onConflict: 'household_id,keyword' });
  if (r.error) throw r.error;
  r = await sb.from('transactions').update({ category_id: catId }).is('category_id', null).eq('kind', cat.kind)
    // «е» и «ё» в шаблоне заменяются на «_» (любой символ): правило «пятёрочка» найдёт и «Пятерочка»
    .ilike('note', '%' + kw.replace(/[\\%_]/g, m => '\\' + m).replace(/[её]/g, '_') + '%').select('id');
  if (r.error) throw r.error;
  return r.data ? r.data.length : 0;
}

// разбор операций без категории: один тап на операцию
function openSort() {
  const t = sortable()[0];
  if (!t) {
    sheet('<b>Готово</b><p class="mute">Все операции с категориями. Правила работают сами для новых уведомлений банка.</p><button class="full" id="cl">Закрыть</button>');
    $('#cl').onclick = closeSheet;
    burst(30);
    return;
  }
  const cats = S.cats.filter(c => c.kind === t.kind);
  const guess = guessKeyword(t.note);
  sheet(`<div class="mute">Осталось разобрать: ${sortable().length}</div>
    <div class="big">${t.kind === 'income' ? '+' : '−'}${fmt(+t.amount)}</div>
    <div class="mute">${esc(t.date)} · ${esc(nameOf(t.user_id))}${t.note ? ' · ' + esc(t.note) : ''}</div>
    <div class="chips">${cats.map(c => `<button data-c="${c.id}">${esc(c.name)}</button>`).join('')}</div>
    ${S.rulesReady && guess ? `<label class="chk"><input type="checkbox" id="rm" checked><span>Запомнить для слова</span></label>
      <input id="rk" value="${esc(guess)}" placeholder="Слово из текста">` : ''}
    <div class="err" id="err"></div>
    <button class="ghost full" id="sk">Пропустить</button>
    <button class="link full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  $('#sk').onclick = () => { S.skipped.add(t.id); openSort(); };
  document.querySelectorAll('#sh [data-c]').forEach(b => b.onclick = async () => {
    const cid = b.dataset.c;
    document.querySelectorAll('#sh [data-c]').forEach(x => x.disabled = true);
    try {
      if ($('#rm') && $('#rm').checked && String($('#rk').value).trim().length >= 2) await saveRule($('#rk').value, cid);

// ---------- повторяющиеся платежи ----------
// Операции сами не создаются (их присылает банк): платёж оплачен, если в месяце есть связанная операция
// или расход с ключевым словом в тексте. Из нескольких подходящих берём ближайший по сумме.
function recurStatus() {
  const [from] = monthRange();
  const y = S.month.getFullYear(), m = S.month.getMonth();
  const dim = new Date(y, m + 1, 0).getDate();
  const used = new Set(), tx = {};
  S.recur.forEach(r => {
    const t = counted().find(x => x.recurring_id === r.id && !used.has(x.id));
    if (t) { tx[r.id] = t; used.add(t.id); }
  });
  S.recur.forEach(r => {
    if (tx[r.id] || !r.keyword) return;
    const kw = norm(r.keyword);
    const t = counted().filter(x => x.kind === 'expense' && !x.recurring_id && !used.has(x.id) && norm(x.note).includes(kw))
      .sort((a, b) => Math.abs(a.amount - r.amount) - Math.abs(b.amount - r.amount))[0];
    if (t) { tx[r.id] = t; used.add(t.id); }
  });
  const dayNow = isCurMonth() ? new Date().getDate() : S.month > new Date() ? 0 : dim + 1;
  return S.recur.map(r => {
    const day = Math.min(r.day, dim);
    const skip = r.skip_month === from;
    return { r, day, skip, tx: tx[r.id] || null, late: !tx[r.id] && !skip && day < dayNow };
  });
}
function recurTotals() {
  let unpaid = 0, paid = 0;
  recurStatus().forEach(x => { if (x.tx) paid += +x.tx.amount; else if (!x.skip) unpaid += +x.r.amount; });
  return { unpaid, paid };
}

  const list = recurStatus();

  const rows = list.map(x => {

// ---------- графики: расходы по месяцам и по категориям ----------
const CHART_MONTHS = 6;
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const shiftedMonth = k => new Date(S.month.getFullYear(), S.month.getMonth() + k, 1);

// PostgREST отдаёт не больше 1000 строк за раз, поэтому читаем страницами
async function fetchAll(build) {
  const out = [];
  for (let i = 0; ; i += 1000) {
    const { data, error } = await build().range(i, i + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) return out;
  }
}

async function hydrateCharts() {
  const at = S.month.getTime(), key = at + '|' + S.dataVer;
  if (S.offline || S.histKey === key) return;
  S.histKey = key;
  try {
    const from = ymOf(shiftedMonth(1 - CHART_MONTHS)) + '-01', to = monthRange()[1];
    // все поля, а не список: до update-11.sql колонки excluded нет, и запрос по имени сломал бы графики
    const rows = await fetchAll(() => sb.from('transactions').select('*')
      .eq('kind', 'expense').gte('date', from).lt('date', to).order('id'));
    if (S.histKey !== key) return;
    if (S.histFor !== at) S._enter = 'sub';
    S.hist = counted(rows); S.histFor = at; S.histErr = false;
  } catch (e) {
    if (S.histKey !== key) return;
    S.histErr = true;
  }
  if (S.tab === 'lim' && S.limSub === 'charts') render();
}

function renderCharts() {
  if (S.offline) return '<div class="card"><div class="empty">Графикам нужна связь с сервером.</div></div>';
  if (S.histErr) return '<div class="card"><div class="empty">Не удалось загрузить данные. Попробуйте обновить приложение.</div></div>';
  if (!S.hist || S.histFor !== S.month.getTime()) return '<div class="card"><div class="empty">Загружаем…</div></div>';
  const months = Array.from({ length: CHART_MONTHS }, (_, i) => shiftedMonth(i + 1 - CHART_MONTHS));
  const ym = ymOf(S.month), prevYm = ymOf(shiftedMonth(-1));
  const sums = {};
  S.hist.forEach(t => { const k = t.date.slice(0, 7); sums[k] = (sums[k] || 0) + +t.amount; });
  const max = Math.max(1, ...months.map(d => sums[ymOf(d)] || 0));
  const cols = months.map(d => {
    const k = ymOf(d), v = sums[k] || 0, on = k === ym;
    const full = d.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
    return `<button class="mcol ${on ? 'on' : ''}" data-m="${d.getTime()}" aria-label="${esc(full)}: ${fmt(v)}" title="${esc(full)}: ${fmt(v)}">
      ${on ? `<span>${fmt(v)}</span>` : ''}<i style="height:${v / max * 130}px"></i></button>`;
  }).join('');
  const labels = months.map(d => `<span class="${ymOf(d) === ym ? 'on' : ''}">${esc(d.toLocaleDateString('ru-RU', { month: 'short' }).replace('.', ''))}</span>`).join('');

  // текущий месяц ещё не закончился: сравниваем с теми же днями прошлого месяца
  const cut = isCurMonth() ? new Date().getDate() : 31;
  const cur = {}, prev = {};
  let prevTotal = 0;
  S.hist.forEach(t => {
    const k = t.date.slice(0, 7), c = t.category_id || '';
    if (k === ym) cur[c] = (cur[c] || 0) + +t.amount;
    else if (k === prevYm && +t.date.slice(8) <= cut) { prev[c] = (prev[c] || 0) + +t.amount; prevTotal += +t.amount; }
  });
  const total = sums[ym] || 0, diff = total - prevTotal;
  const pm = shiftedMonth(-1).toLocaleDateString('ru-RU', { month: 'long' });
  const prevDays = new Date(S.month.getFullYear(), S.month.getMonth(), 0).getDate();
  const span = isCurMonth() ? `с 1 по ${Math.min(cut, prevDays)} число, ${pm}` : pm;
  const change = v => (Math.round(v) === 0 ? 'столько же' : (v > 0 ? 'на ' + fmt(v) + ' больше' : 'на ' + fmt(-v) + ' меньше'));
  const name = id => id ? ((S.cats.find(c => c.id === id) || {}).name || 'Без категории') : 'Без категории';
  const list = Object.keys(cur).sort((a, b) => cur[b] - cur[a]);
  const top = list.length ? cur[list[0]] : 1;
  const rows = list.map(c => `<div class="cat" style="cursor:default"><div class="row"><span>${esc(name(c))}</span><b>${fmt(cur[c])}</b></div>
    <div class="hbar" style="width:${cur[c] / top * 100}%"></div>
    <div class="mute" style="margin-top:4px">${prev[c] ? change(cur[c] - prev[c]) : 'в прошлом месяце за эти дни трат не было'}</div></div>`).join('');
  return `<div class="card"><b>Расходы по месяцам</b>
      <div class="mute">Нажмите на столбик, чтобы открыть месяц</div>
      <div class="cols">${cols}</div><div class="colx">${labels}</div></div>
    <div class="card"><div class="mute">Расходы за месяц</div><div class="big">${fmt(total)}</div>
      <div class="mute">${change(diff)}, чем: ${esc(span)}</div></div>
    <div class="card"><b>По категориям</b>${rows || '<div class="empty">В этом месяце расходов нет.</div>'}</div>`;
}

// Отдельная кнопка «Сохранить»: Safari разрешает «Поделиться» только сразу после нажатия, а файл готовится дольше
function saveFile(name, text, type) {
  const file = new File([text], name, { type });
  sheet(`<b>Файл готов</b>
    <p class="mute" style="overflow-wrap:anywhere">${esc(name)}</p>
    <button class="full" id="sv">Сохранить</button>
    <button class="ghost full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  $('#sv').onclick = async () => {
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return closeSheet(); }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    closeSheet();
  };
}

// разделитель «;» и запятая в суммах: так файл открывается в русском Excel. Текст из банка не должен стать формулой.

// ---------- общие дела и календарь ----------
const todoSeg = () => `<div class="seg"><button data-ts="list" class="${S.todoSub !== 'cal' ? 'on' : ''}">Список</button><button data-ts="cal" class="${S.todoSub === 'cal' ? 'on' : ''}">Календарь</button></div>`;
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toLocaleDateString('sv'); };
const dayLabel = d => new Date(d + 'T00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', weekday: 'short' });
const openTasks = () => S.tasks.filter(t => !t.done);
const todayTasks = () => openTasks().filter(t => t.due && t.due <= today());     // на сегодня и просроченные
const sortTasks = list => list.slice().sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999')
  || (a.due_time || '99').localeCompare(b.due_time || '99') || String(a.created_at).localeCompare(String(b.created_at)));
const tasksNeedSql = '<div class="card"><b>Дела</b><p class="mute">Выполните файл update-12.sql в Supabase (SQL Editor → New query → Run), затем обновите приложение.</p></div>';

function taskMeta(t) {
  const td = today(), parts = [];
  if (t.due) parts.push(t.due < td && !t.done ? 'просрочено, ' + dayLabel(t.due) : t.due === td ? 'сегодня' : t.due === addDays(td, 1) ? 'завтра' : dayLabel(t.due));
  if (t.due_time) parts.push(t.due_time.slice(0, 5));
  parts.push(t.assignee ? nameOf(t.assignee) : 'общее');
  if (t.repeat) parts.push('↻ ' + REPEAT[t.repeat].toLowerCase());
  return parts.join(' · ');
}
const REPEAT = { day: 'Каждый день', week: 'Каждую неделю', month: 'Каждый месяц', year: 'Каждый год' };
// следующая дата повтора; 31-е в коротком месяце становится последним днём месяца, 29 февраля — 28-м
function nextDue(iso, repeat) {
  if (repeat === 'day') return addDays(iso, 1);
  if (repeat === 'week') return addDays(iso, 7);
  const [y, m, d] = iso.split('-').map(Number);
  if (repeat === 'year') return `${y + 1}-${pad(m)}-${pad(Math.min(d, new Date(y + 1, m, 0).getDate()))}`;
  const last = new Date(y, m + 1, 0).getDate();
  return `${m === 12 ? y + 1 : y}-${pad(m === 12 ? 1 : m + 1)}-${pad(Math.min(d, last))}`;
}
function taskRow(t) {
  const late = !t.done && t.due && t.due < today();
  return `<div class="task${t.done ? ' done' : ''}" data-task="${t.id}"><button class="tchk" data-tdone="${t.id}" aria-label="${t.done ? 'Вернуть в работу' : 'Отметить сделанным'}">${t.done ? '✓' : ''}</button>
    <div style="min-width:0;flex:1"><div class="ttl">${esc(t.title)}</div><div class="mute${late ? ' txt-bad' : ''}">${esc(taskMeta(t))}</div></div></div>`;
}

function renderTodo() {
  if (!S.tasksReady) return tasksNeedSql;
  const td = today(), tm = addDays(td, 1), open = sortTasks(openTasks());
  const groups = [['Просрочено', open.filter(t => t.due && t.due < td)], ['Сегодня', open.filter(t => t.due === td)],
    ['Завтра', open.filter(t => t.due === tm)], ['Позже', open.filter(t => t.due && t.due > tm)], ['Без даты', open.filter(t => !t.due)]];
  const done = S.tasks.filter(t => t.done).sort((a, b) => String(b.done_at || '').localeCompare(String(a.done_at || ''))).slice(0, 15);
  const body = groups.filter(g => g[1].length).map(([l, list]) => `<div class="day">${l}</div><div class="card">${list.map(taskRow).join('')}</div>`).join('');
  return (body || '<div class="card"><div class="empty">Дел нет.<br>Нажмите +, чтобы добавить.</div></div>')
    + (done.length ? `<div class="day">Сделано</div><div class="card">${done.map(taskRow).join('')}</div>` : '');
}

function renderCal() {
  if (!S.tasksReady) return tasksNeedSql;
  const y = S.month.getFullYear(), m = S.month.getMonth(), ym = ymOf(S.month), td = today();
  const dim = new Date(y, m + 1, 0).getDate(), lead = (new Date(y, m, 1).getDay() + 6) % 7;   // неделя с понедельника
  if (!S.calDay || S.calDay.slice(0, 7) !== ym) S.calDay = td.slice(0, 7) === ym ? td : ym + '-01';
  const pays = S.recurReady ? recurStatus().filter(x => !x.skip) : [];
  let cells = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => `<div class="wd">${d}</div>`).join('') + '<div></div>'.repeat(lead);
  for (let d = 1; d <= dim; d++) {
    const iso = `${ym}-${pad(d)}`;
    const n = openTasks().filter(t => t.due === iso).length, p = pays.some(x => x.day === d && !x.tx);
    cells += `<button class="cday${iso === td ? ' today' : ''}${iso === S.calDay ? ' on' : ''}" data-cd="${iso}" aria-label="${d}${n ? ', дел: ' + n : ''}${p ? ', платёж' : ''}"><span>${d}</span><i>${'<b></b>'.repeat(Math.min(n, 3))}${p ? '<b class="dp"></b>' : ''}</i></button>`;
  }
  const day = +S.calDay.slice(8);
  const list = sortTasks(S.tasks.filter(t => t.due === S.calDay));
  const payRows = pays.filter(x => x.day === day).map(x => `<div class="pi" style="cursor:default"><div><div>Платёж: ${esc(x.r.name)}</div>
    <div class="mute${x.tx ? ' txt-good' : x.late ? ' txt-bad' : ''}">${x.tx ? 'оплачено' : x.late ? 'просрочено' : 'по плану'}</div></div><div class="amt">${fmt(x.tx ? +x.tx.amount : +x.r.amount)}</div></div>`).join('');
  const label = new Date(S.calDay + 'T00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'long' });
  return `<div class="card"><div class="cal">${cells}</div>
      <div class="legend"><span><i><b></b></i> дела</span>${S.recurReady ? '<span><i><b class="dp"></b></i> платежи</span>' : ''}</div></div>
    <div class="day">${esc(label)}</div>
    <div class="card">${list.map(taskRow).join('') + payRows || '<div class="mute">На этот день ничего нет.</div>'}
      <button class="ghost full" id="tadd">+ Дело на этот день</button></div>`;
}

function openTask(id, pre = {}) {
  const t = id ? S.tasks.find(x => x.id === id) : null;
  if (id && !t) return;
  const v = t || { title: '', due: pre.due || '', due_time: '', assignee: null, repeat: null };
  sheet(`<b>${t ? 'Дело' : 'Новое дело'}</b>
    <input id="tt" value="${esc(v.title)}" placeholder="Что сделать, например: записать кота к врачу" maxlength="300">
    <div class="row" style="gap:8px"><input id="tdt" type="date" value="${esc(v.due || '')}" style="flex:1"><input id="ttm" type="time" value="${esc((v.due_time || '').slice(0, 5))}" style="width:116px"></div>
    <div class="mute">Дату и время можно не указывать. Если указать время, за час придёт напоминание: общее дело — всем, своё — только тому, чьё оно.</div>
    <select id="tas"><option value="">Общее</option>${S.members.map(m => `<option value="${m.user_id}"${m.user_id === v.assignee ? ' selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
    <select id="trp"><option value="">Не повторять</option>${Object.entries(REPEAT).map(([k, l]) => `<option value="${k}"${k === v.repeat ? ' selected' : ''}>${l}</option>`).join('')}</select>
    <div class="err" id="err"></div>
    <button class="full" id="tsv">Сохранить</button>
    ${t ? `<button class="ghost full" id="tdn">${t.done ? 'Вернуть в работу' : 'Сделано'}</button><button class="ghost full" id="tdl" style="color:var(--bad)">Удалить</button>` : ''}
    <button class="link full" id="cl">Отмена</button>`);
  if (!t && $('#tt').focus) $('#tt').focus();
  $('#cl').onclick = closeSheet;
  const sqlHint = e => /tasks_repeat_check/i.test(e.message) ? 'Для повтора «каждый год» выполните update-15.sql в Supabase'
    : /repeat/i.test(e.message) ? 'Для повтора выполните update-13.sql в Supabase'
    : /tasks|relation|schema cache/i.test(e.message) ? 'Сначала выполните update-12.sql в Supabase' : e.message;
  $('#tsv').onclick = async () => {
    const title = $('#tt').value.trim(), due = $('#tdt').value || null, time = $('#ttm').value || null, repeat = $('#trp').value || null;
    if (!title) return $('#err').textContent = 'Напишите, что сделать';
    if (time && !due) return $('#err').textContent = 'Для времени укажите и дату';
    const row = { title, due, due_time: time, assignee: $('#tas').value || null };
    if (repeat || (t && t.repeat)) row.repeat = repeat;     // поле только если повтор задан: до update-13.sql колонки нет
    $('#tsv').disabled = true;
    const { data, error } = t ? await sb.from('tasks').update(row).eq('id', id).select()
      : await sb.from('tasks').insert({ household_id: S.household.id, ...row }).select();
    $('#tsv').disabled = false;
    if (error) return $('#err').textContent = sqlHint(error);
    if (!data || !data.length) return $('#err').textContent = 'Не удалось сохранить';
    closeSheet(); refresh();
  };
  if ($('#tdn')) $('#tdn').onclick = () => { closeSheet(); toggleTask(id); };
  if ($('#tdl')) $('#tdl').onclick = async () => {
    if (!confirm('Удалить дело «' + t.title + '»?')) return;
    const { error } = await sb.from('tasks').delete().eq('id', id);
    if (error) return $('#err').textContent = sqlHint(error);
    closeSheet(); refresh();
  };
}

// отметка «сделано» видна сразу, сервер догоняет; при ошибке возвращаем как было
async function toggleTask(id) {
  const t = S.tasks.find(x => x.id === id);
  if (!t) return;
  const was = { done: t.done, done_at: t.done_at };
  t.done = !t.done; t.done_at = t.done ? new Date().toISOString() : null;
  if (t.done) { sound('success'); hanko(); }
  render();
  const { data, error } = await sb.from('tasks').update({ done: t.done, done_at: t.done_at }).eq('id', id).select();
  if (error || !data || !data.length) {
    Object.assign(t, was); render();
    return toast('Не удалось сохранить: ' + (error ? error.message : 'нет связи'), 4000);
  }
  // повторяющееся дело: сразу создаём следующее, если его ещё нет (повторная отметка не плодит копии)
  if (t.done && t.repeat) {
    const due = nextDue(t.due || today(), t.repeat);
    if (!S.tasks.some(x => !x.done && x.title === t.title && x.repeat === t.repeat && x.due === due)) {
      const next = { household_id: S.household.id, title: t.title, due, due_time: t.due_time || null, assignee: t.assignee || null, repeat: t.repeat };
      const { error: e2 } = await sb.from('tasks').insert(next);
      if (e2) return toast('Следующее дело не создалось: ' + e2.message, 5000);
      toast('Следующее: ' + dayLabel(due));
    }
    refresh();
  }
}

// время года: auto — по месяцу; или выбранное в настройках
const SEASONS = { auto: 'По времени года', spring: 'Весна: сакура', summer: 'Лето: светлячки', autumn: 'Осень: клён', winter: 'Зима: снег' };
const seasonNow = () => { const m = new Date().getMonth(); return m >= 2 && m <= 4 ? 'spring' : m >= 5 && m <= 7 ? 'summer' : m >= 8 && m <= 10 ? 'autumn' : 'winter'; };
const seasonPick = () => { let s = null; try { s = localStorage.getItem('fb_season'); } catch (e) {} return SEASONS[s] ? s : 'auto'; };
function applySeason() {
  const bg = document.getElementById('bg');
  if (!bg) return;
  const s = seasonPick() === 'auto' ? seasonNow() : seasonPick();
  if (bg.dataset.season === s) return;
  bg.dataset.season = s;
  bg.querySelectorAll('i').forEach(i => i.remove());
  const n = { spring: 7, summer: 12, autumn: 8, winter: 22 }[s];
  const leaf = ['#ff7a45', '#ff5a3c', '#ffb347', '#e8433a', '#ff9147'];
  let html = '';
  for (let k = 0; k < n; k++) {
    const left = Math.round((k + .5) / n * 100 + (k % 2 ? 3 : -3));
    const dur = s === 'winter' ? 11 + (k * 7) % 9 : s === 'summer' ? 5 + (k * 3) % 6 : 15 + (k * 5) % 8;
    const extra = s === 'autumn' ? `--lc:${leaf[k % leaf.length]};` : s === 'summer' ? `--fb:${12 + (k * 13) % 30}%;` : s === 'winter' ? `width:${3 + k % 4}px;height:${3 + k % 4}px;` : '';
    html += `<i style="left:${left}%;animation-duration:${dur}s;animation-delay:-${(k * 2.3).toFixed(1)}s;${extra}"></i>`;
  }
  bg.insertAdjacentHTML('beforeend', html);
}

// ---------- итоги месяца ----------
// Уведомление приходит 1-го числа (функция push-digest, режим month); по нажатию открывается этот разбор.
const MONTH_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTH_PREP = ['январе', 'феврале', 'марте', 'апреле', 'мае', 'июне', 'июле', 'августе', 'сентябре', 'октябре', 'ноябре', 'декабре'];
const MONTH_NOM = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MONTH_DAT = ['январю', 'февралю', 'марту', 'апрелю', 'маю', 'июню', 'июлю', 'августу', 'сентябрю', 'октябрю', 'ноябрю', 'декабрю'];
const MONTH_INS = ['январём', 'февралём', 'мартом', 'апрелем', 'маем', 'июнем', 'июлем', 'августом', 'сентябрём', 'октябрём', 'ноябрём', 'декабрём'];
const ymAdd = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const ymNow = () => today().slice(0, 7);

// расчёт итогов: tx — операции за этот и прошлый месяц
function summaryData(ym, tx, cats) {
  const prev = ymAdd(ym, -1), list = (tx || []).filter(t => !t.excluded);
  const of = (k, m) => list.filter(t => t.kind === k && String(t.date).slice(0, 7) === m);
  const total = a => a.reduce((s, t) => s + +t.amount, 0);
  const exp = of('expense', ym), pexp = of('expense', prev);
  const by = (a) => { const o = {}; a.forEach(t => { o[t.category_id || ''] = (o[t.category_id || ''] || 0) + +t.amount; }); return o; };
  const cur = by(exp), old = by(pexp);
  const cat = id => (cats || []).find(c => c.id === id);
  const rows = Object.keys({ ...cur, ...old }).map(id => ({ id, name: cat(id) ? cat(id).name : 'Без категории', sum: cur[id] || 0, prev: old[id] || 0,
    limit: cat(id) && +cat(id).monthly_limit > 0 ? +cat(id).monthly_limit : 0 })).filter(r => r.sum > 0).sort((a, b) => b.sum - a.sum);
  const e = total(exp), pe = total(pexp), inc = total(of('income', ym));
  return { ym, exp: e, prevExp: pe, inc, left: inc - e, diffPct: pe > 0 ? Math.round((e - pe) / pe * 100) : null, rows,
    over: rows.filter(r => r.limit && r.sum > r.limit), top: exp.slice().sort((a, b) => b.amount - a.amount).slice(0, 5), count: exp.length };
}

async function openSummary(ym) {
  if (!/^\d{4}-\d{2}$/.test(ym || '')) return;
  const mi = +ym.slice(5) - 1, pi = +ymAdd(ym, -1).slice(5) - 1, year = ym.slice(0, 4) !== String(new Date().getFullYear()) ? ' ' + ym.slice(0, 4) : '';
  sheet(`<b>Итоги ${MONTH_GEN[mi]}${year}</b><div id="sumbox"><div class="empty">Считаем…</div></div><button class="link full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  const { data, error } = await sb.from('transactions').select('id,kind,amount,date,category_id,excluded,note,user_id')
    .gte('date', ymAdd(ym, -1) + '-01').lt('date', ymAdd(ym, 1) + '-01').limit(5000);
  const box = $('#sumbox');
  if (!box) return;
  if (error) { box.innerHTML = `<div class="empty">${isNetErr(error) ? 'Итогам нужна связь с сервером.' : esc(error.message)}</div>`; return; }
  const d = summaryData(ym, data, S.cats);
  if (!d.exp && !d.inc) { box.innerHTML = '<div class="empty">В этом месяце операций нет.</div>'; return; }
  const live = ym === ymNow();
  const max = Math.max(1, ...d.rows.map(r => r.sum));
  const delta = r => { const v = r.sum - r.prev; return !r.prev ? '<span class="mute">новое</span>' : Math.abs(v) < 1 ? '' : `<span class="${v > 0 ? 'up' : 'down'}">${v > 0 ? '↑' : '↓'} ${fmt(Math.abs(v))}</span>`; };
  box.innerHTML = `${live ? '<div class="mute">Месяц ещё идёт: цифры на сегодня.</div>' : ''}
    <div class="sumtop"><div><span class="mute">Расходы</span><b>${fmt(d.exp)}</b>
      ${d.diffPct === null ? '' : `<span class="chip ${d.diffPct > 0 ? 'up' : 'down'}">${d.diffPct === 0 ? 'как в ' + MONTH_PREP[pi] : (d.diffPct > 0 ? '+' : '−') + Math.abs(d.diffPct) + '% к ' + MONTH_DAT[pi]}</span>`}</div>
      <div><span class="mute">Доходы</span><b style="color:var(--good)">${fmt(d.inc)}</b>
      ${d.inc ? `<span class="chip ${d.left >= 0 ? 'down' : 'up'}">${d.left >= 0 ? 'осталось ' + fmt(d.left) : 'не хватило ' + fmt(-d.left)}</span>` : ''}</div></div>
    ${d.over.length ? `<div class="sumwarn">Превышен лимит: ${d.over.map(r => esc(r.name) + ' на ' + fmt(r.sum - r.limit)).join(', ')}</div>`
      : S.cats.some(c => c.kind === 'expense' && +c.monthly_limit > 0) ? '<div class="sumok">Все лимиты соблюдены 👍</div>' : ''}
    <div class="sumh">По категориям <span class="mute">· в сравнении с ${MONTH_INS[pi]}</span></div>

function openFromUrl(url) {

  if (!m && !c) return;

// ---------- чат семьи и родственники (update-19.sql) ----------
// Родственник по коду для родственников попадает в семью с ролью relative: видит только чат семьи, общие фото
// и помощника. Остальное ему закрыто в базе (my_household() для него пусто), а здесь просто не показывается.
function setMsgs(r) {
  S.msgsReady = !r.error;
  S.msgs = S.msgsReady ? (r.data || []).slice().reverse() : [];
}
async function loadMsgs() {
  const r = await sb.from('family_messages').select('*').order('created_at', { ascending: false }).limit(300);
  if (r.error) return;
  const before = S.msgs.map(x => x.id).join();
  const pend = S.msgs.filter(x => x._pending && !(r.data || []).some(y => y.id === x.id));
  setMsgs(r);
  S.msgs = S.msgs.concat(pend);
  if (S.msgs.map(x => x.id).join() === before) return;
  if (S.tab === 'chat') drawFam();
  else if ($('#chatsub')) $('#chatsub').textContent = chatSub();
}
async function refreshRel(opts = {}) {
  const [m, ph, fm] = await Promise.all([
    sb.from('members').select('*'),
    sb.from('photos').select('*').order('created_at', { ascending: false }).limit(600),
    sb.from('family_messages').select('*').order('created_at', { ascending: false }).limit(300)]);
  if ([m, ph].some(x => x.error && isNetErr(x.error))) {
    const was = S.offline; S.offline = true;
    if (!was || !opts.poll) render();
    startPolling();
    return;
  }
  if (m.error) return fail(m.error);
  const wasOff = S.offline;
  S.offline = false;
  const sig = JSON.stringify([m.data, ph.data, fm.data, wasOff]);
  if (opts.poll && sig === S._sig) return;
  S._sig = sig;
  S.dataVer++;
  setPeople(m.data);
  if (!S.me) return load();            // убрали из семьи: снова экран «Меня пригласили»
  S.photosReady = !ph.error;
  S.photos = (S.photosReady && ph.data) || [];
  setMsgs(fm);
  saveSnap();
  render();
}

// непрочитанные: время последнего увиденного сообщения хранится на телефоне
const convOf = m => m.to_user ? (m.user_id === S.user.id ? m.to_user : m.user_id) : '';
const convMsgs = (key = S.chatWith || '') => S.msgs.filter(m => convOf(m) === key);
const famSeenMap = () => { const o = lsGet('fb_fam_seen2'); if (o && typeof o === 'object') return o; let old = ''; try { old = localStorage.getItem('fb_fam_seen') || ''; } catch (e) {} return { '': old }; };
// новых в одной переписке (key) или во всех (key не задан)
const famUnread = key => { const seen = famSeenMap(); return S.msgs.filter(m => m.user_id !== S.user.id && !m._pending && (key === undefined || convOf(m) === key) && m.created_at > (seen[convOf(m)] || '')).length; };
function famMarkSeen() {
  const key = S.chatWith || '', last = convMsgs(key).filter(m => !m._pending).slice(-1)[0];
  if (!last) return;
  const seen = famSeenMap(); seen[key] = last.created_at; lsSet('fb_fam_seen2', seen);
  if (!key) { try { localStorage.setItem('fb_fam_seen', last.created_at); } catch (e) {} }
}
function chatSub() {
  if (!S.msgsReady) return 'нужно обновить базу';
  const u = famUnread();
  if (u) return 'Новых: ' + u;
  const last = S.msgs.slice(-1)[0];
  return last ? (last.to_user ? '🔒 ' : '') + (last.user_id === S.user.id ? 'Вы' : nameOf(last.user_id)) + ': ' + famSnip(last).slice(0, 40) : 'Напишите родным';
}

const FAM_COLORS = ['#f9a8d4', '#7df0c4', '#fcd34d', '#93c5fd', '#fdba74', '#c4b5fd'];
const famColor = id => { const i = S.circle.findIndex(m => m.user_id === id); return FAM_COLORS[(i < 0 ? 0 : i) % FAM_COLORS.length]; };
const linkify = s => s.replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function famDay(iso) {
  const d = String(iso).slice(0, 10), loc = new Date(iso);
  const dl = loc.getFullYear() + '-' + pad(loc.getMonth() + 1) + '-' + pad(loc.getDate());
  if (dl === today()) return 'Сегодня';
  if (dl === addDays(today(), -1)) return 'Вчера';
  return loc.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', ...(loc.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) }) || d;
}
// собеседники: общий чат и каждый член семьи, с числом новых
function famPeople() {
  const chip = (key, label) => { const u = famUnread(key); return `<button data-cw="${key}" class="${(S.chatWith || '') === key ? 'on' : ''}">${label}${u ? `<b>${u}</b>` : ''}</button>`; };
  return `<div class="fpeople">${chip('', '👨‍👩‍👧 Все')}${S.circle.filter(m => m.user_id !== S.user.id).map(m => chip(m.user_id, esc(m.name))).join('')}</div>`;
}
// превью сообщения одной строкой: для плитки, ответа, уведомления
const famSnip = m => !m ? 'Сообщение удалено' : (m.photo_path ? '📷 ' + (String(m.body || '').trim() || 'Фото') : String(m.body || '')).replace(/\s+/g, ' ').trim().slice(0, 80);
const CLIP_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8.5 6l1.5-2.5h4L15.5 6"/></svg>';
function famHtml() {
  const list = convMsgs();
  if (!list.length) return S.chatWith
    ? `<div class="card"><div class="empty">Личная переписка с ${esc(nameOf(S.chatWith))}.<br>Её видите только вы двое.</div></div>`
    : '<div class="card"><div class="empty">Здесь общий чат всей семьи.<br>Напишите первое сообщение.</div></div>';
  let out = '', lastDay = '';
  list.forEach((m, i, arr) => {
    const day = famDay(m.created_at), newDay = day !== lastDay;
    if (newDay) { out += `<div class="fday">${esc(day)}</div>`; lastDay = day; }
    const mine = m.user_id === S.user.id, prev = arr[i - 1];
    const who = !mine && !S.chatWith && (newDay || !prev || prev.user_id !== m.user_id);
    const time = new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const q = m.reply_to ? S.msgs.find(x => x.id === m.reply_to) : null;
    out += `<div class="mrow${mine ? ' me' : ''}" id="fm-${m.id}"><div class="msg ${mine ? 'me' : 'ai'} fm${m._pending ? ' pend' : ''}${m.photo_path ? ' hasimg' : ''}"${m._pending ? '' : ` data-fm="${m.id}"`}>`
      + (who ? `<b class="fwho" style="color:${famColor(m.user_id)}">${esc(nameOf(m.user_id))}</b>` : '')
      + (m.fwd_from ? `<div class="ffwd">↪ Переслано от ${esc(nameOf(m.fwd_from))}</div>` : '')
      + (m.reply_to ? `<div class="fq"${q ? ` data-jump="${q.id}"` : ''}><b style="color:${q ? famColor(q.user_id) : 'inherit'}">${q ? esc(q.user_id === S.user.id ? 'Вы' : nameOf(q.user_id)) : ''}</b><span>${esc(famSnip(q))}</span></div>` : '')
      + (m.photo_path ? `<img class="fimg" ${m._local ? `src="${m._local}"` : `data-p="${esc(m.thumb_path || m.photo_path)}"`} data-full="${esc(m.photo_path)}" alt="Фото">` : '')
      + (m.body ? `<div class="ftx">${linkify(esc(m.body))}</div>` : '')
      + `<span class="ft">${m._pending ? '…' : time}</span></div></div>`;
  });
  return out;
}
function famBarHtml() {
  const q = S.replyTo && S.msgs.find(x => x.id === S.replyTo);
  return q ? `<div class="freply"><i>↩</i><div><b>${esc(q.user_id === S.user.id ? 'Вы' : nameOf(q.user_id))}</b><span>${esc(famSnip(q))}</span></div><button id="frx" aria-label="Отменить ответ">✕</button></div>` : '';
}
function renderFam() {
  if (!S.msgsReady) return '<div class="card"><b>Чат семьи</b><p class="mute">Выполните файл update-19.sql в Supabase (SQL Editor → New query → Run), затем обновите приложение.</p></div>';

      <button id="fgo" aria-label="Отправить">${SEND_SVG}</button></div></div>`;
}
// прокрутка ленты: вниз — после своего сообщения и при входе; если человек листает старые, новое его не дёргает
function famBottom(force) {
  const f = $('#fchat');
  if (!f || f.scrollHeight === undefined) return;
  if (force || f.scrollHeight - f.scrollTop - f.clientHeight < 160) f.scrollTop = f.scrollHeight;
}
// экран чата на всю высоту видимой области: поле ввода всегда внизу, и над клавиатурой тоже
function chatLayout() {
  const w = document.querySelector('.chatwrap'), vv = window.visualViewport;
  if (!w || !w.style) return;
  if (vv) { w.style.height = Math.round(vv.height) + 'px'; w.style.top = Math.round(vv.offsetTop || 0) + 'px'; }
  if (!S.chatVvOn && vv && vv.addEventListener) {
    S.chatVvOn = true;
    const on = () => { if (document.querySelector('.chatwrap')) { chatLayout(); famBottom(); } };
    vv.addEventListener('resize', on); vv.addEventListener('scroll', on);
  }
}
async function hydrateFam() {
  const paths = [...document.querySelectorAll('#fchat img[data-p]')].map(i => i.dataset.p);
  if (!paths.length) return;
  applyUrls();
  await signUrls(paths);
  applyUrls();

}
function drawFam(force) {
  if (!$('#fchat')) return;
  $('#fchat').innerHTML = famHtml();
  bindFamRows();
  famMarkSeen();
  const fp = document.querySelector('.fpeople');
  if (fp && fp.outerHTML !== undefined) { fp.outerHTML = famPeople(); bindFamPeople(); }
  famBottom(force);
  hydrateFam();
}
function drawReply() {
  if (!$('#frep')) return;
  $('#frep').innerHTML = famBarHtml();
  if ($('#frx')) $('#frx').onclick = () => { S.replyTo = null; drawReply(); };
}
function startReply(id) {
  S.replyTo = id;
  drawReply();
  if ($('#ftx') && $('#ftx').focus) $('#ftx').focus();
}
function bindFamRows() {
  $('#app').querySelectorAll('[data-fm]').forEach(el => {
    el.onclick = e => {
      const t = e && e.target;
      if (t && t.closest && t.closest('a')) return;
      if (t && t.closest && t.closest('.fimg')) return openChatPhoto(t.closest('.fimg').dataset.full);
      if (t && t.closest && t.closest('[data-jump]')) return famJump(t.closest('[data-jump]').dataset.jump);
      openFamMenu(el.dataset.fm);
    };
    // смахнуть сообщение влево — ответить на него (как в Телеграме)
    let x0 = null;
    el.ontouchstart = e => { x0 = e.touches[0].clientX; };
    el.ontouchend = e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (dx < -60) startReply(el.dataset.fm); };
  });
}
function famJump(id) {
  const r = document.getElementById('fm-' + id);
  if (!r) return;
  if (r.scrollIntoView) r.scrollIntoView({ block: 'center', behavior: 'smooth' });
  if (r.classList) { r.classList.add('flash'); setTimeout(() => r.classList.remove('flash'), 1400); }
}
function bindFamPeople() {
  $('#app').querySelectorAll('[data-cw]').forEach(b => b.onclick = () => { S.chatWith = b.dataset.cw || null; S.replyTo = null; render(); });
}
function bindFam() {
  if (!$('#ftx')) return;
  bindFamPeople();
  bindFamRows();
  famMarkSeen();
  drawReply();
  const tx = $('#ftx');
  const fit = () => { if (tx.style) { tx.style.height = 'auto'; tx.style.height = Math.min(132, tx.scrollHeight || 0) + 'px'; } };
  tx.oninput = fit;
  tx.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); sendFam(); } };
  $('#fgo').onclick = sendFam;
  $('#fatt').onclick = pickChatPhoto;
  try { window.scrollTo(0, 0); } catch (e) {}
  chatLayout();
  setTimeout(() => famBottom(true), 0);
  hydrateFam();
}
// общая часть: черновик сообщения в текущую переписку (с ответом, если выбран)
function famRow(extra) {
  return { id: crypto.randomUUID(), household_id: S.me.household_id, user_id: S.user.id, body: '',
    ...(S.chatWith ? { to_user: S.chatWith } : {}), ...(S.replyTo ? { reply_to: S.replyTo } : {}), ...extra };
}
async function famInsert(row, local) {
  S.msgs.push({ ...row, created_at: new Date().toISOString(), _pending: true, ...(local || {}) });
  drawFam(true);
  const { error } = await sb.from('family_messages').insert(row);
  if (error) { S.msgs = S.msgs.filter(x => x.id !== row.id); drawFam(); return error; }
  const x = S.msgs.find(m => m.id === row.id);
  if (x) { delete x._pending; delete x._local; }
  drawFam();
  loadMsgs();
  return null;
}
async function sendFam() {
  const tx = $('#ftx');
  const body = (tx.value || '').trim().slice(0, 4000);
  if (!body) return;
  const row = famRow({ body });
  tx.value = ''; if (tx.style) tx.style.height = 'auto';
  S.replyTo = null; drawReply();
  if (tx.focus) tx.focus();
  const error = await famInsert(row);
  if (error) {
    if (!tx.value) tx.value = body;
    return toast(isNetErr(error) ? 'Нет связи: сообщение не отправлено' : 'Не отправилось: ' + error.message, 4000);
  }
}

// ---- фото в переписке: в галерею не попадают, лежат в папке chat (update-22.sql) ----
function pickChatPhoto() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; inp.style.display = 'none';
  inp.onchange = () => { const f = [...inp.files].slice(0, 10); inp.remove(); if (f.length) sendChatPhotos(f); };
  document.body.appendChild(inp);
  inp.click();
}
async function uploadChatFile(id, blob, tblob) {
  const hid = S.me.household_id;
  const path = `${hid}/chat/${id}.jpg`, tpath = `${hid}/chat/${id}_t.jpg`;
  let r = await bucket().upload(path, blob, { contentType: 'image/jpeg' });
  if (r.error) throw r.error;
  r = await bucket().upload(tpath, tblob, { contentType: 'image/jpeg' });
  if (r.error) { await bucket().remove([path]); throw r.error; }
  return { photo_path: path, thumb_path: tpath };
}
async function sendChatPhotos(files) {
  const tx = $('#ftx');
  let caption = tx ? (tx.value || '').trim().slice(0, 4000) : '';
  if (tx) { tx.value = ''; if (tx.style) tx.style.height = 'auto'; }
  let bad = 0, lastErr = '';
  for (const f of files) {
    let row = null, paths = null;
    try {
      const full = await toJpeg(f, 1600, .82), th = await toJpeg(f, 480, .75);
      const id = crypto.randomUUID();
      let local = '';                                // пока грузится, показываем фото с телефона
      try { local = URL.createObjectURL(th.blob); } catch (e) {}
      paths = await uploadChatFile(id, full.blob, th.blob);
      row = famRow({ id, body: caption, ...paths });
      caption = '';                                  // подпись — только к первому фото
      S.replyTo = null; drawReply();
      const error = await famInsert(row, { _local: local });
      if (error) { await bucket().remove([paths.photo_path, paths.thumb_path]); throw error; }
    } catch (e) { bad++; lastErr = isNetErr(e) ? 'нет связи' : ((e && e.message) || String(e)); }
  }
  if (bad) toast(`Не отправилось фото: ${bad} (${lastErr})`, 5000);
}
async function openChatPhoto(path) {
  if (!path) return;
  closeViewer();
  viewerId = null;
  const v = document.createElement('div');
  v.className = 'viewer'; v.id = 'viewer';
  v.innerHTML = `<div class="vt"><button class="ghost" id="vx">Закрыть</button><span>Фото из переписки</span></div>
    <div class="vi"><img id="vimg" data-p="${esc(path)}" alt="Фото"></div>
    <div class="vb"><button class="ghost full" id="vs">Сохранить на телефон</button></div>`;
  document.body.appendChild(v);
  viewerOpen = true;
  overlayOpened();
  document.addEventListener('keydown', viewerKey);
  v.querySelector('#vx').onclick = closeViewerUI;
  v.querySelector('#vs').onclick = async () => {
    const { data, error } = await bucket().createSignedUrl(path, 600);
    if (error) return toast('Не удалось получить файл', 3000);
    try {
      const blob = await (await fetch(data.signedUrl)).blob();
      const file = new File([blob], 'foto.jpg', { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    window.open(data.signedUrl, '_blank');
  };
  await signUrls([path]);
  applyUrls();
}

// ---- меню сообщения: ответить, переслать, скопировать, удалить ----
// удалить можно своё; создатель семьи — ещё и любое в общем чате (личные чужие ему и не видны)
const famCanDel = m => !!m && (m.user_id === S.user.id || (!!S.me && S.me.role === 'owner' && !m.to_user));

  const m = S.msgs.find(x => x.id === id);

  sheet(`<div class="fmenu"><div class="fmq">${esc(famSnip(m))}</div>
    <button class="ghost full" id="mrep">↩ Ответить</button>

// проверка и чистка того, что вернула модель (или шаблоны): только понятные действия с правильными значениями
function voiceClean(list) {
  const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
  const out = [];
  (Array.isArray(list) ? list : []).slice(0, 20).forEach(a => {
    if (!a || typeof a !== 'object') return;
    const title = String(a.title || '').trim().slice(0, 200);
    if (a.type === 'expense' || a.type === 'income') {
      const amount = Math.round(+a.amount * 100) / 100;
      if (!(amount > 0 && amount < 10000000)) return;
      out.push({ type: a.type, amount, category: String(a.category || '').trim(), note: String(a.note || '').trim().slice(0, 200), date: isDate(a.date) ? a.date : today() });
    } else if (a.type === 'shop' && title) {
      const qty = String(a.qty || '').trim().slice(0, 40);
      out.push({ type: 'shop', title, qty: qty && qty !== '1' ? qty : null });     // голая «1» — модель дописала сама, не показываем
    }
    else if ((a.type === 'bought' || a.type === 'task_done') && title) out.push({ type: a.type, title });
    else if (a.type === 'task' && title) {
      const time = /^\d{1,2}:\d{2}$/.test(a.time || '') ? pad(+a.time.split(':')[0]) + ':' + a.time.split(':')[1] : null;
      const due = isDate(a.due) ? a.due : time ? today() : null;
      out.push({ type: 'task', title, due, time: time && +time.slice(0, 2) < 24 ? time : null, who: ['me', 'other'].includes(a.who) ? a.who : 'all', repeat: REPEAT[a.repeat] ? a.repeat : null });
    }
  });
  return out;
}

// найти по названию: сначала точное совпадение, потом «содержит»
function vfind(list, name, key = 'name') {
  const n = vnorm(name);
  if (!n) return null;
  return list.find(x => vnorm(x[key]) === n) || list.find(x => vnorm(x[key]).includes(n) || n.includes(vnorm(x[key]))) || null;
}

// простые фразы без помощника: «потратил 450 на продукты», «купить молоко и хлеб», «напомни завтра в 18 забрать посылку»
function voiceLocal(text) {
  const t = vnorm(text).replace(/[.!?]+$/, '');
  const shop = t.match(/^(?:купить|купи|надо купить|нужно купить|добавь в список|в список)\s+(.+)$/);
  if (shop) return shop[1].split(/\s*(?:,|\sи\s)\s*/).filter(Boolean).map(title => ({ type: 'shop', title }));
  const task = t.match(/^(?:напомни|напомнить|дело|задача|надо|нужно)\s+(.+)$/);
  if (task) {
    let rest = task[1], due = null, time = null;
    const day = { 'сегодня': 0, 'завтра': 1, 'послезавтра': 2 };
    // \b в JavaScript не работает с русскими буквами, поэтому границы слова — через (^|\s)
    rest = rest.replace(/(^|\s)(сегодня|послезавтра|завтра)(?=\s|$)/, (m, sp, w) => { const d = new Date(); d.setDate(d.getDate() + day[w]); due = d.toLocaleDateString('sv'); return sp; });
    rest = rest.replace(/(^|\s)в\s(\d{1,2})(?:[:.](\d{2}))?(?:\s*час\S*)?(?=\s|$)/, (m, sp, h, mm) => { time = pad(+h) + ':' + (mm || '00'); return sp; });
    rest = rest.replace(/\s+/g, ' ').trim();
    if (rest) return [{ type: 'task', title: rest.charAt(0).toUpperCase() + rest.slice(1), due, time }];
  }
  const num = t.match(/(\d+(?:\s\d{3})*(?:[.,]\d+)?)(?:\s*(?:₽|руб\S*|р)(?=\s|$))?/);
  if (num && /потрат|заплат|минус|расход|купил|отдал|доход|получил|зарплат|плюс|пришл/.test(t)) {
    const amount = parseFloat(num[1].replace(/\s/g, '').replace(',', '.'));
    const kind = /доход|получил|зарплат|плюс|пришл/.test(t) ? 'income' : 'expense';
    const cat = S.cats.filter(c => c.kind === kind).find(c => t.includes(vnorm(c.name)));
    const note = (' ' + t.replace(num[0], ' ') + ' ').replace(/\s(?=\S)/g, '  ')
      .replace(/\s(я|мы|потратил\S*|заплатил\S*|отдал\S*|минус|расход|доход|получил\S*|плюс|рублей|руб|на|за|в)(?=\s)/g, ' ').replace(/\s+/g, ' ').trim();
    return [{ type: kind, amount, category: cat ? cat.name : '', note: cat && vnorm(note) === vnorm(cat.name) ? '' : note }];
  }
  return [];
}

// выполнить действия; возвращает строки для показа и функции отмены
async function voiceRun(actions) {
  const done = [];
  for (const a of actions) {
    try {
      if (a.type === 'expense' || a.type === 'income') {
        const cat = vfind(S.cats.filter(c => c.kind === a.type), a.category);
        const row = { id: crypto.randomUUID(), household_id: S.household.id, kind: a.type, amount: a.amount, category_id: cat ? cat.id : null, shared: true, note: a.note || null, date: a.date };
        const { error } = await sb.from('transactions').insert(row);
        if (error) { done.push({ text: 'Не записалось: ' + error.message, bad: true }); continue; }
        done.push({ text: (a.type === 'income' ? 'Доход ' : 'Расход ') + fmt(a.amount) + (cat ? ' · ' + cat.name : '') + (a.note ? ' · ' + a.note : '') + (a.date !== today() ? ' · ' + dayLabel(a.date) : ''),
          undo: () => sb.from('transactions').delete().eq('id', row.id) });
      } else if (a.type === 'shop') {
        const { data, error } = await sb.from('shopping_items').insert({ household_id: S.household.id, title: a.title, qty: a.qty }).select().single();
        if (error) { done.push({ text: 'Не добавилось «' + a.title + '»: ' + error.message, bad: true }); continue; }
        done.push({ text: 'В список покупок: ' + a.title + (a.qty ? ' (' + a.qty + ')' : ''), undo: () => sb.from('shopping_items').delete().eq('id', data.id) });
      } else if (a.type === 'bought') {
        const x = vfind(S.shop.filter(i => !i.done), a.title, 'title');
        if (!x) { done.push({ text: 'В списке покупок нет «' + a.title + '»', bad: true }); continue; }
        const { error } = await sb.from('shopping_items').update({ done: true, done_at: new Date().toISOString() }).eq('id', x.id);
        if (error) { done.push({ text: 'Не отметилось: ' + error.message, bad: true }); continue; }
        x.done = true;
        done.push({ text: 'Куплено: ' + x.title, undo: () => sb.from('shopping_items').update({ done: false, done_at: null }).eq('id', x.id) });
      } else if (a.type === 'task') {
        const assignee = a.who === 'me' ? S.user.id : a.who === 'other' && partner() ? partner().user_id : null;
        const row = { household_id: S.household.id, title: a.title, due: a.due, due_time: a.time, assignee };
        if (a.repeat) row.repeat = a.repeat;
        const { data, error } = await sb.from('tasks').insert(row).select().single();
        if (error) { done.push({ text: 'Дело не создалось: ' + error.message, bad: true }); continue; }
        done.push({ text: 'Дело: ' + a.title + (a.due ? ' · ' + dayLabel(a.due) : '') + (a.time ? ' в ' + a.time : '') + (assignee ? ' · ' + nameOf(assignee) : '') + (a.repeat ? ' · ' + REPEAT[a.repeat].toLowerCase() : ''),
          undo: () => sb.from('tasks').delete().eq('id', data.id) });
      } else if (a.type === 'task_done') {
        const x = vfind(S.tasks.filter(i => !i.done), a.title, 'title');
        if (!x) { done.push({ text: 'Нет такого дела: «' + a.title + '»', bad: true }); continue; }
        await toggleTask(x.id);
        done.push({ text: 'Сделано: ' + x.title, undo: () => sb.from('tasks').update({ done: false, done_at: null }).eq('id', x.id) });
      }
    } catch (e) { done.push({ text: 'Ошибка: ' + (e.message || e), bad: true }); }
  }
  return done;
}

      ${(m.done || []).length ? `<div class="vacts">${m.done.map(d => `<div class="vact${d.bad ? ' bad' : ''}${d.off ? ' off' : ''}"><i>${d.bad ? '!' : '✓'}</i><span>${esc(d.text)}</span></div>`).join('')}</div>` : ''}
      ${m.sources && m.sources.length ? `<div class="vsrc">Источники: ${m.sources.map(s => `<a href="${esc(s.uri)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(' · ')}</div>` : ''}

}

// траты по месяцам за год и крупные покупки: для вопросов «сравни», «где сэкономить» (загружаем раз на обновление данных)
async function yearStats() {
  if (S.yearStats && S.yearStats.ver === S.dataVer) return S.yearStats.data;
  const d = new Date(), from = new Date(d.getFullYear() - 1, d.getMonth() + 1, 1).toLocaleDateString('sv');
  const { data, error } = await sb.from('transactions').select('date,kind,amount,category_id,excluded,note').gte('date', from).order('date', { ascending: false }).limit(5000);
  if (error || !Array.isArray(data)) return null;
  const cname = id => (S.cats.find(c => c.id === id) || {}).name || 'Без категории';
  const months = {};
  const list = data.filter(t => !t.excluded);
  list.forEach(t => {
    const m = String(t.date).slice(0, 7), o = months[m] || (months[m] = { 'Расход': 0, 'Доход': 0, 'По категориям': {} });
    if (t.kind === 'income') o['Доход'] += +t.amount;
    else { o['Расход'] += +t.amount; const n = cname(t.category_id); o['По категориям'][n] = (o['По категориям'][n] || 0) + +t.amount; }
  });
  Object.values(months).forEach(o => { o['Расход'] = Math.round(o['Расход']); o['Доход'] = Math.round(o['Доход']); Object.keys(o['По категориям']).forEach(k => o['По категориям'][k] = Math.round(o['По категориям'][k])); });
  const top = list.filter(t => t.kind === 'expense').sort((a, b) => b.amount - a.amount).slice(0, 25)
    .map(t => [t.date, Math.round(+t.amount), cname(t.category_id), t.note || ''].join(' ').trim());
  const out = { months, top };
  S.yearStats = { ver: S.dataVer, data: out };
  return out;
}

const vstatus = t => { const el = $('#vst'); if (el) el.textContent = t; };

async function startRec() {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { return vstatus('Нет доступа к микрофону. Разрешите его для этого приложения в настройках телефона или напишите текстом.'); }
  const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
  const mr = type ? new MediaRecorder(stream, { mimeType: type }) : new MediaRecorder(stream);
  rec = { mr, stream, chunks: [], t0: Date.now(), cancel: false };
  mr.ondataavailable = e => { if (e.data && e.data.size) rec && rec.chunks.push(e.data); };
  mr.onstop = () => {
    const r = rec; rec = null;
    r.stream.getTracks().forEach(t => t.stop());
    clearInterval(r.timer);
    if ($('#vrec')) $('#vrec').classList.remove('on');
    if ($('#cbar')) $('#cbar').classList.remove('rec');
    if (r.cancel) return;
    if (Date.now() - r.t0 < 700) return vstatus('Слишком коротко. Нажмите и скажите ещё раз.');
    const blob = new Blob(r.chunks, { type: mr.mimeType || type || 'audio/webm' });
    const fr = new FileReader();
    fr.onload = () => voiceSend({ audio: String(fr.result).split(',')[1], mime: blob.type });
    fr.readAsDataURL(blob);
  };
  mr.start();
  sound('tap');
  if ($('#vrec')) $('#vrec').classList.add('on');
  if ($('#cbar')) $('#cbar').classList.add('rec');      // вместо поля ввода — «Слушаю… 0:05»
  vstatus('');
  rec.timer = setInterval(() => {
    const s = Math.round((Date.now() - (rec ? rec.t0 : Date.now())) / 1000);
    if ($('#vrt')) $('#vrt').textContent = 'Слушаю… ' + Math.floor(s / 60) + ':' + pad(s % 60) + ' — нажмите, чтобы отправить';
    if (s >= 45) stopRec(false);
  }, 250);
}
function stopRec(cancel) {
  if (!rec) return;
  rec.cancel = cancel;
  try { rec.mr.stop(); } catch (e) { rec.stream.getTracks().forEach(t => t.stop()); rec = null; }
}

async function voiceSend(payload) {
  if (S.voiceBusy) return;
  if (!S.chat) chatLoad();
  S.voiceBusy = true;
  vstatus('');
  if ($('#vgo')) $('#vgo').disabled = true;
  chatInput();
  const history = chatHistory();
  const uid = 'u' + Date.now(), aid = 'a' + Date.now();
  const user = { id: uid, role: 'user', text: payload.text || '🎤 Голосовое сообщение' };
  const ai = { id: aid, role: 'model', text: '', pending: true };
  S.chat.push(user, ai); chatDraw();

  let res = null, why = '';
  try {
    const ctx = voiceCtx();
    const ys = isRel() ? null : await yearStats().catch(() => null);
    if (ys) { ctx['Помесячно за год'] = ys.months; ctx['Крупные траты за год'] = ys.top; }
    const { data, error } = await sb.functions.invoke(VOICE_FN, { body: { ...payload, history, ctx } });
    if (error) why = await voiceErr(error); else res = data;
  } catch (e) { why = 'Помощник не ответил. Попробуйте ещё раз.'; }
  // помощник недоступен, но есть текст: простые команды разбираем сами
  if (!res && payload.text && !isRel()) {
    const local = voiceLocal(payload.text);
    if (local.length) res = { transcript: payload.text, actions: local, reply: 'Помощник сейчас недоступен (' + why.replace(/\.$/, '').toLowerCase() + '), но эту команду я понял сам.', local: true };
  }
  ai.pending = false;
  if (!res) { ai.text = why; ai.bad = true; }
  else {
    if (!payload.text && res.transcript) user.text = '🎤 ' + res.transcript;
    const actions = isRel() ? [] : voiceClean(res.actions);
    const done = actions.length ? await voiceRun(actions) : [];
    ai.text = res.reply || (done.length ? '' : 'Не понял. Скажите или напишите по-другому.');
    ai.done = done.map(d => ({ text: d.text, bad: !!d.bad }));
    ai.sources = Array.isArray(res.sources) ? res.sources.slice(0, 4) : [];
    const undo = done.filter(d => d.undo).map(d => d.undo);
    if (undo.length) S.chatUndo[aid] = undo;
    if (done.some(d => !d.bad)) { sound('success'); refresh(); }
  }
  S.voiceBusy = false;
  if ($('#vgo')) $('#vgo').disabled = false;
  chatSave(); chatDraw(); chatInput();
}

// ---------- push-уведомления ----------
// Открытый ключ VAPID (публичный по задумке); закрытый хранится только в настройках функции Supabase.
const VAPID_PUBLIC = 'BASoEomq14ksbLLYUwZzoYW6kllJlpPEPvUhWqUzb3ZwusgT3QtAr8AyvT8x_Mfi7gmY8neV9t8FtYB7IlsQNYQ';
const PUSH_FN = 'push-digest';
const pushSupported = () => typeof navigator.serviceWorker === 'object' && typeof window.PushManager === 'function' && typeof window.Notification === 'function';
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent || '');
const standalone = () => !!((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone);
const b64u = s => Uint8Array.from(atob((s + '==='.slice((s.length + 3) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

// состояние на этом телефоне: unsupported, home (iPhone без значка на экране «Домой»), denied, on, off
async function pushState() {
  if (!pushSupported()) return isIOS() && !standalone() ? 'home' : 'unsupported';
  if (Notification.permission === 'denied') return 'denied';
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    return sub && Notification.permission === 'granted' ? 'on' : 'off';
  } catch (e) { return 'off'; }
}

async function hydratePush() {
  const box = $('#pushbox');
  if (!box) return;
  const st = await pushState();

  const msg = {

    home: 'На iPhone уведомления работают, только если приложение добавлено на экран «Домой» (Поделиться → На экран «Домой») и открыто оттуда. Нужна iOS 16.4 или новее.',
    denied: 'Уведомления запрещены в настройках телефона. Разрешите их для этого приложения и откройте его снова.',
    on: 'Включены на этом телефоне.',

    ${st === 'off' ? '<button class="full" id="pon">Включить на этом телефоне</button>' : ''}
    ${st === 'on' ? '<button class="ghost full" id="ptest">Прислать проверочное</button><button class="link full" id="poff">Выключить</button>' : ''}
    <div class="mute" id="pmsg"></div>`;
  if ($('#pon')) $('#pon').onclick = enablePush;
  if ($('#ptest')) $('#ptest').onclick = testPush;
  if ($('#poff')) $('#poff').onclick = disablePush;
}
const pushMsg = t => { const m = $('#pmsg'); if (m) m.textContent = t; };

async function enablePush() {
  try {
    if (await Notification.requestPermission() !== 'granted') { pushMsg('Без разрешения уведомления не придут.'); return hydratePush(); }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription()
      || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUBLIC) });
    const j = sub.toJSON();
    const { error } = await sb.from('push_subscriptions')
      .upsert({ household_id: S.household ? S.household.id : S.me.household_id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
    if (error) {
      await sub.unsubscribe().catch(() => {});
      return pushMsg(/push_subscriptions|relation|schema cache/i.test(error.message) ? 'Сначала выполните update-13.sql в Supabase' : error.message);
    }
    sound('success');
    await hydratePush();
    pushMsg('Готово. Нажмите «Прислать проверочное», чтобы убедиться, что всё работает.');
  } catch (e) { pushMsg('Не получилось включить: ' + (e.message || e)); }
}

async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
      await sub.unsubscribe();
    }
  } catch (e) {}
  hydratePush();
}

// понятная причина ошибки функции: код ответа и текст, который она вернула (шаги — из НАСТРОЙКА-УВЕДОМЛЕНИЙ.md)
async function pushErrorText(error) {
  const res = error && error.context;
  let status = 0, text = '';
  if (res && typeof res.status === 'number') {
    status = res.status;
    try { const b = await res.clone().json(); text = b.error || b.message || b.msg || JSON.stringify(b); }
    catch (e) { try { text = await res.text(); } catch (e2) {} }
  }
  if (status === 404) return 'Функция push-digest не найдена. Проверьте, что она установлена и называется ровно push-digest (шаг 2).';
  if (status === 401 && !/нужен вход/.test(text)) return 'У функции включена проверка JWT. Выключите Verify JWT в её настройках (шаг 2, пункт 4). (' + (text || 'код 401') + ')';
  if (status === 401) return 'Сервер не узнал вход. Выйдите из приложения и войдите снова.';
  if (status) return 'Ошибка функции (код ' + status + '): ' + (text || 'без пояснения') + '. Шаги 2–3 инструкции.';
  return 'Сервер уведомлений не ответил. Проверьте, что функция push-digest установлена по инструкции. (' + ((error && error.message) || 'нет ответа') + ')';
}

// ---------- сверка с банком ----------
// В уведомлении банка есть остаток после операции. Между двумя соседними уведомлениями остаток должен
// измениться ровно на сумму второй операции. Если не сходится, какое-то уведомление не дошло.
function parseBalance(text) {
  // число: «12345» или разряды по три цифры «12 345», чтобы номер карты «*1234 5 000 ₽» не слился с суммой
  const m = String(text || '').match(/(?:доступно|остаток|баланс)[^\d−-]{0,25}([−-])?\s*((?:\d{1,3}(?:[   ]\d{3})+|\d+)(?:[.,]\d{1,2})?)\s*(?:₽|руб|р\.)/i);
  if (!m) return null;
  const v = parseFloat(m[2].replace(/[\s  ]/g, '').replace(',', '.'));
  return isFinite(v) ? (m[1] ? -v : v) : null;
}
function bankChain() {
  return S.bank.map(r => ({ r, bal: parseBalance(r.raw_text) })).filter(x => x.bal !== null);
}
function bankGaps() {
  const rows = bankChain(), out = [];
  for (let i = 1; i < rows.length; i++) {
    const a = rows[i - 1], b = rows[i];
    if (b.r.gap_ok || !b.r.parsed_kind || !(+b.r.parsed_amount > 0)) continue;   // разобрано или сумма неизвестна
    const signed = (b.r.parsed_kind === 'income' ? 1 : -1) * +b.r.parsed_amount;
    const diff = Math.round((b.bal - a.bal - signed) * 100) / 100;
    if (Math.abs(diff) >= 1) out.push({ id: b.r.id, from: a.r.received_at, to: b.r.received_at, diff, before: a.bal, after: b.bal });
  }
  return out.reverse();                                   // сначала свежие
}
const gapText = g => (g.diff > 0 ? 'Не хватает дохода ' : 'Не хватает расхода ') + fmt(Math.abs(g.diff));

function renderGapCard() {
  if (!S.bankReady) return '';
  const gaps = bankGaps();
  if (!gaps.length) return '';
  return `<div class="card"><b>Сверка с банком</b>
    <div class="mute">Остаток в банке изменился не так, как операции в приложении. Похоже, уведомление не дошло.</div>
    ${gaps.slice(0, 3).map(g => `<div class="pi" data-gap="${g.id}"><div><div class="txt-warn">${gapText(g)}</div>
      <div class="mute">между ${esc(fmtWhen(g.from))} и ${esc(fmtWhen(g.to))}</div></div><div class="mute">›</div></div>`).join('')}
    ${gaps.length > 3 ? `<div class="mute">И ещё расхождений: ${gaps.length - 3}</div>` : ''}</div>`;
}

function bankSummary() {
  if (!S.bankReady) return '';
  const rows = bankChain();
  if (!rows.length) return '<div class="mute" style="margin-top:8px">Сверка с банком: в уведомлениях пока нет остатка по счёту.</div>';
  const last = rows[rows.length - 1], n = bankGaps().length;
  return `<div class="mute" style="margin-top:8px">Сверка с банком: остаток ${fmt(last.bal)} на ${esc(fmtWhen(last.r.received_at))}. ${n ? 'Расхождений: ' + n + ', они на главном экране.' : 'Всё сходится.'}</div>`;
}

async function markGap(id) {
  const { data, error } = await sb.from('bank_inbox').update({ gap_ok: true }).eq('id', id).select('id');
  if (error) throw new Error(/gap_ok|column|schema cache/i.test(error.message) ? 'Сначала выполните update-10.sql в Supabase' : error.message);
  if (!data || !data.length) throw new Error('Не удалось сохранить отметку');
}

function openGap(id) {
  const g = bankGaps().find(x => x.id === id);
  if (!g) return;
  sheet(`<b>Сверка с банком</b>
    <div class="big txt-warn">${gapText(g)}</div>
    <p class="mute">Остаток был ${fmt(g.before)} (${esc(fmtWhen(g.from))}), стал ${fmt(g.after)} (${esc(fmtWhen(g.to))}).
      Операции из уведомлений объясняют не всё: разница ${fmt(Math.abs(g.diff))}. Скорее всего, уведомление о ${g.diff > 0 ? 'поступлении' : 'списании'} не дошло.
      Если пропущенных операций несколько, внесите их по одной.</p>
    <div class="err" id="err"></div>
    <button class="full" id="ga">Внести пропущенную операцию</button>
    <button class="ghost full" id="gok">Это не пропуск, скрыть</button>
    <button class="link full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  $('#gok').onclick = async () => {
    try { await markGap(id); closeSheet(); refresh(); } catch (e) { $('#err').textContent = e.message; }
  };
  $('#ga').onclick = () => openAdd({
    title: 'Пропущенная операция', kind: g.diff > 0 ? 'income' : 'expense', amount: Math.abs(g.diff),
    date: new Date(g.to).toLocaleDateString('sv'), note: 'Внесено по сверке с банком',
    onSaved: async () => { try { await markGap(id); } catch (e) { toast(e.message, 5000); } }
  });
}


// ---------- звук и отклик на нажатия ----------
// Звуки синтезируются на лету: без файлов и внешних серверов. Настройка своя на каждом телефоне.
const soundOn = () => lsGet('fb_sound') !== false;
let audio = null;
function tone(from, to, dur, gain, type = 'sine', delay = 0) {
  const t0 = audio.currentTime + delay;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(from, t0);
  o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audio.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const SOUNDS = {
  tap: () => tone(620, 420, 0.05, 0.05, 'triangle'),
  tab: () => tone(520, 780, 0.07, 0.06),
  nav: () => tone(440, 660, 0.09, 0.06),
  add: () => tone(300, 700, 0.11, 0.08),
  danger: () => tone(300, 180, 0.12, 0.06, 'triangle'),
  open: () => tone(280, 520, 0.13, 0.03),
  close: () => tone(520, 280, 0.11, 0.03),
  success: () => [523, 659, 784].forEach((f, i) => tone(f, f, 0.16, 0.06, 'sine', i * 0.07))
};
function sound(name) {
  if (!soundOn()) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  try {
    audio = audio || new Ctx();
    if (audio.state !== 'running') audio.resume();
    SOUNDS[name]();
  } catch (e) {}
}

const TAP_ROWS = '.tx,.pi[data-p],.pi[data-s],.pi[data-ib],.pi[data-r],.recur,.cat[data-c],.goal,.ph,[data-st],[data-gap],.task,.meal,[data-rcp]';
function soundFor(el) {
  if (el.matches('.seg button,.monthbar button,.mcol')) return 'tab';
  if (el.matches('.tile,#bk,#gear')) return 'nav';
  if (el.matches('.fab')) return 'add';
  if (el.matches('#dl,#vd')) return 'danger';
  return 'tap';
}
function ripple(btn, e) {
  if (!calm() || btn.matches('.mcol')) return;
  const b = btn.getBoundingClientRect(), size = Math.max(b.width, b.height) * 2;
  const x = e.clientX ? e.clientX - b.left : b.width / 2, y = e.clientY ? e.clientY - b.top : b.height / 2;
  const r = document.createElement('span');
  r.className = 'rip';
  r.style.cssText = `width:${size}px;height:${size}px;left:${x - size / 2}px;top:${y - size / 2}px`;
  btn.appendChild(r);
  setTimeout(() => r.remove(), 550);
}
// только click: при прокрутке списка пальцем нажатие не срабатывает
document.addEventListener('click', e => {
  const t = e.target;
  if (!t || !t.closest) return;
  const btn = t.closest('button');
  if (btn) { sound(soundFor(btn)); ripple(btn, e); }
  else if (t.closest(TAP_ROWS)) sound('tap');
}, true);
document.addEventListener('touchstart', () => {}, { passive: true });   // без этого iPhone не показывает нажатое состояние


// ---------- запуск ----------
function storedUser() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (/^sb-.*-auth-token$/.test(k)) { const v = JSON.parse(localStorage.getItem(k)); return (v && (v.user || (v.currentSession && v.currentSession.user))) || null; }
    }
  } catch (e) {}
  return null;
}

(async function init() {
  try { history.replaceState(null, ''); } catch (e) {}
  if (SUPABASE_URL.startsWith('ВСТАВЬТЕ')) {
    $('#app').innerHTML = '<div class="wrap"><div class="card"><b>Не настроено</b><p>Откройте index.html и вставьте SUPABASE_URL и SUPABASE_KEY.</p></div></div>';
    return;
  }
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'SIGNED_OUT') { S.user = null; S.me = null; renderAuth(); }
    else if (session && (!S.user || S.user.id !== session.user.id)) { S.user = session.user; load(); }
  });
  if (typeof navigator.serviceWorker === 'object' && /^https?:$/.test(location.protocol)) {
    // обновления: телефон проверяет новую версию при каждом открытии и сам перезагружает приложение,
    // когда она пришла (если человек ничего не набирает и не смотрит фото — иначе при следующем открытии)
    const hadSw = !!navigator.serviceWorker.controller;
    let reloadDue = false;
    const calmNow = () => !document.getElementById('sh') && !viewerOpen && !(document.getElementById('ftx') && document.getElementById('ftx').value) && !(document.getElementById('vtx') && document.getElementById('vtx').value);
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        if (reloadDue && calmNow()) return location.reload();
        reg.update().catch(() => {});
      });
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadSw) return;                       // первая установка, а не обновление
      if (calmNow()) location.reload(); else reloadDue = true;
    });
  }
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    // нет сети и просрочен вход: открываем сохранённые данные, вход обновится сам, когда сеть появится
    const snap = lsGet('fb_snap'), user = storedUser();
    if (snap && user && snap.uid === user.id && navigator.onLine === false) {
      S.user = user; applySnap(snap); S.offline = true; S.tx = mergePending(S.tx);
      S.booted = true; subscribe(); return render();
    }
    renderAuth();
  }
})();
</script>
