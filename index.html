<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Семья">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Семейный бюджет</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#17201e;--mute:#6b7773;--line:#e3e8e6;--brand:#0f766e;--brand-ink:#fff;--bad:#c2410c;--good:#15803d;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0e1413;--card:#172120;--ink:#e8efed;--mute:#8fa09b;--line:#263230;--brand:#2dd4bf;--brand-ink:#04211e;--bad:#fb923c;--good:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px}
h1{font-size:20px;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.mute{color:var(--mute);font-size:14px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:6px 0}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.link{background:none;color:var(--brand);padding:6px;font-weight:500}
button.full{width:100%;margin-top:8px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.seg button{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:8px 12px;white-space:nowrap;font-weight:500}
.seg button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.monthbar{display:flex;align-items:center;justify-content:space-between}
.monthbar b{text-transform:capitalize}
.monthbar button{padding:8px 14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:17px}
.day{font-size:13px;color:var(--mute);margin:14px 2px 4px;text-transform:uppercase;letter-spacing:.04em}
.tx{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx .amt{font-weight:600;white-space:nowrap}
.amt.inc{color:var(--good)}
.badge{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);margin-left:4px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.cat{padding:12px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border:0}
.row{display:flex;justify-content:space-between;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:14px 4px;font-weight:500}
nav button.on{color:var(--brand)}
.fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:30px;line-height:1;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.big{font-size:28px;font-weight:700}
.err{color:var(--bad);font-size:14px;min-height:20px}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== НАСТРОЙКА: вставьте данные вашего проекта Supabase ======
const SUPABASE_URL = 'https://ykyxcsuuflwavetdeodi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0LkdL2668ZJFuKinRxJJUw_PMGEi1Co';
// ================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 0}).format(Math.round(n)) + ' ₽';
const pad = n => String(n).padStart(2, '0');
const today = () => new Date().toLocaleDateString('sv');

const S = { user: null, me: null, members: [], household: null, cats: [], tx: [],
            month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
            filter: 'all', tab: 'tx', booted: false };

function monthRange() {
  const y = S.month.getFullYear(), m = S.month.getMonth();
  const a = `${y}-${pad(m + 1)}-01`;
  const ny = m === 11 ? y + 1 : y, nm = m === 11 ? 1 : m + 2;
  return [a, `${ny}-${pad(nm)}-01`];
}
const monthLabel = () => S.month.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
const nameOf = id => (S.members.find(m => m.user_id === id) || {}).name || '—';
const partner = () => S.members.find(m => m.user_id !== S.user.id);

// ---------- загрузка ----------
async function load() {
  const { data: ms, error } = await sb.from('members').select('*');
  if (error) return fail(error);
  S.members = ms || [];
  S.me = S.members.find(m => m.user_id === S.user.id);
  if (!S.me) return renderOnboarding();
  const { data: h } = await sb.from('households').select('*').limit(1).single();
  S.household = h;
  await refresh();
  if (!S.booted) { S.booted = true; subscribe(); }
}

async function refresh() {
  const [from, to] = monthRange();
  const [c, t] = await Promise.all([
    sb.from('categories').select('*').order('name'),
    sb.from('transactions').select('*').gte('date', from).lt('date', to)
      .order('date', { ascending: false }).order('created_at', { ascending: false })
  ]);
  if (c.error || t.error) return fail(c.error || t.error);
  S.cats = c.data; S.tx = t.data;
  render();
}

function subscribe() {
  sb.channel('household-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, () => refresh())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, () => refresh())
    .subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) refresh(); });
}

function fail(e) {
  $('#app').innerHTML = `<div class="wrap"><div class="card"><b>Ошибка</b><p class="err">${esc(e.message || e)}</p>
    <button class="full" onclick="location.reload()">Обновить</button></div></div>`;
}

// ---------- вход ----------
function renderAuth(mode = 'in', msg = '') {
  $('#app').innerHTML = `<div class="wrap"><h1>Семейный бюджет</h1>
  <div class="card">
    <b>${mode === 'in' ? 'Вход' : 'Регистрация'}</b>
    <input id="em" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="Пароль (минимум 6 символов)" autocomplete="${mode === 'in' ? 'current-password' : 'new-password'}">
    <div class="err" id="err">${esc(msg)}</div>
    <button class="full" id="go">${mode === 'in' ? 'Войти' : 'Создать аккаунт'}</button>
    <button class="link full" id="sw">${mode === 'in' ? 'Нет аккаунта? Регистрация' : 'Уже есть аккаунт? Войти'}</button>
  </div></div>`;
  $('#sw').onclick = () => renderAuth(mode === 'in' ? 'up' : 'in');
  $('#go').onclick = async () => {
    const email = $('#em').value.trim(), password = $('#pw').value;
    const fn = mode === 'in' ? sb.auth.signInWithPassword.bind(sb.auth) : sb.auth.signUp.bind(sb.auth);
    const { data, error } = await fn({ email, password });
    if (error) { $('#err').textContent = error.message; return; }
    if (mode === 'up' && !data.session) { renderAuth('in', 'Аккаунт создан. Подтвердите email по письму и войдите.'); }
  };
}

function renderOnboarding() {
  $('#app').innerHTML = `<div class="wrap"><h1>Настройка семьи</h1>
  <div class="card"><b>Я первый — создаю семью</b>
    <input id="n1" placeholder="Ваше имя (например, Вадим)">
    <input id="hn" placeholder="Название семьи" value="Наша семья">
    <button class="full" id="mk">Создать</button></div>
  <div class="card"><b>Меня пригласили</b>
    <input id="n2" placeholder="Ваше имя">
    <input id="cd" placeholder="Код приглашения">
    <button class="full" id="jn">Присоединиться</button></div>
  <div class="err" id="err"></div>
  <button class="link" id="lo">Выйти</button></div>`;
  $('#lo').onclick = () => sb.auth.signOut();
  $('#mk').onclick = async () => {
    const uname = $('#n1').value.trim(); if (!uname) return $('#err').textContent = 'Введите имя';
    const { error } = await sb.rpc('create_household', { hname: $('#hn').value.trim() || 'Семья', uname });
    if (error) return $('#err').textContent = error.message;
    S.tab = 'more'; load();
  };
  $('#jn').onclick = async () => {
    const uname = $('#n2').value.trim(), code = $('#cd').value.trim();
    if (!uname || !code) return $('#err').textContent = 'Введите имя и код';
    const { error } = await sb.rpc('join_household', { code, uname });
    if (error) return $('#err').textContent = error.message === 'bad code' ? 'Неверный код' : error.message;
    load();
  };
}

// ---------- главный экран ----------
function visibleTx() {
  const me = S.user.id, p = partner();
  return S.tx.filter(t =>
    S.filter === 'all' ? true :
    S.filter === 'shared' ? t.shared :
    S.filter === 'mine' ? (!t.shared && t.user_id === me) :
    (!t.shared && p && t.user_id === p.user_id));
}

function render() {
  const nav = `<nav>
    <button data-t="tx" class="${S.tab === 'tx' ? 'on' : ''}">Операции</button>
    <button data-t="lim" class="${S.tab === 'lim' ? 'on' : ''}">Лимиты</button>
    <button data-t="more" class="${S.tab === 'more' ? 'on' : ''}">Ещё</button></nav>`;
  const head = `<div class="monthbar"><button class="ghost" id="pm">‹</button><b>${esc(monthLabel())}</b><button class="ghost" id="nm">›</button></div>`;
  let body = '';
  if (S.tab === 'tx') body = head + renderTx();
  else if (S.tab === 'lim') body = head + renderLimits();
  else body = renderMore();
  $('#app').innerHTML = `<div class="wrap">${body}</div>${nav}${S.tab === 'more' ? '' : '<button class="fab" id="add">+</button>'}`;
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); });
  if ($('#pm')) { $('#pm').onclick = () => shiftMonth(-1); $('#nm').onclick = () => shiftMonth(1); }
  if ($('#add')) $('#add').onclick = () => openAdd();
  bindTab();
}

function shiftMonth(d) { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + d, 1); refresh(); }

function renderTx() {
  const p = partner();
  const seg = [['all', 'Все'], ['shared', 'Общие'], ['mine', 'Мои'], ['other', p ? p.name : 'Партнёр']]
    .map(([k, l]) => `<button data-f="${k}" class="${S.filter === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  const list = visibleTx();
  const inc = list.filter(t => t.kind === 'income').reduce((s, t) => s + +t.amount, 0);
  const exp = list.filter(t => t.kind === 'expense').reduce((s, t) => s + +t.amount, 0);
  let rows = '', last = '';
  for (const t of list) {
    if (t.date !== last) {
      last = t.date;
      rows += `<div class="day">${new Date(t.date + 'T00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' })}</div>`;
    }
    const cat = S.cats.find(c => c.id === t.category_id);
    rows += `<div class="tx" data-id="${t.id}"><div>
      <div>${esc(cat ? cat.name : 'Без категории')}${t.shared ? '' : '<span class="badge">личное</span>'}</div>
      <div class="mute">${esc(nameOf(t.user_id))}${t.note ? ' · ' + esc(t.note) : ''}</div></div>
      <div class="amt ${t.kind === 'income' ? 'inc' : ''}">${t.kind === 'income' ? '+' : '−'}${fmt(+t.amount)}</div></div>`;
  }
  return `<div class="seg">${seg}</div>
  <div class="card sum"><div><span class="mute">Доход</span><b style="color:var(--good)">${fmt(inc)}</b></div>
  <div><span class="mute">Расход</span><b>${fmt(exp)}</b></div>
  <div><span class="mute">Баланс</span><b>${fmt(inc - exp)}</b></div></div>
  <div class="card">${rows || '<div class="empty">Операций нет.<br>Нажмите + чтобы добавить.</div>'}</div>`;
}

function renderLimits() {
  const spent = {};
  S.tx.filter(t => t.kind === 'expense').forEach(t => spent[t.category_id] = (spent[t.category_id] || 0) + +t.amount);
  const cats = S.cats.filter(c => c.kind === 'expense');
  const total = cats.reduce((s, c) => s + +c.monthly_limit, 0);
  const totalSpent = Object.values(spent).reduce((a, b) => a + b, 0);
  const rows = cats.map(c => {
    const s = spent[c.id] || 0, l = +c.monthly_limit, pc = l ? Math.min(100, s / l * 100) : 0;
    const cls = l && s > l ? 'bad' : (l && s > l * .85 ? 'warn' : '');
    return `<div class="cat" data-c="${c.id}"><div class="row"><span>${esc(c.name)}</span>
      <span class="mute">${fmt(s)}${l ? ' из ' + fmt(l) : ' · лимит не задан'}</span></div>
      ${l ? `<div class="bar"><i class="${cls}" style="width:${pc}%"></i></div>
      <div class="mute" style="margin-top:4px">${s > l ? 'Превышение ' + fmt(s - l) : 'Осталось ' + fmt(l - s)}</div>` : ''}</div>`;
  }).join('');
  return `<div class="card"><div class="mute">Расходы за месяц / общий лимит</div>
    <div class="big">${fmt(totalSpent)}${total ? ` <span class="mute" style="font-size:16px">из ${fmt(total)}</span>` : ''}</div></div>
    <div class="card">${rows}</div>
    <div class="mute" style="padding:0 4px">Нажмите на категорию, чтобы задать лимит на месяц.</div>
    <button class="ghost full" id="ac">+ Новая категория</button>`;
}

function renderMore() {
  return `<h1>Ещё</h1>
  <div class="card"><div class="mute">Вы</div><b>${esc(S.me.name)}</b> <span class="mute">· ${esc(S.user.email)}</span></div>
  <div class="card"><div class="mute">Семья «${esc(S.household.name)}»</div>
    <div>${S.members.map(m => esc(m.name)).join(', ')}</div>
    ${S.members.length < 2 ? `<p>Код приглашения для второго участника:</p><div class="big" style="letter-spacing:.1em">${esc(S.household.invite_code)}</div>
    <div class="mute">Пусть партнёр зарегистрируется в приложении и выберет «Меня пригласили».</div>` : ''}</div>
  <button class="ghost full" id="lo">Выйти</button>`;
}

function bindTab() {
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { S.filter = b.dataset.f; render(); });
  document.querySelectorAll('.tx').forEach(el => el.onclick = () => openTx(el.dataset.id));
  document.querySelectorAll('.cat').forEach(el => el.onclick = () => editLimit(el.dataset.c));
  if ($('#ac')) $('#ac').onclick = addCategory;
  if ($('#lo')) $('#lo').onclick = () => { S.booted = false; sb.auth.signOut(); };
}

// ---------- добавление операции ----------
function sheet(html) {
  closeSheet();
  const d = document.createElement('div');
  d.className = 'sheet-bg'; d.id = 'sh';
  d.innerHTML = `<div class="sheet">${html}</div>`;
  d.onclick = e => { if (e.target === d) closeSheet(); };
  document.body.appendChild(d);
}
const closeSheet = () => { const s = $('#sh'); if (s) s.remove(); };

function openAdd() {
  let kind = 'expense', shared = true;
  const catOpts = k => S.cats.filter(c => c.kind === k).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  sheet(`<div class="seg" id="kd"><button data-k="expense" class="on">Расход</button><button data-k="income">Доход</button></div>
    <input id="am" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма, ₽" style="font-size:24px">
    <select id="ct">${catOpts('expense')}</select>
    <input id="nt" placeholder="Заметка (необязательно)">
    <input id="dt" type="date" value="${today()}">
    <div class="seg" id="sc"><button data-s="1" class="on">Общий</button><button data-s="0">Личный</button></div>
    <div class="err" id="err"></div>
    <button class="full" id="sv">Сохранить</button>`);
  $('#am').focus();
  document.querySelectorAll('#kd button').forEach(b => b.onclick = () => {
    kind = b.dataset.k;
    document.querySelectorAll('#kd button').forEach(x => x.classList.toggle('on', x === b));
    $('#ct').innerHTML = catOpts(kind);
  });
  document.querySelectorAll('#sc button').forEach(b => b.onclick = () => {
    shared = b.dataset.s === '1';
    document.querySelectorAll('#sc button').forEach(x => x.classList.toggle('on', x === b));
  });
  $('#sv').onclick = async () => {
    const amount = parseFloat($('#am').value.replace(',', '.'));
    if (!(amount > 0)) return $('#err').textContent = 'Введите сумму';
    $('#sv').disabled = true;
    const { error } = await sb.from('transactions').insert({
      household_id: S.household.id, kind, amount, category_id: $('#ct').value || null,
      shared, note: $('#nt').value.trim() || null, date: $('#dt').value || today()
    });
    if (error) { $('#sv').disabled = false; return $('#err').textContent = error.message; }
    closeSheet(); refresh();
  };
}

function openTx(id) {
  const t = S.tx.find(x => x.id === id); if (!t) return;
  const cat = S.cats.find(c => c.id === t.category_id);
  const own = t.user_id === S.user.id;
  sheet(`<div class="big">${t.kind === 'income' ? '+' : '−'}${fmt(+t.amount)}</div>
    <p>${esc(cat ? cat.name : 'Без категории')} · ${esc(t.date)}<br><span class="mute">${esc(nameOf(t.user_id))}${t.shared ? ' · общий' : ' · личный'}${t.note ? ' · ' + esc(t.note) : ''}</span></p>
    ${own ? '<button class="full" id="dl" style="background:var(--bad);color:#fff">Удалить</button>' : '<div class="mute">Удалять может только автор записи.</div>'}
    <button class="ghost full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  if ($('#dl')) $('#dl').onclick = async () => {
    if (!confirm('Удалить операцию?')) return;
    const { error } = await sb.from('transactions').delete().eq('id', id);
    if (error) return alert(error.message);
    closeSheet(); refresh();
  };
}

async function editLimit(id) {
  const c = S.cats.find(x => x.id === id); if (!c) return;
  const v = prompt(`Лимит на месяц для «${c.name}», ₽ (0 — без лимита)`, c.monthly_limit || '');
  if (v === null) return;
  const n = parseFloat(String(v).replace(',', '.'));
  if (!(n >= 0)) return alert('Введите число');
  const { error } = await sb.from('categories').update({ monthly_limit: n }).eq('id', id);
  if (error) return alert(error.message);
  refresh();
}

async function addCategory() {
  const name = prompt('Название новой категории расходов');
  if (!name || !name.trim()) return;
  const { error } = await sb.from('categories').insert({ household_id: S.household.id, name: name.trim(), kind: 'expense' });
  if (error) return alert(error.message);
  refresh();
}

// ---------- запуск ----------
(async function init() {
  if (SUPABASE_URL.startsWith('ВСТАВЬТЕ')) {
    $('#app').innerHTML = '<div class="wrap"><div class="card"><b>Не настроено</b><p>Откройте index.html и вставьте SUPABASE_URL и SUPABASE_KEY.</p></div></div>';
    return;
  }
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'SIGNED_OUT') { S.user = null; S.me = null; renderAuth(); }
    else if (session && (!S.user || S.user.id !== session.user.id)) { S.user = session.user; load(); }
  });
  const { data } = await sb.auth.getSession();
  if (!data.session) renderAuth();
})();
</script>
</body>
</html>
