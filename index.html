<body>
<div id="app"></div>
<script src="supabase.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>
<script>
// ====== НАСТРОЙКА: вставьте данные вашего проекта Supabase ======
const DIRECT_URL = 'https://ykyxcsuuflwavetdeodi.supabase.co';
// На своём хостинге (не GitHub Pages) всё идёт через proxy.php на том же домене: так работает и там, где supabase.co закрыт.
const PROXY_MODE = /^https?:$/.test(location.protocol) && !/\.github\.io$/i.test(location.hostname);
const SUPABASE_URL = PROXY_MODE ? location.origin + location.pathname.replace(/[^/]*$/, '') + 'proxy.php' : DIRECT_URL;
const SUPABASE_KEY = 'sb_publishable_0LkdL2668ZJFuKinRxJJUw_PMGEi1Co';
// ================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 0}).format(Math.round(n)) + ' ₽';
const pad = n => String(n).padStart(2, '0');
const today = () => new Date().toLocaleDateString('sv');

const S = { user: null, me: null, members: [], household: null, cats: [], tx: [],
            month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
            filter: 'all', tab: 'home', booted: false,
            products: [], pantry: [], staples: [], stores: [], prices: [], foodReady: false, sub: 'stock',
            token: null, inbox: [], autoReady: false, carry: 0, carryReady: false,
            goals: [], deposits: [], goalsReady: false, limSub: 'cats',
            photos: [], photosReady: false, urls: {},
            rules: [], rulesReady: false, skipped: new Set(), offline: false,
            recur: [], recurReady: false, hist: null, histFor: 0, histKey: '', histErr: false, dataVer: 0 };

function monthRange() {
  const y = S.month.getFullYear(), m = S.month.getMonth();
  const a = `${y}-${pad(m + 1)}-01`;
  const ny = m === 11 ? y + 1 : y, nm = m === 11 ? 1 : m + 2;
  return [a, `${ny}-${pad(nm)}-01`];
}
const monthLabel = () => S.month.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
const nameOf = id => (S.members.find(m => m.user_id === id) || {}).name || '—';
const partner = () => S.members.find(m => m.user_id !== S.user.id);

// ---------- загрузка ----------
async function load() {
  const { data: ms, error } = await sb.from('members').select('*');
  if (error && isNetErr(error)) {
    const snap = lsGet('fb_snap');
    if (snap && snap.uid === S.user.id) {
      applySnap(snap); S.offline = true; S.tx = mergePending(S.tx);
      if (!S.booted) { S.booted = true; subscribe(); }
      return render();
    }
    return fail({ message: 'Нет связи с сервером. Откройте приложение, когда появится интернет: после первого входа оно будет работать и без сети.' });
  }
  if (error) return fail(error);
  S.members = ms || [];
  S.me = S.members.find(m => m.user_id === S.user.id);
  if (!S.me) return renderOnboarding();
  const { data: h } = await sb.from('households').select('*').limit(1).single();
  S.household = h;
  await refresh();
  if (!S.booted) { S.booted = true; subscribe(); }
}

// ---------- офлайн: снимок данных и очередь новых операций ----------
const isNetErr = e => !!e && /failed to fetch|networkerror|network request|load failed|fetch|timed? ?out|abort|^proxy:|offline/i.test(String(e.message || e));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const SNAP_KEYS = ['cats', 'tx', 'members', 'household', 'products', 'pantry', 'staples', 'stores', 'prices', 'goals', 'deposits',
  'photos', 'rules', 'inbox', 'token', 'carry', 'carryReady', 'foodReady', 'goalsReady', 'photosReady', 'rulesReady', 'autoReady', 'recur', 'recurReady'];
function saveSnap() {
  const o = { uid: S.user.id, at: Date.now(), month: S.month.getTime() };
  SNAP_KEYS.forEach(k => { o[k] = S[k]; });
  o.tx = (S.tx || []).filter(t => !t._pending);
  lsSet('fb_snap', o);
}
function applySnap(o) {
  SNAP_KEYS.forEach(k => { if (o[k] !== undefined) S[k] = o[k]; });
  if (o.month !== S.month.getTime()) S.tx = [];
  S.me = (S.members || []).find(m => m.user_id === S.user.id) || null;
}
const queue = () => lsGet('fb_q') || [];
function mergePending(list) {
  const [from, to] = monthRange();
  const have = new Set(list.map(t => t.id));
  const extra = queue().filter(q => !have.has(q.id) && q.date >= from && q.date < to)
    .map(q => ({ ...q, user_id: S.user.id, created_at: new Date().toISOString(), _pending: true }));
  return extra.length ? [...extra, ...list].sort((x, y) => y.date.localeCompare(x.date)) : list;
}
// отправить накопленные операции; true, если очередь пуста
async function flushQueue() {
  let q = queue();
  while (q.length) {
    const { _msg, ...row } = q[0];
    const { error } = await sb.from('transactions').insert(row);
    if (error && isNetErr(error)) return false;
    if (error && error.code !== '23505') toast('Операция на ' + fmt(+row.amount) + ' не принята: ' + error.message, 6000);
    q = q.slice(1); lsSet('fb_q', q);
  }
  return true;
}
function offlineBar() {
  const n = queue().length;
  if (!S.offline && !n) return '';
  return `<div class="offbar">${S.offline ? 'Нет связи, показаны сохранённые данные.' : 'Отправляем сохранённые операции.'}${n ? ' Ждут отправки: ' + n + '.' : ''}
    <button class="link" id="retry" style="padding:0 0 0 6px">Повторить</button></div>`;
}

async function refresh(opts = {}) {
  if (queue().length) await flushQueue();
  const [from, to] = monthRange();
  const [c, t, m, pr, pa, sp, sr, pc, tk, ib, hh, cr, gl, gd, ph, ru, rp] = await Promise.all([
    sb.from('categories').select('*').order('name'),
    sb.from('transactions').select('*').gte('date', from).lt('date', to)
      .order('date', { ascending: false }).order('created_at', { ascending: false }),
    sb.from('members').select('*'),
    sb.from('products').select('*').order('name'),
    sb.from('pantry_items').select('*'),
    sb.from('staples').select('*'),
    sb.from('stores').select('*').order('name'),
    sb.from('prices').select('*'),
    sb.from('ingest_tokens').select('*').maybeSingle(),
    sb.from('bank_inbox').select('*').eq('status', 'review').order('received_at', { ascending: false }),
    sb.from('households').select('*').limit(1).single(),
    sb.rpc('balance_before', { p_date: from }),
    sb.from('goals').select('*').order('created_at'),
    sb.from('goal_deposits').select('*').order('created_at', { ascending: false }),
    sb.from('photos').select('*').order('created_at', { ascending: false }).limit(600),
    sb.from('category_rules').select('*').order('keyword'),
    sb.from('recurring_payments').select('*').order('day')
  ]);
  if ([c, t, m].some(x => x.error && isNetErr(x.error))) {
    // сети нет: остаёмся на том, что уже загружено, или берём сохранённый снимок
    const wasOffline = S.offline;
    S.offline = true;
    if (!S.cats.length && !S.tx.length) { const snap = lsGet('fb_snap'); if (snap && snap.uid === S.user.id) applySnap(snap); }
    S.tx = mergePending(S.tx.filter(x => !x._pending));
    if (!wasOffline || !opts.poll) render();
    startPolling();
    return;
  }
  const wasOff = S.offline;
  S.offline = false;
  if (hh.data) S.household = hh.data;
  S.carryReady = !cr.error;
  S.carry = S.carryReady ? (+cr.data || 0) : 0;
  if (c.error || t.error || m.error) return fail(c.error || t.error || m.error);
  const sig = JSON.stringify([c.data, t.data, m.data, pr.data, pa.data, sp.data, sr.data, pc.data, ib.data, tk.data, hh.data, cr.data,
    gl.data, gd.data, ph.data, ru.data, rp.data, S.month.getTime(), queue().length, wasOff]);
  if (opts.poll && sig === S._sig) return;       // при периодическом опросе ничего не перерисовываем, если данные те же
  S._sig = sig;
  S.dataVer++;
  S.cats = c.data; S.tx = mergePending(t.data); S.members = m.data;
  S.foodReady = !(pr.error || pa.error || sp.error || sr.error || pc.error);
  S.products = S.foodReady ? pr.data : [];
  S.pantry = S.foodReady ? pa.data : [];
  S.staples = S.foodReady ? sp.data : [];
  S.stores = S.foodReady ? sr.data : [];
  S.prices = S.foodReady ? pc.data : [];
  S.goalsReady = !(gl.error || gd.error);
  S.goals = (S.goalsReady && gl.data) || [];
  S.deposits = (S.goalsReady && gd.data) || [];
  S.rulesReady = !ru.error;
  S.rules = (S.rulesReady && ru.data) || [];
  S.recurReady = !rp.error;
  S.recur = (S.recurReady && rp.data) || [];
  S.photosReady = !ph.error;
  S.photos = (S.photosReady && ph.data) || [];
  S.autoReady = !(tk.error || ib.error);
  S.token = S.autoReady ? tk.data : null;
  S.inbox = S.autoReady ? ib.data : [];
  saveSnap();
  render();
}

let pollTimer = null;
// периодическое обновление: нужно на своём хостинге (там нет realtime), при потере связи и при ожидающих операциях
function startPolling() {
  if (pollTimer || typeof setInterval !== 'function') return;
  pollTimer = setInterval(() => {
    if (!S.me || document.hidden) return;
    if (PROXY_MODE || S.offline || queue().length) refresh({ poll: true });
  }, 25000);
}

function subscribe() {
  startPolling();
  if (typeof window.addEventListener === 'function') window.addEventListener('online', () => { if (S.me) refresh(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) refresh(); });
  if (PROXY_MODE) return;                    // через proxy.php нет realtime: данные подтягиваются опросом
  let timer = null;
  const soon = () => { clearTimeout(timer); timer = setTimeout(refresh, 300); };
  let ch = sb.channel('household-live');
  ['transactions', 'categories', 'products', 'pantry_items', 'staples', 'stores', 'prices', 'bank_inbox', 'households', 'goals', 'goal_deposits', 'photos', 'category_rules', 'recurring_payments'].forEach(tb => {
    ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: tb }, soon);
  });
  ch.subscribe();
}

function fail(e) {
  $('#app').innerHTML = `<div class="wrap"><div class="card"><b>Ошибка</b><p class="err">${esc(e.message || e)}</p>
    <button class="full" onclick="location.reload()">Обновить</button></div></div>`;
}

function go(tab) {
  if (tab === 'home') {
    if (history.state && history.state.t) history.back();
    else { S.tab = 'home'; render(); }
    return;
  }
  S.tab = tab;
  history.pushState({ t: tab }, '');
  render();
}
window.addEventListener('popstate', e => {
  S.tab = (e.state && e.state.t) || 'home';
  if (S.me) render();
});

const monthBar = () => `<div class="monthbar"><button class="ghost" id="pm">‹</button><b>${esc(monthLabel())}</b><button class="ghost" id="nm">›</button></div>`;

function render() {
  const titles = { tx: 'Операции', lim: 'Лимиты', food: 'Продукты', photos: 'Фото', more: 'Семья' };
  let body = '';
  if (S.tab === 'home') body = renderHome();
  else {
    body = `<div class="top"><button class="ghost" id="bk">‹ Главная</button><b>${titles[S.tab]}</b></div>`;
    if (S.tab === 'tx') body += monthBar() + renderTx();
    else if (S.tab === 'lim') body += monthBar() + limSeg() + (S.limSub === 'goals' ? renderGoals() : S.limSub === 'recur' ? renderRecur() : S.limSub === 'charts' ? renderCharts() : renderLimits());
    else if (S.tab === 'food') body += renderFood();
    else if (S.tab === 'photos') body += renderPhotos();
    else body += renderMore();
  }
  $('#app').innerHTML = `<div class="wrap">${offlineBar()}${body}</div>${S.tab === 'more' ? '' : '<button class="fab" id="add">+</button>'}`;
  if ($('#pm')) { $('#pm').onclick = () => shiftMonth(-1); $('#nm').onclick = () => shiftMonth(1); }
  if ($('#add')) $('#add').onclick = () => S.tab === 'photos' ? pickPhotos() : S.tab === 'food' ? (S.foodReady ? (S.sub === 'stock' ? openAddStock() : openAddStaple()) : null) : (S.tab === 'lim' && S.limSub === 'goals') ? openGoalForm(null) : (S.tab === 'lim' && S.limSub === 'recur' && S.recurReady) ? openRecurForm(null) : openAdd();
  if ($('#bk')) $('#bk').onclick = () => go('home');
  if ($('#retry')) $('#retry').onclick = () => refresh();
  if (S.tab === 'home') countUp();
  if (S.tab === 'photos') hydratePhotos();
  if (S.tab === 'lim' && S.limSub === 'charts') hydrateCharts();
  $('#app').querySelectorAll('.tile').forEach(b => b.onclick = () => go(b.dataset.t));
  bindTab();
}

function greeting() {
  const h = new Date().getHours();
  return h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер';
}
const calm = () => typeof requestAnimationFrame === 'function' && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

// конфетти из фиолетово-розовых частиц (выше всего при пополнении цели)
function burst(n = 34) {
  if (!calm()) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#8b5cf6', '#c084fc', '#e879f9', '#f0abfc', '#818cf8', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    const a = Math.random() * Math.PI - Math.PI, v = 140 + Math.random() * 260;
    p.style.cssText = `left:50%;top:62%;background:${colors[i % colors.length]};--dx:${Math.cos(a) * v}px;--dy:${Math.sin(a) * v + 220}px;--rot:${Math.random() * 720 - 360}deg;animation-delay:${Math.random() * .12}s`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 1900);
}

// плавный набор числа в главной карточке (один раз за запуск)
function countUp() {
  if (S._counted || !calm()) return;
  const el = document.querySelector('[data-n]');
  if (!el || !el.dataset.n) return;
  S._counted = true;
  const to = +el.dataset.n, t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(to * e);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function renderHome() {
  const inc = S.tx.filter(t => t.kind === 'income').reduce((s, t) => s + +t.amount, 0);

  return `<h1>${greeting()}, ${esc(S.me.name)}</h1>
  ${monthBar()}
  <div class="card sum"><div><span class="mute">Доход</span><b style="color:var(--good)">${fmt(inc)}</b></div>
  <div><span class="mute">Расход</span><b>${fmt(exp)}</b></div>
  <div><span class="mute">Баланс</span><b>${fmt((S.carryReady ? S.carry : 0) + inc - exp - savedMonth())}</b></div>
  ${S.carryReady
    ? `<div class="mute" style="grid-column:1/-1">Перенос с прошлых месяцев: <b>${fmt(S.carry)}</b></div>`
    : '<div class="mute" style="grid-column:1/-1">Перенос остатка включится после выполнения update-4.sql</div>'}

  ${renderPace(inc, exp)}
  <div class="grid">
    <button class="tile t1" data-t="tx">${ICONS.tx}<div><b>Операции</b><span>Записей: ${S.tx.length}</span></div></button>
    <button class="tile t2" data-t="lim">${ICONS.lim}<div><b>Лимиты</b><span>Задано: ${limits}</span></div></button>
    <button class="tile t4" data-t="food">${ICONS.food}<div><b>Продукты</b><span>${S.foodReady ? 'Докупить: ' + missing().length : 'нужно обновить базу'}</span></div></button>
    <button class="tile t3" data-t="more">${ICONS.more}<div><b>Семья</b><span>${S.inbox.length ? 'Разобрать: ' + S.inbox.length : esc(S.members.map(m => m.name).join(', '))}</span></div></button>
    <button class="tile t5 wide" data-t="photos">${ICONS.photos}<div><b>Фото</b><span>${S.photosReady ? (S.photos.length ? 'Снимков: ' + S.photos.length : 'Пока пусто, добавьте первое') : 'нужно обновить базу'}</span></div></button>
  </div>`;
}

function shiftMonth(d) { S.month = new Date(S.month.getFullYear(), S.month.getMonth() + d, 1); refresh(); }

function sortable() {

}

function renderTx() {

// ---------- Продукты ----------
const UNITS = { 'шт': ['count', 1], 'г': ['mass', 1], 'кг': ['mass', 1000], 'мл': ['volume', 1], 'л': ['volume', 1000] };
const KIND_UNITS = { count: ['шт'], mass: ['г', 'кг'], volume: ['мл', 'л'] };
const PRICE_UNIT = { count: 'шт', mass: 'кг', volume: 'л' };
const PRICE_DIV = { count: 1, mass: 1000, volume: 1000 };
const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
const norm = s => String(s || '').trim().toLowerCase().replace(/ё/g, 'е');
const parseNum = v => parseFloat(String(v).replace(',', '.'));
const prod = id => S.products.find(p => p.id === id);

function fmtQty(n, kind) {
  n = +n;
  if (kind === 'count') return nf.format(n) + ' шт';
  const big = n >= 1000;
  return nf.format(big ? n / 1000 : n) + ' ' + (kind === 'mass' ? (big ? 'кг' : 'г') : (big ? 'л' : 'мл'));
}

// «300», «1.5 кг», «500 мл» -> число в базовых единицах (или null)
function parseQty(str, kind) {
  const m = String(str).trim().toLowerCase().match(/^([\d.,]+)\s*(шт|г|кг|мл|л|g|kg|ml|l)?$/);
  if (!m) return null;
  const alias = { g: 'г', kg: 'кг', ml: 'мл', l: 'л' };
  const n = parseNum(m[1]);
  if (!(n >= 0)) return null;
  const u = alias[m[2]] || m[2] || KIND_UNITS[kind][0];
  if (UNITS[u][0] !== kind) return null;
  return n * UNITS[u][1];
}

const isFresh = b => !b.expires_on || b.expires_on >= today();
const haveQty = pid => S.pantry.filter(b => b.product_id === pid && isFresh(b)).reduce((s, b) => s + +b.qty, 0);

function shortages() {
  return S.staples.map(st => {
    const p = prod(st.product_id);
    if (!p) return null;
    const have = haveQty(p.id);
    return { st, p, have, need: Math.max(0, +st.min_qty - have) };
  }).filter(Boolean);
}
const missing = () => shortages().filter(x => x.need > 0);

function expInfo(d) {
  if (!d) return { text: '', cls: '' };
  const days = Math.round((new Date(d + 'T00:00') - new Date(today() + 'T00:00')) / 86400000);
  const dt = new Date(d + 'T00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  if (days < 0) return { text: 'просрочено (' + dt + ')', cls: 'bad' };
  if (days <= 3) return { text: 'до ' + dt + (days === 0 ? ' (сегодня)' : ' (осталось дн.: ' + days + ')'), cls: 'warn' };
  return { text: 'до ' + dt, cls: '' };
}

function renderFood() {
  if (!S.foodReady) {
    return '<div class="card"><b>Нужно обновить базу</b><p class="mute">Выполните файл update-2.sql в Supabase (SQL Editor → New query → Run), затем обновите приложение.</p></div>';
  }
  const seg = `<div class="seg">
    <button data-sub="stock" class="${S.sub === 'stock' ? 'on' : ''}">Дома</button>
    <button data-sub="staples" class="${S.sub === 'staples' ? 'on' : ''}">Всегда дома</button></div>`;
  return seg + (S.sub === 'stock' ? renderStock() : renderStaples());
}

function renderStock() {
  const groups = {};
  S.pantry.forEach(b => (groups[b.product_id] = groups[b.product_id] || []).push(b));
  const list = Object.keys(groups).map(pid => {
    const items = groups[pid];
    const dated = items.filter(b => b.expires_on).map(b => b.expires_on).sort();
    return { p: prod(pid), items, total: items.reduce((s, b) => s + +b.qty, 0), exp: dated[0] || '' };
  }).filter(g => g.p).sort((a, b) => (a.exp || '9999').localeCompare(b.exp || '9999') || a.p.name.localeCompare(b.p.name, 'ru'));
  const rows = list.map(g => {
    const e = expInfo(g.exp);
    return `<div class="pi" data-p="${g.p.id}"><div><div>${esc(g.p.name)}</div>
      <div class="mute ${e.cls ? 'txt-' + e.cls : ''}">${esc(e.text || 'срок не указан')}</div></div>
      <div class="amt">${fmtQty(g.total, g.p.kind)}</div></div>`;
  }).join('');
  return `<div class="card">${rows || '<div class="empty">Дома пока ничего не записано.<br>Нажмите +, чтобы добавить вручную или отсканировать штрихкод.</div>'}</div>`;
}

function renderStaples() {
  const list = shortages().sort((a, b) => (b.need > 0) - (a.need > 0) || a.p.name.localeCompare(b.p.name, 'ru'));
  const miss = list.filter(x => x.need > 0).length;
  const head = list.length ? `<div class="card"><div class="row" style="align-items:center">
      <div><b>${miss ? 'Не хватает позиций: ' + miss : 'Всё есть дома'}</b><div class="mute">из ${list.length} запланированных</div></div>
      <button id="shop"${miss ? '' : ' class="ghost"'}>Что докупить</button></div></div>` : '';
  const rows = list.map(x => `<div class="pi" data-s="${x.st.id}"><div><div>${esc(x.p.name)}</div>
      <div class="mute">нужно держать ${fmtQty(x.st.min_qty, x.p.kind)}, сейчас ${fmtQty(x.have, x.p.kind)}</div></div>
      <div class="amt ${x.need > 0 ? 'txt-bad' : 'txt-good'}">${x.need > 0 ? 'не хватает ' + fmtQty(x.need, x.p.kind) : '✓'}</div></div>`).join('');
  return head + `<div class="card">${rows || '<div class="empty">Список пуст.<br>Нажмите +, чтобы добавить продукт, который всегда должен быть дома.</div>'}</div>`;
}

let scanReader = null;
function stopScan() {
  try { if (scanReader) scanReader.reset(); } catch (e) {}
  scanReader = null;
  const o = $('#scan');
  if (o) o.remove();
}
function loadZXing() {
  return new Promise((res, rej) => {
    if (window.ZXing) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function scanBarcode(done) {
  stopScan();
  const o = document.createElement('div');
  o.id = 'scan'; o.className = 'sheet-bg'; o.style.zIndex = 20;
  o.innerHTML = `<div class="sheet"><b>Наведите камеру на штрихкод</b>
    <video id="vid" playsinline muted style="width:100%;border-radius:12px;background:#000;margin-top:8px;max-height:50vh"></video>
    <div class="mute" id="smsg">Запускаю камеру…</div>
    <button class="ghost full" id="scx">Отмена</button></div>`;
  document.body.appendChild(o);
  $('#scx').onclick = stopScan;
  const say = t => { const m = $('#smsg'); if (m) m.textContent = t; };
  try { await loadZXing(); } catch (e) { return say('Сканер не загрузился. Проверьте интернет и попробуйте ещё раз.'); }
  try {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128]);
    scanReader = new ZXing.BrowserMultiFormatReader(hints, 300);
    let got = false;
    await scanReader.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } } }, 'vid', res => {
      if (res && !got) { got = true; const code = res.getText(); stopScan(); done(code); }
    });
    say('Ищу штрихкод…');
  } catch (e) {
    say('Нет доступа к камере. Разрешите камеру для этого сайта в настройках браузера или введите название вручную.');
  }
}

// Название по штрихкоду: открытая база Open Food Facts (может не знать часть товаров)
async function lookupBarcode(code) {
  try {
    const ctl = new AbortController();
    const tm = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) +
      '.json?fields=product_name,product_name_ru,brands,quantity', { signal: ctl.signal });
    clearTimeout(tm);
    const j = await r.json();
    if (j.status !== 1 || !j.product) return null;
    const p = j.product;
    const base = (p.product_name_ru || p.product_name || '').trim();
    const brand = (p.brands || '').split(',')[0].trim();
    if (!base) return null;
    let pack = null;
    const m = String(p.quantity || '').toLowerCase().match(/^\s*([\d.,]+)\s*(kg|g|ml|l)\b/);
    if (m) pack = { n: parseNum(m[1]), unit: { kg: 'кг', g: 'г', ml: 'мл', l: 'л' }[m[2]] };
    return { name: brand && !norm(base).includes(norm(brand)) ? base + ' ' + brand : base, pack };
  } catch (e) { return null; }
}

// ----- форма: название + штрихкод + количество (+ срок годности) -----
function foodForm(o) {
  let barcode = null;
  sheet(`<b>${o.title}</b>
    <div class="row" style="gap:8px"><input id="pn" list="pl" placeholder="Название продукта" autocomplete="off" style="flex:1"><button class="ghost" id="sc" style="margin:6px 0">Скан</button></div>
    <datalist id="pl">${S.products.map(p => `<option value="${esc(p.name)}">`).join('')}</datalist>
    <div class="mute" id="pinfo"></div>
    <div class="row" style="gap:8px"><input id="pq" type="number" inputmode="decimal" min="0" step="any" placeholder="${o.qtyLabel}" style="flex:1">
      <select id="pu" style="width:90px">${Object.keys(UNITS).map(u => `<option>${u}</option>`).join('')}</select></div>
    ${o.expiry ? '<div class="mute">Срок годности (необязательно)</div><input id="pd" type="date">' : ''}
    <div class="err" id="err"></div>
    <button class="full" id="sv">Сохранить</button>`);
  const err = t => { $('#err').textContent = t; };
  const syncUnit = () => {
    const p = S.products.find(x => norm(x.name) === norm($('#pn').value));
    const cur = $('#pu').value;
    const opts = p ? KIND_UNITS[p.kind] : Object.keys(UNITS);
    $('#pu').innerHTML = opts.map(u => `<option>${u}</option>`).join('');
    if (opts.includes(cur)) $('#pu').value = cur;
  };
  $('#pn').oninput = syncUnit;
  if (o.prefill) { $('#pn').value = o.prefill; syncUnit(); }
  $('#sc').onclick = () => scanBarcode(async code => {
    barcode = code;
    const known = S.products.find(x => x.barcode === code);
    if (known) { $('#pn').value = known.name; syncUnit(); $('#pinfo').textContent = 'Узнал по вашему списку'; return; }
    $('#pinfo').textContent = 'Ищу название…';
    const r = await lookupBarcode(code);
    if (r) {
      $('#pn').value = r.name; syncUnit();
      $('#pinfo').textContent = 'Нашёл по штрихкоду, проверьте название';
      if (r.pack && !$('#pq').value) { $('#pq').value = r.pack.n; $('#pu').value = r.pack.unit; }
    } else {
      $('#pinfo').textContent = 'Штрихкода ' + code + ' нет в базе. Введите название, в следующий раз узнаю сам.';
    }
  });
  $('#sv').onclick = async () => {
    const name = $('#pn').value.trim();
    const q = parseNum($('#pq').value);
    const unit = $('#pu').value;
    if (!name) return err('Введите название');
    if (!(q > 0)) return err('Введите количество');
    const [kind, mult] = UNITS[unit];
    let p = (barcode && S.products.find(x => x.barcode === barcode)) || S.products.find(x => norm(x.name) === norm(name));
    if (p && p.kind !== kind) return err('Для «' + p.name + '» единицы: ' + KIND_UNITS[p.kind].join(' / '));
    $('#sv').disabled = true;
    if (!p) {
      const { data, error } = await sb.from('products')
        .insert({ household_id: S.household.id, name, kind, barcode }).select().single();
      if (error) { $('#sv').disabled = false; return err(error.message); }
      p = data; S.products.push(p);
    } else if (barcode && !p.barcode) {
      await sb.from('products').update({ barcode }).eq('id', p.id);
    }
    const e = await o.onSave(p, q * mult);
    if (e) { $('#sv').disabled = false; return err(e); }
    closeSheet(); refresh();
  };
}

  document.querySelectorAll('#sh [data-use]').forEach(btn => btn.onclick = async () => {

    const v = prompt('Сколько осталось? Например: 300 г, 1.5 кг, 2 шт. Ноль — всё израсходовано.', '');

// ----- карточка запланированного продукта -----
function openStaple(id) {
  const st = S.staples.find(x => x.id === id);
  const p = st && prod(st.product_id);
  if (!p) return;
  const big = p.kind !== 'count' && +st.min_qty >= 1000;
  const unit = p.kind === 'count' ? 'шт' : p.kind === 'mass' ? (big ? 'кг' : 'г') : (big ? 'л' : 'мл');
  const val = Math.round(+st.min_qty / UNITS[unit][1] * 1000) / 1000;
  sheet(`<b>${esc(p.name)}</b><div class="mute">Сколько должно быть дома всегда</div>
    <div class="row" style="gap:8px"><input id="pq" type="number" inputmode="decimal" min="0" step="any" value="${val}" style="flex:1">
    <select id="pu" style="width:90px">${KIND_UNITS[p.kind].map(u => `<option${u === unit ? ' selected' : ''}>${u}</option>`).join('')}</select></div>
    <div class="err" id="err"></div>
    <button class="full" id="sv">Сохранить</button>
    <button class="link full" id="rm">Убрать из запланированных</button>
    <button class="ghost full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  $('#sv').onclick = async () => {
    const q = parseNum($('#pq').value);
    if (!(q > 0)) return $('#err').textContent = 'Введите количество';
    const { error } = await sb.from('staples').update({ min_qty: q * UNITS[$('#pu').value][1] }).eq('id', id);
    if (error) return $('#err').textContent = error.message;
    closeSheet(); refresh();
  };
  $('#rm').onclick = async () => {
    const { error } = await sb.from('staples').delete().eq('id', id);
    if (error) return alert(error.message);
    closeSheet(); refresh();
  };
}

// ----- «Что докупить»: нехватка, цены, итог по магазинам -----
const priceOf = (pid, sid) => { const r = S.prices.find(x => x.product_id === pid && x.store_id === sid); return r ? +r.price : null; };
const lineCost = (it, price) => price == null ? null : it.need / PRICE_DIV[it.p.kind] * price;
function storeTotals(items, store, override) {
  let total = 0, unknown = 0;
  items.forEach(it => {
    const price = override ? override[it.p.id] : priceOf(it.p.id, store.id);
    const c = lineCost(it, price);
    if (c == null) unknown++; else total += c;
  });
  return { total, unknown };
}
const shopText = items => 'Список покупок:\n' + items.map(it => '• ' + it.p.name + ' — ' + fmtQty(it.need, it.p.kind)).join('\n');
function copyText(t) {
  try { if (navigator.clipboard) return navigator.clipboard.writeText(t); } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  } catch (e) {}
}

function openShop() {
  const items = missing();
  if (!items.length) {
    sheet('<b>Всё есть дома</b><p class="mute">Докупать ничего не нужно: все запланированные продукты в наличии.</p><button class="ghost full" id="cl">Закрыть</button>');
    $('#cl').onclick = closeSheet;
    return;
  }
  const info = S.stores.map(st => ({ st, ...storeTotals(items, st) }));
  const full = info.filter(x => x.unknown === 0);
  const best = full.length > 1 ? Math.min(...full.map(x => x.total)) : null;
  sheet(`<b>Что докупить</b>
    <div class="card">${items.map(it => `<div class="row"><span>${esc(it.p.name)}</span><span class="mute">${fmtQty(it.need, it.p.kind)}</span></div>`).join('')}</div>
    <div class="day">Магазины</div>
    ${info.map(x => `<div class="card" data-st="${x.st.id}" style="cursor:pointer"><div class="row"><b>${esc(x.st.name)}</b><b>${x.total ? fmt(x.total) : '—'}</b></div>
      <div class="mute">${x.unknown ? 'нет цены у позиций: ' + x.unknown : 'цены есть на всё'}${best !== null && x.unknown === 0 && x.total === best ? ' · дешевле всего' : ''}</div></div>`).join('')
      || '<div class="mute" style="margin-bottom:8px">Магазинов пока нет. Добавьте первый, чтобы вводить цены и сравнивать.</div>'}
    <button class="ghost full" id="addstore">+ Магазин</button>
    <button class="ghost full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  $('#addstore').onclick = () => editStore(null);
  document.querySelectorAll('#sh [data-st]').forEach(el => el.onclick = () => openStore(el.dataset.st));
}

function openStore(sid) {
  const st = S.stores.find(x => x.id === sid);
  if (!st) return;
  const items = missing();
  const local = {};
  items.forEach(it => { local[it.p.id] = priceOf(it.p.id, sid); });
  sheet(`<div class="top" style="margin:0 0 6px"><button class="ghost" id="bk2">‹ Назад</button><b>${esc(st.name)}</b></div>
    <div class="big" id="tot"></div><div class="mute" id="unk"></div>
    <div class="card">${items.map(it => `<div class="pi"><div><div>${esc(it.p.name)}</div>
      <div class="mute">${fmtQty(it.need, it.p.kind)} · цена за ${PRICE_UNIT[it.p.kind]}</div></div>
      <div style="text-align:right"><input data-pid="${it.p.id}" type="number" inputmode="decimal" step="any" min="0" value="${local[it.p.id] ?? ''}" placeholder="₽" style="width:92px;margin:0;text-align:right">
      <div class="mute" data-cost="${it.p.id}"></div></div></div>`).join('')}</div>
    <button class="full" id="go">Перейти в магазин</button>
    <div class="mute" id="msg" style="margin-top:6px">Список покупок скопируется, и откроется сайт магазина.</div>
    <button class="ghost full" id="cp">Скопировать список</button>
    <button class="link full" id="es">Изменить магазин</button>`);
  const calc = () => {
    const t = storeTotals(items, st, local);
    $('#tot').textContent = fmt(t.total);
    $('#unk').textContent = t.unknown ? 'Нет цены у позиций: ' + t.unknown + ' (итог без них)' : 'Цены указаны на все позиции';
    items.forEach(it => {
      const c = lineCost(it, local[it.p.id]);
      const el = document.querySelector('#sh [data-cost="' + it.p.id + '"]');
      if (el) el.textContent = c == null ? '' : '≈ ' + fmt(c);
    });
  };
  calc();
  $('#bk2').onclick = openShop;
  $('#es').onclick = () => editStore(sid);
  $('#cp').onclick = () => { copyText(shopText(items)); $('#msg').textContent = 'Список скопирован'; };
  $('#go').onclick = () => {
    copyText(shopText(items));
    if (st.url) window.open(/^https?:\/\//i.test(st.url) ? st.url : 'https://' + st.url, '_blank', 'noopener');
    else $('#msg').textContent = 'Список скопирован. Укажите адрес сайта в «Изменить магазин», чтобы переходить прямо отсюда.';
  };
  document.querySelectorAll('#sh input[data-pid]').forEach(inp => {
    const pid = inp.dataset.pid;
    inp.oninput = () => { const v = parseNum(inp.value); local[pid] = v >= 0 ? v : null; calc(); };
    inp.onchange = async () => {
      const v = parseNum(inp.value);
      if (inp.value.trim() === '') {
        const { error } = await sb.from('prices').delete().eq('product_id', pid).eq('store_id', sid);
        if (!error) S.prices = S.prices.filter(r => !(r.product_id === pid && r.store_id === sid));
      } else if (v >= 0) {
        const { data, error } = await sb.from('prices').upsert(
          { household_id: S.household.id, product_id: pid, store_id: sid, price: v, updated_at: new Date().toISOString() },
          { onConflict: 'product_id,store_id' }).select();
        if (error || !data || !data[0]) return alert(error ? error.message : 'Цена не сохранилась');
        S.prices = S.prices.filter(r => !(r.product_id === pid && r.store_id === sid)).concat(data[0]);
      }
    };
  });
}

function editStore(sid) {
  const st = sid ? S.stores.find(x => x.id === sid) : null;
  sheet(`<b>${st ? 'Магазин' : 'Новый магазин'}</b>
    <input id="sn" placeholder="Название (например, Пятёрочка)" value="${esc(st ? st.name : '')}">
    <input id="su" placeholder="Адрес сайта (необязательно)" value="${esc(st ? st.url || '' : '')}" autocapitalize="off">
    <div class="err" id="err"></div>
    <button class="full" id="sv">Сохранить</button>
    ${st ? '<button class="ghost full" id="dl" style="color:var(--bad)">Удалить магазин</button>' : ''}
    <button class="ghost full" id="cl">Отмена</button>`);
  $('#cl').onclick = openShop;
  $('#sv').onclick = async () => {
    const name = $('#sn').value.trim();
    const url = $('#su').value.trim() || null;
    if (!name) return $('#err').textContent = 'Введите название';
    const { error } = st
      ? await sb.from('stores').update({ name, url }).eq('id', sid)
      : await sb.from('stores').insert({ household_id: S.household.id, name, url });
    if (error) return $('#err').textContent = error.message;
    await refresh();
    openShop();
  };
  if (st) $('#dl').onclick = async () => {
    if (!confirm('Удалить магазин «' + st.name + '» и его цены?')) return;
    const { error } = await sb.from('stores').delete().eq('id', sid);
    if (error) return alert(error.message);
    await refresh();
    openShop();
  };
}

// ---------- Осталось на день и прогноз ----------
const isCurMonth = () => {
  const n = new Date();
  return S.month.getFullYear() === n.getFullYear() && S.month.getMonth() === n.getMonth();
};
const planValue = () => (S.household && +S.household.monthly_plan > 0) ? +S.household.monthly_plan : 0;

// base: плановый бюджет (если задан) или доходы текущего месяца; к нему прибавляется перенос остатка
function paceInfo(inc, exp) {
  const plan = planValue();
  const base = plan || inc;
  const carry = S.carryReady ? S.carry : 0;
  const saved = plan ? 0 : savedMonth();             // отложено на цели (при плановом бюджете план и есть лимит трат)
  const pool = base + carry - saved;                // сколько всего можно потратить в этом месяце
  const n = new Date();
  const dim = new Date(S.month.getFullYear(), S.month.getMonth() + 1, 0).getDate();
  const day = n.getDate();
  const left = dim - day + 1;                       // дней до конца месяца, включая сегодня
  const { unpaid, paid } = recurTotals();           // неоплаченные платежи резервируем заранее
  const remaining = pool - exp - unpaid;
  return {
    plan, base, carry, saved, pool, dim, day, left, remaining, unpaid,
    perDay: remaining > 0 ? remaining / left : 0,
    // прогноз: обычные траты по среднему темпу плюс платежи, которые бывают раз в месяц
    projected: day >= 3 ? (exp - paid) / day * dim + paid + unpaid : null
  };
}

function renderPace(inc, exp) {
  if (!isCurMonth()) return '';
  const p = paceInfo(inc, exp);
  const planBtn = `<button class="link" id="plan" style="padding:0">${p.plan ? 'Изменить плановый бюджет' : 'Задать плановый бюджет'}</button>`;
  if (p.pool <= 0) {
    return `<div class="card"><b>Осталось на день</b>
      <p class="mute">В этом месяце пока нет доходов и остатка. Когда придёт доход, здесь появится расчёт. Либо задайте плановый бюджет на месяц.</p>${planBtn}</div>`;
  }
  const today0 = today();
  const spentToday = S.tx.filter(t => t.kind === 'expense' && t.date === today0).reduce((s, t) => s + +t.amount, 0);
  const over = p.remaining < 0;
  const pc = Math.min(100, exp / p.pool * 100);
  const cls = exp > p.pool ? 'bad' : (exp > p.pool * .85 ? 'warn' : '');
  let fc = '<div class="mute">Прогноз появится через пару дней, когда накопится статистика трат.</div>';
  if (p.projected !== null) {
    fc = p.projected <= p.pool
      ? `<div class="mute">При таком темпе до конца месяца потратите около ${fmt(p.projected)}. Укладываетесь, запас около ${fmt(p.pool - p.projected)}.</div>`
      : `<div class="mute txt-bad">При таком темпе до конца месяца потратите около ${fmt(p.projected)}. Выйдет перерасход около ${fmt(p.projected - p.pool)}.</div>`;
  }
  const src = (p.plan ? 'плановый бюджет ' : 'доходы месяца ') + fmt(p.base)
    + (p.carry ? (p.carry > 0 ? ' + перенос ' : ' − долг прошлых месяцев ') + fmt(Math.abs(p.carry)) : '')
    + (p.saved ? ' − отложено на цели ' + fmt(p.saved) : '')
    + (p.unpaid ? ' − впереди платежи ' + fmt(p.unpaid) : '');
  return `<div class="card hero">
    <div class="mute">Осталось на день</div>
    <div ${over ? '' : `data-n="${Math.round(p.perDay)}" `}class="big ${over ? 'txt-bad' : ''}">${over ? (exp > p.pool ? 'Перерасход ' : 'Не хватает ') + fmt(-p.remaining) : fmt(p.perDay)}</div>
    <div class="mute">${over ? '' : 'Осталось ' + fmt(p.remaining) + ' на ' + p.left + ' дн. · '}${src}</div>
    <div class="bar"><i class="${cls}" style="width:${pc}%"></i></div>
    <div class="mute" style="margin-top:6px">Сегодня потрачено ${fmt(spentToday)}</div>
    ${fc}
    <div style="margin-top:6px">${planBtn}</div></div>`;
}

// ---------- цели накоплений ----------
const limSeg = () => `<div class="seg fit"><button data-ls="cats" class="${S.limSub === 'cats' ? 'on' : ''}">Лимиты</button><button data-ls="goals" class="${S.limSub === 'goals' ? 'on' : ''}">Цели</button><button data-ls="recur" class="${S.limSub === 'recur' ? 'on' : ''}">Платежи</button><button data-ls="charts" class="${S.limSub === 'charts' ? 'on' : ''}">Графики</button></div>`;

function goalSums() {
  const [from, to] = monthRange();
  const tot = {}, mon = {};
  S.deposits.forEach(d => {
    tot[d.goal_id] = (tot[d.goal_id] || 0) + +d.amount;
    if (d.date >= from && d.date < to) mon[d.goal_id] = (mon[d.goal_id] || 0) + +d.amount;
  });
  return { tot, mon };
}
function savedMonth() {
  if (!S.goalsReady) return 0;
  const [from, to] = monthRange();
  return S.deposits.filter(d => d.date >= from && d.date < to).reduce((s, d) => s + +d.amount, 0);
}

function renderGoals() {
  if (!S.goalsReady) {
    return '<div class="card"><b>Цели</b><p class="mute">Выполните файл update-6.sql в Supabase (SQL Editor → New query → Run), затем обновите приложение.</p></div>';
  }
  const { tot, mon } = goalSums();
  const planned = S.goals.reduce((s, g) => s + +g.monthly, 0);
  const done = savedMonth();
  const head = `<div class="card"><div class="mute">Отложено в этом месяце</div>
    <div class="big">${fmt(done)}${planned ? ` <span class="mute" style="font-size:16px">из ${fmt(planned)}</span>` : ''}</div>
    ${planned ? `<div class="bar"><i style="width:${Math.min(100, Math.max(0, done / planned * 100))}%"></i></div>` : ''}
    <div class="mute" style="margin-top:6px">Отложенные деньги вычитаются из общего бюджета и из «осталось на день».</div></div>`;
  const rows = S.goals.map(g => {
    const t = tot[g.id] || 0, m = mon[g.id] || 0, target = +g.target, mp = +g.monthly;
    let line = '';
    if (target > 0) {
      const left = target - t;
      line = `<div class="bar"><i style="width:${Math.min(100, Math.max(0, t / target * 100))}%"></i></div>
        <div class="mute" style="margin-top:4px">${left <= 0 ? 'Цель достигнута 🎉' : 'Цель ' + fmt(target) + ' · осталось ' + fmt(left)
          + (mp > 0 ? ' · примерно ' + Math.ceil(left / mp) + ' мес.' : '')}</div>`;
    }
    const mline = mp > 0 ? `<div class="mute" style="margin-top:4px">В этом месяце ${fmt(m)} из ${fmt(mp)}</div>`
      : (m ? `<div class="mute" style="margin-top:4px">В этом месяце ${fmt(m)}</div>` : '');
    return `<div class="cat goal" data-g="${g.id}"><div class="row"><span>${esc(g.name)}</span><b>${fmt(t)}</b></div>${line}${mline}</div>`;
  }).join('');
  return head + `<div class="card">${rows || '<div class="empty">Целей пока нет.<br>Добавьте первую кнопкой ниже.</div>'}</div>
    <div class="mute" style="padding:0 4px">Нажмите на цель, чтобы отложить деньги или посмотреть историю.</div>
    <button class="ghost full" id="ag">+ Новая цель</button>`;
}

function openGoalForm(id) {
  const g = id ? S.goals.find(x => x.id === id) : null;
  if (id && !g) return;
  sheet(`<b>${g ? 'Цель' : 'Новая цель'}</b>
    <input id="gn" value="${esc(g ? g.name : '')}" placeholder="Название, например: Отпуск">
    <input id="gt" type="number" inputmode="decimal" min="0" step="1" value="${g && +g.target ? +g.target : ''}" placeholder="Сколько нужно накопить, ₽ (можно пусто)">
    <input id="gm" type="number" inputmode="decimal" min="0" step="1" value="${g && +g.monthly ? +g.monthly : ''}" placeholder="Сколько откладывать в месяц, ₽">
    <div class="err" id="err"></div>
    <button class="full" id="sv">Сохранить</button>
    ${g ? '<button class="ghost full" id="dl" style="color:var(--bad)">Удалить цель</button>' : ''}
    <button class="link full" id="cl">${g ? 'Назад' : 'Отмена'}</button>`);
  $('#cl').onclick = g ? () => openGoal(id) : closeSheet;
  $('#sv').onclick = async () => {
    const name = $('#gn').value.trim();
    if (!name) return $('#err').textContent = 'Введите название';
    const target = parseNum($('#gt').value) || 0, monthly = parseNum($('#gm').value) || 0;
    if (target < 0 || monthly < 0) return $('#err').textContent = 'Суммы не могут быть отрицательными';
    $('#sv').disabled = true;
    const q = g ? sb.from('goals').update({ name, target, monthly }).eq('id', id)
                : sb.from('goals').insert({ household_id: S.household.id, name, target, monthly });
    const { error } = await q;
    if (error) { $('#sv').disabled = false; return $('#err').textContent = error.message; }
    closeSheet(); refresh();
  };
  if ($('#dl')) $('#dl').onclick = async () => {
    const t = goalSums().tot[id] || 0;
    if (!confirm(`Удалить цель «${g.name}»?` + (t ? ` Отложенные ${fmt(t)} вернутся в общий бюджет.` : ''))) return;
    const { error } = await sb.from('goals').delete().eq('id', id);
    if (error) return $('#err').textContent = error.message;
    closeSheet(); refresh();
  };
}

function openGoal(id) {
  const g = S.goals.find(x => x.id === id);
  if (!g) return;
  const { tot, mon } = goalSums();
  const t = tot[id] || 0, m = mon[id] || 0, mp = +g.monthly;
  const left = mp > 0 ? Math.max(0, mp - m) : 0;
  const hist = S.deposits.filter(d => d.goal_id === id).slice(0, 8);
  sheet(`<b>${esc(g.name)}</b>
    <div class="big">${fmt(t)}${+g.target > 0 ? ` <span class="mute" style="font-size:16px">из ${fmt(+g.target)}</span>` : ''}</div>
    ${mp > 0 ? `<div class="mute">В этом месяце ${fmt(m)} из ${fmt(mp)}</div>` : ''}
    <input id="da" type="number" inputmode="decimal" min="0" step="1" value="${left || ''}" placeholder="Сумма, ₽">
    <div class="err" id="err"></div>
    <button class="full" id="dp">Отложить</button>
    <button class="ghost full" id="wd">Вернуть в бюджет</button>
    <button class="ghost full" id="ed">Изменить цель</button>
    ${hist.length ? `<div class="mute" style="margin-top:8px">История</div>
      ${hist.map(d => `<div class="pi" style="cursor:default"><div><div>${+d.amount > 0 ? 'Отложено' : 'Возвращено'} · ${esc(nameOf(d.user_id))}</div>
        <div class="mute">${esc(new Date(d.date + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }))}</div></div>
        <div class="amt">${+d.amount > 0 ? '+' : '−'}${fmt(Math.abs(+d.amount))}</div></div>`).join('')}` : ''}
    <button class="link full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  $('#ed').onclick = () => openGoalForm(id);
  const move = async sign => {
    const v = parseNum($('#da').value);
    if (!(v > 0)) return $('#err').textContent = 'Введите сумму';
    if (sign < 0 && v > t) return $('#err').textContent = 'На цели накоплено только ' + fmt(t);
    $('#dp').disabled = true; $('#wd').disabled = true;
    const { error } = await sb.from('goal_deposits').insert({
      goal_id: id, household_id: S.household.id, user_id: S.user.id, amount: sign * v,
      date: isCurMonth() ? today() : monthRange()[0]
    });
    if (error) { $('#dp').disabled = false; $('#wd').disabled = false; return $('#err').textContent = error.message; }
    if (sign > 0) burst(sign * v >= left && left > 0 ? 60 : 34);
    closeSheet(); refresh();
  };
  $('#dp').onclick = () => move(1);
  $('#wd').onclick = () => move(-1);
}

const PHOTO_BUCKET = 'family-photos';

function toast(msg, ms = 2600) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  if (ms) setTimeout(() => t.remove(), ms);
  return t;
}

  }

  }
  const groups = [];
  S.photos.forEach(ph => {
    const label = new Date(ph.created_at).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });

}

// подписанные ссылки на закрытые файлы: берём пачкой и держим в кэше
function applyUrls() {
  document.querySelectorAll('img[data-p]').forEach(im => {
    const u = S.urls[im.dataset.p];
    if (u && u.exp > Date.now() && im.getAttribute('src') !== u.url) {
      im.onload = () => im.classList.add('in');
      im.src = u.url;
      if (im.complete) im.classList.add('in');
    }
  });
}
async function signUrls(paths) {
  const need = [...new Set(paths)].filter(p => !(S.urls[p] && S.urls[p].exp > Date.now()));
  for (let i = 0; i < need.length; i += 100) {
    const { data, error } = await bucket().createSignedUrls(need.slice(i, i + 100), 3600);
    if (error || !data) break;
    data.forEach(d => { if (d.signedUrl) S.urls[d.path] = { url: d.signedUrl, exp: Date.now() + 3300000 }; });
  }
}
async function hydratePhotos() {
  if (!S.photosReady) return;
  applyUrls();
  const paths = [...document.querySelectorAll('img[data-p]')].map(i => i.dataset.p);

// сжатие: большая копия до 1920 px и миниатюра до 420 px (JPEG), поворот по EXIF учитывается
async function toJpeg(file, max, q) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    src = await new Promise((res, rej) => {
      const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('не удалось открыть изображение'));
      im.src = URL.createObjectURL(file);
    });
  }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(src, 0, 0, c.width, c.height);
  if (src.close) src.close();
  return new Promise((res, rej) => c.toBlob(b => b ? res({ blob: b, w: c.width, h: c.height }) : rej(new Error('не удалось сжать')), 'image/jpeg', q));
}

async function uploadPhotos(files) {
  let ok = 0, bad = 0, lastErr = '';
  const t = toast('', 0);
  for (let i = 0; i < files.length; i++) {
    t.textContent = `Загружаем ${i + 1} из ${files.length}…`;
    const id = crypto.randomUUID();
    const path = `${S.household.id}/${id}.jpg`, tpath = `${S.household.id}/${id}_t.jpg`;
    try {
      const full = await toJpeg(files[i], 1920, .82), th = await toJpeg(files[i], 420, .75);
      let r = await bucket().upload(path, full.blob, { contentType: 'image/jpeg' });
      if (r.error) throw r.error;
      r = await bucket().upload(tpath, th.blob, { contentType: 'image/jpeg' });
      if (r.error) { await bucket().remove([path]); throw r.error; }
      r = await sb.from('photos').insert({ id, household_id: S.household.id, user_id: S.user.id, path, thumb_path: tpath,
        width: full.w, height: full.h, size: full.blob.size });
      if (r.error) { await bucket().remove([path, tpath]); throw r.error; }
      ok++;
    } catch (e) { bad++; lastErr = (e && e.message) || String(e); }
  }
  t.remove();
  await refresh();
  if (ok) burst(ok > 1 ? 26 : 16);
  toast(bad ? `Загружено ${ok}, не удалось ${bad}: ${lastErr}` : (ok === 1 ? 'Фото добавлено' : `Добавлено фото: ${ok}`), bad ? 5000 : 2600);
}

function viewerKey(e) {

// ---------- автокатегории ----------
const NOT_MERCHANT = /^(покупк|оплат|перевод|пополнен|возврат|списан|снят|платеж|платёж|отправл|комисси|зачислен|поступлен|кэшбэк|кешбэк)/i;
// предположение: название магазина или получателя = первый кусок текста без суммы и без глагола операции
function guessKeyword(note) {
  const parts = String(note || '').split(/\.\s+|\.$/).map(x => x.trim()).filter(Boolean);
  const hit = parts.find(x => !/₽|руб/i.test(x) && !NOT_MERCHANT.test(x));
  return (hit || '').toLowerCase().replace(/[.\s]+$/, '').slice(0, 40);
}

// сохранить правило и сразу применить к прошлым операциям без категории
async function saveRule(keyword, catId) {
  const kw = String(keyword || '').trim().toLowerCase();
  if (kw.length < 2) throw new Error('Введите хотя бы 2 символа');
  const cat = S.cats.find(c => c.id === catId);
  if (!cat) throw new Error('Выберите категорию');
  let r = await sb.from('category_rules').upsert({ household_id: S.household.id, keyword: kw, category_id: catId },
    { onConflict: 'household_id,keyword' });
  if (r.error) throw r.error;
  r = await sb.from('transactions').update({ category_id: catId }).is('category_id', null).eq('kind', cat.kind)
    .ilike('note', '%' + kw.replace(/[\\%_]/g, m => '\\' + m) + '%').select('id');
  if (r.error) throw r.error;
  return r.data ? r.data.length : 0;
}

// ---------- повторяющиеся платежи ----------
// Операции сами не создаются (их присылает банк): платёж оплачен, если в месяце есть связанная операция
// или расход с ключевым словом в тексте. Из нескольких подходящих берём ближайший по сумме.
function recurStatus() {
  const [from] = monthRange();
  const y = S.month.getFullYear(), m = S.month.getMonth();
  const dim = new Date(y, m + 1, 0).getDate();
  const used = new Set(), tx = {};
  S.recur.forEach(r => {
    const t = S.tx.find(x => x.recurring_id === r.id && !used.has(x.id));
    if (t) { tx[r.id] = t; used.add(t.id); }
  });
  S.recur.forEach(r => {
    if (tx[r.id] || !r.keyword) return;
    const kw = norm(r.keyword);
    const t = S.tx.filter(x => x.kind === 'expense' && !x.recurring_id && !used.has(x.id) && norm(x.note).includes(kw))
      .sort((a, b) => Math.abs(a.amount - r.amount) - Math.abs(b.amount - r.amount))[0];
    if (t) { tx[r.id] = t; used.add(t.id); }
  });
  const dayNow = isCurMonth() ? new Date().getDate() : S.month > new Date() ? 0 : dim + 1;
  return S.recur.map(r => {
    const day = Math.min(r.day, dim);
    const skip = r.skip_month === from;
    return { r, day, skip, tx: tx[r.id] || null, late: !tx[r.id] && !skip && day < dayNow };
  });
}
function recurTotals() {
  let unpaid = 0, paid = 0;
  recurStatus().forEach(x => { if (x.tx) paid += +x.tx.amount; else if (!x.skip) unpaid += +x.r.amount; });
  return { unpaid, paid };
}

  }
  const list = recurStatus();
  const { unpaid, paid } = recurTotals();
  const rows = list.map(x => {

const CHART_MONTHS = 6;
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const shiftedMonth = k => new Date(S.month.getFullYear(), S.month.getMonth() + k, 1);

// PostgREST отдаёт не больше 1000 строк за раз, поэтому читаем страницами
async function fetchAll(build) {
  const out = [];
  for (let i = 0; ; i += 1000) {
    const { data, error } = await build().range(i, i + 999);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) return out;
  }
}

async function hydrateCharts() {
  const at = S.month.getTime(), key = at + '|' + S.dataVer;
  if (S.offline || S.histKey === key) return;
  S.histKey = key;
  try {
    const from = ymOf(shiftedMonth(1 - CHART_MONTHS)) + '-01', to = monthRange()[1];
    const rows = await fetchAll(() => sb.from('transactions').select('id,amount,category_id,date')
      .eq('kind', 'expense').gte('date', from).lt('date', to).order('id'));
    if (S.histKey !== key) return;
    S.hist = rows; S.histFor = at; S.histErr = false;
  } catch (e) {
    if (S.histKey !== key) return;
    S.histErr = true;
  }
  if (S.tab === 'lim' && S.limSub === 'charts') render();
}

function renderCharts() {
  if (S.offline) return '<div class="card"><div class="empty">Графикам нужна связь с сервером.</div></div>';
  if (S.histErr) return '<div class="card"><div class="empty">Не удалось загрузить данные. Попробуйте обновить приложение.</div></div>';
  if (!S.hist || S.histFor !== S.month.getTime()) return '<div class="card"><div class="empty">Загружаем…</div></div>';
  const months = Array.from({ length: CHART_MONTHS }, (_, i) => shiftedMonth(i + 1 - CHART_MONTHS));
  const ym = ymOf(S.month), prevYm = ymOf(shiftedMonth(-1));
  const sums = {};
  S.hist.forEach(t => { const k = t.date.slice(0, 7); sums[k] = (sums[k] || 0) + +t.amount; });
  const max = Math.max(1, ...months.map(d => sums[ymOf(d)] || 0));
  const cols = months.map(d => {
    const k = ymOf(d), v = sums[k] || 0, on = k === ym;
    const full = d.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
    return `<button class="mcol ${on ? 'on' : ''}" data-m="${d.getTime()}" aria-label="${esc(full)}: ${fmt(v)}" title="${esc(full)}: ${fmt(v)}">
      ${on ? `<span>${fmt(v)}</span>` : ''}<i style="height:${v / max * 130}px"></i></button>`;
  }).join('');
  const labels = months.map(d => `<span class="${ymOf(d) === ym ? 'on' : ''}">${esc(d.toLocaleDateString('ru-RU', { month: 'short' }).replace('.', ''))}</span>`).join('');

  // текущий месяц ещё не закончился: сравниваем с теми же днями прошлого месяца
  const cut = isCurMonth() ? new Date().getDate() : 31;
  const cur = {}, prev = {};
  let prevTotal = 0;
  S.hist.forEach(t => {
    const k = t.date.slice(0, 7), c = t.category_id || '';
    if (k === ym) cur[c] = (cur[c] || 0) + +t.amount;
    else if (k === prevYm && +t.date.slice(8) <= cut) { prev[c] = (prev[c] || 0) + +t.amount; prevTotal += +t.amount; }
  });
  const total = sums[ym] || 0, diff = total - prevTotal;
  const pm = shiftedMonth(-1).toLocaleDateString('ru-RU', { month: 'long' });
  const prevDays = new Date(S.month.getFullYear(), S.month.getMonth(), 0).getDate();
  const span = isCurMonth() ? `с 1 по ${Math.min(cut, prevDays)} число, ${pm}` : pm;
  const change = v => (Math.round(v) === 0 ? 'столько же' : (v > 0 ? 'на ' + fmt(v) + ' больше' : 'на ' + fmt(-v) + ' меньше'));
  const name = id => id ? ((S.cats.find(c => c.id === id) || {}).name || 'Без категории') : 'Без категории';
  const list = Object.keys(cur).sort((a, b) => cur[b] - cur[a]);
  const top = list.length ? cur[list[0]] : 1;
  const rows = list.map(c => `<div class="cat" style="cursor:default"><div class="row"><span>${esc(name(c))}</span><b>${fmt(cur[c])}</b></div>
    <div class="hbar" style="width:${cur[c] / top * 100}%"></div>
    <div class="mute" style="margin-top:4px">${prev[c] ? change(cur[c] - prev[c]) : 'в прошлом месяце за эти дни трат не было'}</div></div>`).join('');
  return `<div class="card"><b>Расходы по месяцам</b>
      <div class="mute">Нажмите на столбик, чтобы открыть месяц</div>
      <div class="cols">${cols}</div><div class="colx">${labels}</div></div>
    <div class="card"><div class="mute">Расходы за месяц</div><div class="big">${fmt(total)}</div>
      <div class="mute">${change(diff)}, чем: ${esc(span)}</div></div>
    <div class="card"><b>По категориям</b>${rows || '<div class="empty">В этом месяце расходов нет.</div>'}</div>`;
}


// ---------- резервная копия ----------
// Отдельная кнопка «Сохранить»: Safari разрешает «Поделиться» только сразу после нажатия, а файл готовится дольше
function saveFile(name, text, type) {
  const file = new File([text], name, { type });
  sheet(`<b>Файл готов</b>
    <p class="mute" style="overflow-wrap:anywhere">${esc(name)}</p>
    <button class="full" id="sv">Сохранить</button>
    <button class="ghost full" id="cl">Закрыть</button>`);
  $('#cl').onclick = closeSheet;
  $('#sv').onclick = async () => {
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return closeSheet(); }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    closeSheet();
  };
}

// разделитель «;» и запятая в суммах: так файл открывается в русском Excel. Текст из банка не должен стать формулой.
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function txCsv(rows) {
  const catName = id => (S.cats.find(c => c.id === id) || {}).name || '';
  const head = ['Дата', 'Тип', 'Сумма', 'Категория', 'Заметка', 'Кто', 'Общая'];
  const body = rows.map(t => [t.date, t.kind === 'income' ? 'Доход' : 'Расход', String(+t.amount).replace('.', ','),
    catName(t.category_id), t.note, nameOf(t.user_id), t.shared ? 'да' : 'нет'].map(csvCell).join(';'));
  return '﻿' + [head.join(';'), ...body].join('\r\n') + '\r\n';
}

async function exportCsv() {
  const t = toast('Готовим файл…', 0);
  try {
    const rows = await fetchAll(() => sb.from('transactions').select('*').order('date', { ascending: false }).order('id'));
    saveFile(`operacii-${today()}.csv`, txCsv(rows), 'text/csv');
  } catch (e) { toast('Не удалось выгрузить: ' + (e.message || e), 5000); }
  t.remove();
}

const BACKUP_TABLES = ['households', 'members', 'categories', 'transactions', 'category_rules', 'recurring_payments', 'goals', 'goal_deposits',
  'bank_inbox', 'products', 'pantry_items', 'staples', 'stores', 'prices', 'photos'];
async function exportJson() {
  const t = toast('Готовим файл…', 0);
  try {
    const out = { exported_at: new Date().toISOString() };
    for (const tb of BACKUP_TABLES) {
      out[tb] = await fetchAll(() => sb.from(tb).select('*').order(tb === 'members' ? 'user_id' : 'id'));
    }
    saveFile(`semya-kopiya-${today()}.json`, JSON.stringify(out, null, 1), 'application/json');
  } catch (e) { toast('Не удалось выгрузить: ' + (e.message || e), 5000); }
  t.remove();
}


// ---------- запуск ----------
function storedUser() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (/^sb-.*-auth-token$/.test(k)) { const v = JSON.parse(localStorage.getItem(k)); return (v && (v.user || (v.currentSession && v.currentSession.user))) || null; }
    }
  } catch (e) {}
  return null;
}

(async function init() {
  try { history.replaceState(null, ''); } catch (e) {}
  if (SUPABASE_URL.startsWith('ВСТАВЬТЕ')) {
    $('#app').innerHTML = '<div class="wrap"><div class="card"><b>Не настроено</b><p>Откройте index.html и вставьте SUPABASE_URL и SUPABASE_KEY.</p></div></div>';
    return;
  }
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'SIGNED_OUT') { S.user = null; S.me = null; renderAuth(); }
    else if (session && (!S.user || S.user.id !== session.user.id)) { S.user = session.user; load(); }
  });
  if (typeof navigator.serviceWorker === 'object' && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    // нет сети и просрочен вход: открываем сохранённые данные, вход обновится сам, когда сеть появится
    const snap = lsGet('fb_snap'), user = storedUser();
    if (snap && user && snap.uid === user.id && navigator.onLine === false) {
      S.user = user; applySnap(snap); S.offline = true; S.tx = mergePending(S.tx);
      S.booted = true; subscribe(); return render();
    }
    renderAuth();
  }
})();
</script>
